<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#6366f1;--accent-dim:rgba(99,102,241,0.15);--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);--text:#e2e8f0;--text-muted:#94a3b8;--btn-bg:rgba(255,255,255,0.07);--btn-hover:rgba(255,255,255,0.12)}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:var(--text);display:flex;flex-direction:column;align-items:center}
.back-btn{position:fixed;top:20px;left:20px;z-index:100;display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;color:var(--text);font-size:14px;font-weight:500;backdrop-filter:blur(20px);transition:all .3s;cursor:pointer;text-decoration:none}
.back-btn:hover{background:var(--accent-dim);border-color:var(--accent);transform:translateX(-3px)}
.main{width:100%;max-width:520px;padding:80px 16px 40px}
h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.subtitle{color:var(--text-muted);font-size:14px;margin-bottom:22px}
/* Tabs */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:14px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:9px 8px;border-radius:10px;border:none;background:transparent;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .25s;text-align:center}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
/* Calculator shell */
.calc-shell{background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:24px;backdrop-filter:blur(20px);overflow:hidden}
/* Display */
.display{padding:24px 22px 16px;background:rgba(0,0,0,0.2);text-align:right;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end}
.display-expr{font-size:13px;color:var(--text-muted);min-height:20px;word-break:break-all;transition:all .2s}
.display-val{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:700;word-break:break-all;line-height:1.2;transition:all .15s}
.display-val.error{color:#ef4444;font-size:1.2rem}
/* Buttons */
.btns{padding:14px;display:grid;gap:8px}
.grid-std{grid-template-columns:repeat(4,1fr)}
.grid-sci{grid-template-columns:repeat(5,1fr)}
.btn-calc{padding:0;height:56px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:var(--btn-bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;user-select:none}
.btn-calc:hover{background:var(--btn-hover);transform:scale(1.04)}
.btn-calc:active{transform:scale(0.96);background:rgba(255,255,255,0.18)}
.btn-calc.op{background:rgba(99,102,241,0.15);color:#a5b4fc;border-color:rgba(99,102,241,0.2)}
.btn-calc.op:hover{background:rgba(99,102,241,0.25)}
.btn-calc.eq{background:var(--accent);color:#fff;border-color:var(--accent);font-size:20px}
.btn-calc.eq:hover{background:#5558e3;box-shadow:0 4px 20px rgba(99,102,241,0.4)}
.btn-calc.clear{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.2)}
.btn-calc.clear:hover{background:rgba(239,68,68,0.25)}
.btn-calc.sci-fn{background:rgba(124,58,237,0.13);color:#c4b5fd;border-color:rgba(124,58,237,0.2);font-size:12px}
.btn-calc.sci-fn:hover{background:rgba(124,58,237,0.22)}
.btn-calc.wide{grid-column:span 2}
/* History */
.history-section{margin-top:16px}
.history-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.history-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.history-list::-webkit-scrollbar{width:3px}
.history-list::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:2px}
.history-item{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:10px 14px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:baseline}
.history-item:hover{border-color:var(--accent);background:var(--accent-dim)}
.history-expr{font-size:12px;color:var(--text-muted)}
.history-result{font-size:15px;font-weight:700;color:#a5b4fc}
/* Converter */
.converter{padding:20px}
.conv-section{margin-bottom:20px}
.conv-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:10px}
.conv-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.conv-arrow{color:var(--accent);font-size:20px;text-align:center;font-weight:700}
.conv-result{font-size:1.4rem;font-weight:700;color:#a5b4fc;text-align:center;padding:14px;background:var(--accent-dim);border-radius:12px;border:1px solid rgba(99,102,241,0.2);margin-top:10px}
input[type=number],select{background:rgba(255,255,255,0.07);border:1px solid var(--glass-border);border-radius:12px;padding:11px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
input[type=number]:focus,select:focus{border-color:var(--accent)}
select option{background:#1e1b4b}
/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;font-size:13px;z-index:999;transition:transform .4s}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<a href="../../index.html" class="back-btn">← Back</a>
<div class="main">
  <h1>🔢 Calculator</h1>
  <p class="subtitle">Standard · Scientific · Currency · Units</p>

  <div class="tabs">
    <button class="tab active" onclick="switchMode('std')">Standard</button>
    <button class="tab" onclick="switchMode('sci')">Scientific</button>
    <button class="tab" onclick="switchMode('currency')">Currency</button>
    <button class="tab" onclick="switchMode('units')">Units</button>
  </div>

  <!-- STANDARD & SCIENTIFIC CALC -->
  <div id="calc-panel">
    <div class="calc-shell">
      <div class="display">
        <div class="display-expr" id="displayExpr"></div>
        <div class="display-val" id="displayVal">0</div>
      </div>
      <div class="btns" id="btnGrid"></div>
    </div>
    <div class="history-section">
      <div class="history-title">
        <span>History</span>
        <button onclick="clearHistory()" style="background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:12px">Clear</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- CURRENCY CONVERTER -->
  <div id="currency-panel" style="display:none" class="calc-shell">
    <div class="converter">
      <div class="conv-title">Currency Converter</div>
      <div class="conv-grid">
        <input type="number" id="currAmount" value="1" oninput="convertCurrency()">
        <div class="conv-arrow">→</div>
        <div id="currResult" style="font-size:1.1rem;font-weight:700;color:#a5b4fc;padding:12px;background:var(--accent-dim);border-radius:12px;border:1px solid rgba(99,102,241,0.2);text-align:center">—</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <select id="currFrom" onchange="convertCurrency()"></select>
        <select id="currTo" onchange="convertCurrency()"></select>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:10px;text-align:center">Rates relative to USD (hardcoded)</div>
    </div>
  </div>

  <!-- UNIT CONVERTER -->
  <div id="units-panel" style="display:none" class="calc-shell">
    <div class="converter">
      <div class="conv-title">Unit Converter</div>
      <div style="margin-bottom:14px">
        <select id="unitCategory" onchange="updateUnitCategory()" style="margin-bottom:12px">
          <option value="length">Length</option>
          <option value="weight">Weight / Mass</option>
          <option value="temperature">Temperature</option>
          <option value="area">Area</option>
          <option value="volume">Volume</option>
        </select>
      </div>
      <div class="conv-grid">
        <input type="number" id="unitAmount" value="1" oninput="convertUnit()">
        <div class="conv-arrow">→</div>
        <div id="unitResult" style="font-size:1.1rem;font-weight:700;color:#a5b4fc;padding:12px;background:var(--accent-dim);border-radius:12px;border:1px solid rgba(99,102,241,0.2);text-align:center">—</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <select id="unitFrom" onchange="convertUnit()"></select>
        <select id="unitTo" onchange="convertUnit()"></select>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── State ───
let expr='',result='0',memory=0,mode='std',angleMode='deg';
let history=JSON.parse(localStorage.getItem('calc_history')||'[]');

// ─── Currency data ───
const CURRENCIES={USD:1,EUR:0.92,GBP:0.79,JPY:149.5,CAD:1.36,AUD:1.53,CHF:0.89,CNY:7.24,INR:83.2,BRL:4.97,MXN:17.1,KRW:1325,SGD:1.34,HKD:7.82,NOK:10.6,SEK:10.4,DKK:6.88,NZD:1.63,ZAR:18.7,AED:3.67};
const CURR_NAMES={USD:'🇺🇸 USD – US Dollar',EUR:'🇪🇺 EUR – Euro',GBP:'🇬🇧 GBP – British Pound',JPY:'🇯🇵 JPY – Japanese Yen',CAD:'🇨🇦 CAD – Canadian Dollar',AUD:'🇦🇺 AUD – Australian Dollar',CHF:'🇨🇭 CHF – Swiss Franc',CNY:'🇨🇳 CNY – Chinese Yuan',INR:'🇮🇳 INR – Indian Rupee',BRL:'🇧🇷 BRL – Brazilian Real',MXN:'🇲🇽 MXN – Mexican Peso',KRW:'🇰🇷 KRW – South Korean Won',SGD:'🇸🇬 SGD – Singapore Dollar',HKD:'🇭🇰 HKD – Hong Kong Dollar',NOK:'🇳🇴 NOK – Norwegian Krone',SEK:'🇸🇪 SEK – Swedish Krona',DKK:'🇩🇰 DKK – Danish Krone',NZD:'🇳🇿 NZD – New Zealand Dollar',ZAR:'🇿🇦 ZAR – South African Rand',AED:'🇦🇪 AED – UAE Dirham'};

// ─── Unit data ───
const UNITS={
  length:{m:1,km:0.001,cm:100,mm:1000,mi:0.000621371,yd:1.09361,ft:3.28084,in:39.3701,nm:1e9,'µm':1e6},
  weight:{kg:1,g:1000,mg:1e6,lb:2.20462,oz:35.274,t:0.001,'st (stone)':0.157473,ct:5000},
  temperature:null,// special
  area:{'m²':1,'km²':1e-6,'cm²':1e4,'mm²':1e6,'ft²':10.7639,'in²':1550.0031,'yd²':1.19599,'ac (acres)':0.000247105,'ha (hectares)':0.0001},
  volume:{'L':1,'mL':1000,'m³':0.001,'cm³':1000,'ft³':0.0353147,'in³':61.0237,'gal (US)':0.264172,'qt (US)':1.05669,'pt (US)':2.11338,'fl oz':33.814}
};

const UNIT_LABELS={length:'Length',weight:'Weight / Mass',temperature:'Temperature',area:'Area',volume:'Volume'};

function toRad(d){return d*Math.PI/180}
function factorial(n){if(n<0)return NaN;if(n===0||n===1)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r}

// ─── Display ───
function updateDisplay(){
  document.getElementById('displayVal').textContent=result||'0';
  document.getElementById('displayVal').classList.toggle('error',result==='Error'||result==='Undefined');
  document.getElementById('displayExpr').textContent=expr;
}

// ─── Button press ───
function press(v){
  if(v==='C'){expr='';result='0';updateDisplay();return}
  if(v==='CE'){result='0';updateDisplay();return}
  if(v==='⌫'){
    if(result!=='0'&&result!=='Error'){
      result=result.length>1?result.slice(0,-1):'0';
      updateDisplay();
    }return}
  if(v==='='){calculate();return}
  if(v==='±'){result=(parseFloat(result)||0)*-1+'';updateDisplay();return}
  if(v==='%'){result=(parseFloat(result)||0)/100+'';updateDisplay();return}
  if(v==='M+'){memory+=parseFloat(result)||0;showToast('M+ '+memory);return}
  if(v==='M-'){memory-=parseFloat(result)||0;showToast('M- '+memory);return}
  if(v==='MR'){result=memory+'';updateDisplay();return}
  if(v==='MC'){memory=0;showToast('Memory cleared');return}
  // Append to expression
  if(result==='Error')result='0';
  // Scientific functions
  const unary=['sin','cos','tan','log','ln','√','x²','x³','1/x','|x|','10^x','e^x'];
  if(unary.includes(v)){applyUnary(v);return}
  if(v==='π'){appendToResult(Math.PI+'');return}
  if(v==='e'){appendToResult(Math.E+'');return}
  if(v==='n!'){applyUnary('n!');return}
  if(v==='Ans'){appendToResult(result);return}
  appendToResult(v);
}

function appendToResult(v){
  const ops='+-×÷^';
  const isOp=ops.includes(v);
  if(result==='0'&&!isOp&&v!=='.'){result=v}
  else{result+=v}
  updateDisplay();
}

function applyUnary(fn){
  const x=parseFloat(result);
  if(isNaN(x)){result='Error';updateDisplay();return}
  const rad=angleMode==='deg'?toRad(x):x;
  let r;
  switch(fn){
    case'sin':r=Math.sin(rad);break;
    case'cos':r=Math.cos(rad);break;
    case'tan':r=Math.tan(rad);break;
    case'log':r=Math.log10(x);break;
    case'ln':r=Math.log(x);break;
    case'√':r=Math.sqrt(x);break;
    case'x²':r=x*x;break;
    case'x³':r=x*x*x;break;
    case'1/x':r=1/x;break;
    case'|x|':r=Math.abs(x);break;
    case'10^x':r=Math.pow(10,x);break;
    case'e^x':r=Math.exp(x);break;
    case'n!':r=factorial(Math.round(x));break;
  }
  const exprOld=result;
  result=isFinite(r)?formatNum(r):'Error';
  expr=`${fn}(${exprOld}) =`;
  addHistory(`${fn}(${exprOld})`,result);
  updateDisplay();
}

function calculate(){
  if(!result)return;
  const raw=result;
  try{
    // Replace display operators with JS operators
    let evalStr=result
      .replace(/×/g,'*').replace(/÷/g,'/')
      .replace(/\^/g,'**')
      .replace(/π/g,Math.PI)
      .replace(/(?<!\w)e(?!\w)/g,Math.E);
    // Whitelist: only allow digits, operators, parens, dot, space — block anything else
    if(!/^[\d\s\+\-\*\/\.\(\)\%\^eE\.]+$/.test(evalStr.replace(String(Math.PI),'').replace(String(Math.E),'')))
      throw new Error('Invalid expression');
    // eslint-disable-next-line no-new-func
    const val=Function('"use strict";return ('+evalStr+')')();
    if(!isFinite(val)){result='Error';}
    else{result=formatNum(val);}
    expr=raw+' =';
    addHistory(raw,result);
  }catch(e){result='Error';}
  updateDisplay();
}

function formatNum(n){
  if(Math.abs(n)>=1e15||Math.abs(n)<1e-10&&n!==0)return n.toExponential(6);
  // Remove trailing zeros after decimal
  const s=''+parseFloat(n.toPrecision(12));
  return s;
}

function addHistory(e,r){
  history.unshift({expr:e,result:r});
  if(history.length>20)history.pop();
  localStorage.setItem('calc_history',JSON.stringify(history));
  renderHistory();
}

function clearHistory(){history=[];localStorage.setItem('calc_history','[]');renderHistory()}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!history.length){el.innerHTML='<div style="color:var(--text-muted);font-size:13px;padding:8px">No history yet</div>';return}
  el.innerHTML=history.map((h,i)=>`<div class="history-item" onclick="useHistory(${i})">
    <span class="history-expr">${escHtml(h.expr)}</span>
    <span class="history-result">${escHtml(h.result)}</span>
  </div>`).join('');
}

function useHistory(i){result=history[i].result;updateDisplay()}

// ─── Keyboard ───
document.addEventListener('keydown',e=>{
  if(mode!=='std'&&mode!=='sci')return;
  const map={'Enter':'=','Backspace':'⌫','Escape':'C','*':'×','/':'÷'};
  const k=map[e.key]||e.key;
  if('0123456789.+-×÷^()%'.includes(k)||k==='='||k==='C'||k==='⌫')press(k);
});

// ─── Mode buttons ───
const STD_BTNS=[
  ['C','CE','%','÷'],
  ['7','8','9','×'],
  ['4','5','6','-'],
  ['1','2','3','+'],
  ['±','0','.','=']
];
const SCI_BTNS=[
  ['sin','cos','tan','(',')','C'],
  ['log','ln','√','x²','x³','÷'],
  ['n!','1/x','|x|','π','e','×'],
  ['10^x','e^x','^','7','8','-'],
  ['M+','MR','MC','4','5','+'],
  ['Ans','⌫','±','1','2','3'],
  ['%','CE','.','0','0','=']
];

function renderButtons(){
  const grid=document.getElementById('btnGrid');
  const btns=mode==='sci'?SCI_BTNS:STD_BTNS;
  grid.className='btns '+(mode==='sci'?'grid-sci':'grid-std');
  grid.innerHTML=btns.flat().map(b=>{
    let cls='btn-calc';
    if(['÷','×','-','+','^'].includes(b))cls+=' op';
    else if(b==='=')cls+=' eq';
    else if(['C','CE','⌫'].includes(b))cls+=' clear';
    else if(['sin','cos','tan','log','ln','√','x²','x³','n!','1/x','|x|','10^x','e^x','π','e','M+','MR','MC','Ans','(',')','%'].includes(b))cls+=' sci-fn';
    return `<button class="${cls}" onclick="press('${b}')">${b}</button>`;
  }).join('');
}

function switchMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['std','sci','currency','units'][i]===m));
  document.getElementById('calc-panel').style.display=(m==='std'||m==='sci')?'block':'none';
  document.getElementById('currency-panel').style.display=m==='currency'?'block':'none';
  document.getElementById('units-panel').style.display=m==='units'?'block':'none';
  if(m==='std'||m==='sci'){renderButtons();updateDisplay()}
  if(m==='currency')convertCurrency();
  if(m==='units')convertUnit();
}

// ─── Currency ───
function initCurrency(){
  const codes=Object.keys(CURRENCIES);
  const fs=document.getElementById('currFrom');
  const ts=document.getElementById('currTo');
  codes.forEach(c=>{
    fs.innerHTML+=`<option value="${c}">${CURR_NAMES[c]||c}</option>`;
    ts.innerHTML+=`<option value="${c}">${CURR_NAMES[c]||c}</option>`;
  });
  ts.value='EUR';
}

function convertCurrency(){
  const amt=parseFloat(document.getElementById('currAmount').value)||0;
  const from=document.getElementById('currFrom').value;
  const to=document.getElementById('currTo').value;
  const inUSD=amt/CURRENCIES[from];
  const res=inUSD*CURRENCIES[to];
  document.getElementById('currResult').textContent=res.toLocaleString('en-US',{maximumFractionDigits:4})+' '+to;
}

// ─── Units ───
function initUnits(){updateUnitCategory()}
function updateUnitCategory(){
  const cat=document.getElementById('unitCategory').value;
  const fEl=document.getElementById('unitFrom');
  const tEl=document.getElementById('unitTo');
  fEl.innerHTML='';tEl.innerHTML='';
  if(cat==='temperature'){
    ['Celsius','Fahrenheit','Kelvin'].forEach(u=>{fEl.innerHTML+=`<option>${u}</option>`;tEl.innerHTML+=`<option>${u}</option>`});
    tEl.value='Fahrenheit';
  }else{
    Object.keys(UNITS[cat]).forEach(u=>{fEl.innerHTML+=`<option>${u}</option>`;tEl.innerHTML+=`<option>${u}</option>`});
    const keys=Object.keys(UNITS[cat]);if(keys[1])tEl.value=keys[1];
  }
  convertUnit();
}

function convertUnit(){
  const cat=document.getElementById('unitCategory').value;
  const amt=parseFloat(document.getElementById('unitAmount').value)||0;
  const from=document.getElementById('unitFrom').value;
  const to=document.getElementById('unitTo').value;
  let res;
  if(cat==='temperature'){
    if(from===to){res=amt}
    else if(from==='Celsius'&&to==='Fahrenheit')res=amt*9/5+32;
    else if(from==='Celsius'&&to==='Kelvin')res=amt+273.15;
    else if(from==='Fahrenheit'&&to==='Celsius')res=(amt-32)*5/9;
    else if(from==='Fahrenheit'&&to==='Kelvin')res=(amt-32)*5/9+273.15;
    else if(from==='Kelvin'&&to==='Celsius')res=amt-273.15;
    else if(from==='Kelvin'&&to==='Fahrenheit')res=(amt-273.15)*9/5+32;
  }else{
    const table=UNITS[cat];
    const inBase=amt/table[from];
    res=inBase*table[to];
  }
  const disp=Math.abs(res)>=1e10||Math.abs(res)<0.0001&&res!==0?res.toExponential(4):parseFloat(res.toPrecision(8))+'';
  document.getElementById('unitResult').textContent=disp+' '+to;
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
