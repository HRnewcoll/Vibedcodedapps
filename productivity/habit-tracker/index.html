<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--accent:#6366f1;--accent-dim:rgba(99,102,241,0.15);--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);--text:#e2e8f0;--text-muted:#94a3b8;--danger:#ef4444;--success:#22c55e}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:var(--text);overflow-x:hidden}
  a{color:var(--accent);text-decoration:none}
  .back-btn{position:fixed;top:20px;left:20px;z-index:100;display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;color:var(--text);font-size:14px;font-weight:500;backdrop-filter:blur(20px);transition:all .3s;cursor:pointer}
  .back-btn:hover{background:var(--accent-dim);border-color:var(--accent);transform:translateX(-3px)}
  .container{max-width:900px;margin:0 auto;padding:80px 20px 40px}
  h1{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;background:linear-gradient(135deg,#a78bfa,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
  .subtitle{color:var(--text-muted);font-size:15px;margin-bottom:30px}
  .glass-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;backdrop-filter:blur(20px);padding:24px;margin-bottom:20px}
  .section-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px}
  /* Add Habit Form */
  .add-form{display:grid;gap:14px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.form-row{grid-template-columns:1fr}}
  input,select{background:rgba(255,255,255,0.07);border:1px solid var(--glass-border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
  input:focus,select:focus{border-color:var(--accent)}
  input::placeholder{color:var(--text-muted)}
  select option{background:#1e1b4b;color:var(--text)}
  .emoji-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .emoji-btn{width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:rgba(255,255,255,0.07);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .emoji-btn:hover,.emoji-btn.selected{border-color:var(--accent);background:var(--accent-dim);transform:scale(1.1)}
  .btn{padding:12px 24px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#5558e3;transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.4)}
  .btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
  .btn-ghost{background:transparent;border:1px solid var(--glass-border);color:var(--text-muted)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  /* Habits List */
  .habits-list{display:flex;flex-direction:column;gap:14px}
  .habit-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;backdrop-filter:blur(20px);padding:18px 20px;display:flex;flex-direction:column;gap:14px;transition:border-color .3s}
  .habit-card.completed-today{border-color:rgba(99,102,241,0.5);background:rgba(99,102,241,0.08)}
  .habit-top{display:flex;align-items:center;gap:14px}
  .habit-icon{width:46px;height:46px;border-radius:14px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .habit-info{flex:1}
  .habit-name{font-weight:700;font-size:16px;margin-bottom:2px}
  .habit-meta{font-size:12px;color:var(--text-muted)}
  .habit-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .check-btn{width:42px;height:42px;border-radius:12px;border:2px solid var(--glass-border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .25s;color:var(--text-muted)}
  .check-btn:hover{border-color:var(--success);color:var(--success);transform:scale(1.05)}
  .check-btn.done{background:var(--success);border-color:var(--success);color:#fff}
  .check-btn.done:hover{background:#16a34a}
  .delete-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--glass-border);background:transparent;cursor:pointer;color:var(--text-muted);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .delete-btn:hover{border-color:var(--danger);color:var(--danger);background:rgba(239,68,68,0.1)}
  /* Stats row */
  .stats-row{display:flex;gap:16px;flex-wrap:wrap}
  .stat-pill{background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:#a5b4fc;display:flex;align-items:center;gap:5px}
  /* Heatmap */
  .heatmap{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .heatmap-cell{width:18px;height:18px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);transition:all .2s;cursor:default;position:relative}
  .heatmap-cell.level-1{background:rgba(99,102,241,0.3)}
  .heatmap-cell.level-2{background:rgba(99,102,241,0.6)}
  .heatmap-cell.level-3{background:#6366f1}
  .heatmap-cell:hover::after{content:attr(data-date);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e1b4b;border:1px solid var(--glass-border);color:var(--text);font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:10;pointer-events:none}
  /* Weekly bars */
  .bar-chart{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}
  .bar-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--accent),#a78bfa);min-height:4px;transition:height .5s cubic-bezier(.4,0,.2,1)}
  .bar-label{font-size:10px;color:var(--text-muted)}
  /* Toast */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;padding:14px 28px;border-radius:14px;font-weight:600;font-size:14px;z-index:999;transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 40px rgba(99,102,241,0.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  /* Tabs */
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,0.04);border-radius:12px;padding:4px;margin-bottom:20px;border:1px solid var(--glass-border)}
  .tab{flex:1;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;text-align:center}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
  /* Empty */
  .empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
  .empty-icon{font-size:52px;margin-bottom:14px}
  /* Overall stats */
  .overall-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px}
  .stat-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;backdrop-filter:blur(20px);padding:20px 18px;text-align:center}
  .stat-val{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .stat-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  /* Motivational banner */
  .motivation{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(124,58,237,0.2));border:1px solid rgba(99,102,241,0.3);border-radius:16px;padding:18px 22px;margin-bottom:20px;display:none;align-items:center;gap:14px;animation:slideIn .5s ease}
  .motivation.visible{display:flex}
  @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  .motivation-text{font-size:15px;font-weight:600;color:#c4b5fd}
</style>
</head>
<body>

<a href="../../index.html" class="back-btn">← Back</a>

<div class="container">
  <h1>🎯 Habit Tracker</h1>
  <p class="subtitle">Build habits that stick — one day at a time</p>

  <!-- Overall Stats -->
  <div class="overall-stats" id="overallStats"></div>

  <!-- Motivation Banner -->
  <div class="motivation" id="motivationBanner">
    <span style="font-size:28px">🎉</span>
    <div>
      <div class="motivation-text" id="motivationText">Keep it up!</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px">You're on a roll today!</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('today')">Today</button>
    <button class="tab" onclick="switchTab('stats')">Stats & Charts</button>
    <button class="tab" onclick="switchTab('add')">+ New Habit</button>
  </div>

  <!-- TODAY TAB -->
  <div id="tab-today">
    <div class="habits-list" id="habitsList"></div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" style="display:none">
    <div class="glass-card">
      <div class="section-title">Weekly Completion Rate</div>
      <div class="bar-chart" id="weeklyChart"></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;padding:0 2px" id="weeklyLabels"></div>
    </div>
    <div id="perHabitStats"></div>
  </div>

  <!-- ADD HABIT TAB -->
  <div id="tab-add" style="display:none">
    <div class="glass-card">
      <div class="section-title">Create New Habit</div>
      <div class="add-form">
        <input type="text" id="habitName" placeholder="Habit name (e.g. Morning Run)">
        <div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:500">Choose an icon</div>
          <div class="emoji-picker" id="emojiPicker"></div>
        </div>
        <div class="form-row">
          <div>
            <select id="habitFreq">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly (any 3 days)</option>
            </select>
          </div>
          <div>
            <select id="habitColor">
              <option value="indigo">Indigo</option>
              <option value="violet">Violet</option>
              <option value="emerald">Emerald</option>
              <option value="amber">Amber</option>
              <option value="rose">Rose</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" onclick="addHabit()">Create Habit</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EMOJIS=['🏃','💪','📚','🧘','💧','🥗','😴','✍️','🎨','🎵','🧹','💊','🚶','🏊','🧠','💻','📖','🌿','☕','🦷'];
const COLORS={indigo:'#6366f1',violet:'#7c3aed',emerald:'#10b981',amber:'#f59e0b',rose:'#f43f5e'};
const MOTIVATIONS=["🔥 You're on fire! Keep going!","⚡ Another one checked! You're unstoppable!","🌟 Fantastic work — momentum is building!","🚀 Consistency is your superpower!","💎 Day by day you're becoming better!","🏆 Champions show up every day. Just like you!","✨ Small steps, massive results. Keep it up!","🎯 Locked in and crushing it!"];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let habits=JSON.parse(localStorage.getItem('habits')||'[]');
let completions=JSON.parse(localStorage.getItem('completions')||'{}');
let selectedEmoji=EMOJIS[0];

function save(){localStorage.setItem('habits',JSON.stringify(habits));localStorage.setItem('completions',JSON.stringify(completions))}
function todayKey(){return new Date().toISOString().slice(0,10)}
function dateKey(d){return d.toISOString().slice(0,10)}

function switchTab(t){
  ['today','stats','add'].forEach(id=>{
    document.getElementById('tab-'+id).style.display=id===t?'block':'none';
    document.querySelectorAll('.tab')[['today','stats','add'].indexOf(id)].classList.toggle('active',id===t);
  });
  if(t==='stats')renderStats();
}

function addHabit(){
  const name=document.getElementById('habitName').value.trim();
  if(!name){showToast('Please enter a habit name');return}
  const habit={id:Date.now().toString(),name,emoji:selectedEmoji,freq:document.getElementById('habitFreq').value,color:document.getElementById('habitColor').value,created:todayKey()};
  habits.push(habit);save();
  document.getElementById('habitName').value='';
  showToast('✅ Habit created!');
  switchTab('today');
  renderHabits();renderOverall();
}

function toggleComplete(id){
  const key=todayKey();
  if(!completions[key])completions[key]={};
  if(completions[key][id]){delete completions[key][id]}
  else{completions[key][id]=true;triggerMotivation()}
  save();renderHabits();renderOverall();
}

function deleteHabit(id){
  habits=habits.filter(h=>h.id!==id);
  save();renderHabits();renderOverall();
  showToast('Habit deleted');
}

function getStreak(habitId){
  let streak=0;const today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const k=dateKey(d);
    if(completions[k]&&completions[k][habitId])streak++;
    else if(i>0)break;
  }
  return streak;
}

function getLongestStreak(habitId){
  let max=0,cur=0;
  for(let i=364;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=dateKey(d);
    if(completions[k]&&completions[k][habitId]){cur++;max=Math.max(max,cur)}
    else{cur=0}
  }
  return max;
}

function getTotalCompletions(habitId){
  return Object.values(completions).filter(day=>day[habitId]).length;
}

function renderHabits(){
  const el=document.getElementById('habitsList');
  if(!habits.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">🌱</div><div>No habits yet.<br>Start building your routine!</div></div>';
    return;
  }
  el.innerHTML=habits.map(h=>{
    const done=!!(completions[todayKey()]&&completions[todayKey()][h.id]);
    const streak=getStreak(h.id);
    const total=getTotalCompletions(h.id);
    const heatmap=renderHeatmap(h.id);
    const colorHex=COLORS[h.color]||COLORS.indigo;
    return `<div class="habit-card ${done?'completed-today':''}">
      <div class="habit-top">
        <div class="habit-icon" style="background:${colorHex}22;border:1px solid ${colorHex}44">${h.emoji}</div>
        <div class="habit-info">
          <div class="habit-name">${h.name}</div>
          <div class="habit-meta">${h.freq==='daily'?'Daily':'Weekly'} · ${total} total completions</div>
        </div>
        <div class="habit-actions">
          <button class="check-btn ${done?'done':''}" onclick="toggleComplete('${h.id}')" title="${done?'Mark incomplete':'Mark complete'}">
            ${done?'✓':'○'}
          </button>
          <button class="delete-btn" onclick="deleteHabit('${h.id}')" title="Delete">✕</button>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-pill">🔥 ${streak} day streak</div>
        <div class="stat-pill">🏆 ${getLongestStreak(h.id)} best</div>
        <div class="stat-pill">📅 ${total} total</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">Last 30 days</div>
        <div class="heatmap">${heatmap}</div>
      </div>
    </div>`;
  }).join('');
}

function renderHeatmap(habitId){
  let cells='';
  for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=dateKey(d);
    const done=completions[k]&&completions[k][habitId];
    cells+=`<div class="heatmap-cell ${done?'level-3':''}" data-date="${k}" title="${k}"></div>`;
  }
  return cells;
}

function renderOverall(){
  const today=todayKey();
  const doneToday=habits.filter(h=>completions[today]&&completions[today][h.id]).length;
  const totalStreaks=habits.reduce((s,h)=>s+getStreak(h.id),0);
  const totalComp=habits.reduce((s,h)=>s+getTotalCompletions(h.id),0);
  document.getElementById('overallStats').innerHTML=`
    <div class="stat-card"><div class="stat-val">${habits.length}</div><div class="stat-lbl">Total Habits</div></div>
    <div class="stat-card"><div class="stat-val">${doneToday}/${habits.length}</div><div class="stat-lbl">Done Today</div></div>
    <div class="stat-card"><div class="stat-val">${totalStreaks}</div><div class="stat-lbl">Combined Streak</div></div>
    <div class="stat-card"><div class="stat-val">${totalComp}</div><div class="stat-lbl">All Time</div></div>`;
}

function renderStats(){
  // Weekly chart
  const chartEl=document.getElementById('weeklyChart');
  const labelsEl=document.getElementById('weeklyLabels');
  const days=[];
  let maxVal=1;
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=dateKey(d);
    const count=habits.filter(h=>completions[k]&&completions[k][h.id]).length;
    days.push({label:DAYS[d.getDay()],count,date:k});
    if(count>maxVal)maxVal=count;
  }
  chartEl.innerHTML=days.map(d=>{
    const pct=habits.length?Math.round((d.count/Math.max(habits.length,1))*100):0;
    const h=Math.max(4,Math.round(60*(d.count/maxVal)));
    return `<div class="bar-wrap"><div style="font-size:10px;color:var(--text-muted)">${d.count}</div><div class="bar" style="height:${h}px" title="${d.date}: ${d.count} habits"></div><div class="bar-label">${d.label}</div></div>`;
  }).join('');

  // Per habit stats
  const el=document.getElementById('perHabitStats');
  el.innerHTML=habits.map(h=>{
    const streak=getStreak(h.id);const longest=getLongestStreak(h.id);const total=getTotalCompletions(h.id);
    const last7=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=dateKey(d);return completions[k]&&completions[k][h.id]?1:0});
    const week7=last7.reduce((a,b)=>a+b,0);
    return `<div class="glass-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <span style="font-size:24px">${h.emoji}</span>
        <div><div style="font-weight:700">${h.name}</div><div style="font-size:12px;color:var(--text-muted)">${h.freq}</div></div>
      </div>
      <div class="stats-row" style="margin-bottom:14px">
        <div class="stat-pill">🔥 ${streak} streak</div>
        <div class="stat-pill">🏆 ${longest} best</div>
        <div class="stat-pill">📅 ${total} total</div>
        <div class="stat-pill">📆 ${week7}/7 this week</div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Last 7 days</div>
      <div style="display:flex;gap:6px">
        ${last7.map((v,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return `<div style="flex:1;text-align:center"><div style="height:40px;border-radius:6px;background:${v?'var(--accent)':'rgba(255,255,255,0.05)'};margin-bottom:4px"></div><div style="font-size:10px;color:var(--text-muted)">${DAYS[d.getDay()]}</div></div>`}).join('')}
      </div>
    </div>`;
  }).join('')||'<div class="glass-card"><div class="empty"><div class="empty-icon">📊</div><div>Create habits to see stats</div></div></div>';
}

function triggerMotivation(){
  const doneCount=habits.filter(h=>completions[todayKey()]&&completions[todayKey()][h.id]).length;
  if(doneCount>0){
    const el=document.getElementById('motivationBanner');
    document.getElementById('motivationText').textContent=MOTIVATIONS[Math.floor(Math.random()*MOTIVATIONS.length)];
    el.classList.add('visible');
    setTimeout(()=>el.classList.remove('visible'),4000);
  }
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Init emoji picker
(function(){
  const picker=document.getElementById('emojiPicker');
  EMOJIS.forEach((e,i)=>{
    const btn=document.createElement('button');btn.className='emoji-btn'+(i===0?' selected':'');
    btn.textContent=e;
    btn.onclick=()=>{selectedEmoji=e;picker.querySelectorAll('.emoji-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')};
    picker.appendChild(btn);
  });
})();

renderHabits();
renderOverall();
</script>
</body>
</html>
