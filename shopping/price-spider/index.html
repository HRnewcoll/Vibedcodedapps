<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Price Spider – Price Comparison Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0d1b2a;--bg2:#1b2838;--bg3:#1e3a5f;
  --blue:#3b82f6;--blue2:#2563eb;--blue3:#1d4ed8;
  --glass:rgba(59,130,246,0.08);--glass2:rgba(255,255,255,0.04);
  --border:rgba(59,130,246,0.2);--text:#e0f2fe;--text2:#93c5fd;
}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));min-height:100vh;color:var(--text)}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(59,130,246,0.1) 0%,transparent 60%);pointer-events:none;z-index:0}

nav{position:sticky;top:0;z-index:100;background:rgba(13,27,42,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.back-btn{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text2);font-size:14px;font-weight:500;padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--glass);transition:.2s}
.back-btn:hover{background:rgba(59,130,246,0.2);color:#bfdbfe}
.back-btn svg{width:16px;height:16px}
nav h1{font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--blue),#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:24px}

/* Search */
.search-section{background:rgba(20,35,55,0.7);border:1px solid var(--border);border-radius:20px;padding:28px;backdrop-filter:blur(10px)}
.search-section h2{font-size:22px;font-weight:700;color:var(--blue);margin-bottom:6px}
.search-section p{font-size:13px;color:var(--text2);opacity:.7;margin-bottom:20px}
.search-row{display:flex;gap:10px}
#searchInput{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);padding:13px 18px;border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:.2s}
#searchInput:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
#searchInput::placeholder{color:rgba(147,197,253,0.35)}
.search-btn{padding:13px 24px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;white-space:nowrap}
.search-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,0.4)}
.recent-searches{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.recent-label{font-size:12px;color:var(--text2);opacity:.5}
.recent-chip{padding:5px 12px;background:var(--glass2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;transition:.2s}
.recent-chip:hover{background:rgba(59,130,246,0.15);color:#bfdbfe}

/* Filters */
.filter-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{font-size:11px;color:var(--text2);opacity:.6;text-transform:uppercase;letter-spacing:.5px}
.filter-select{background:rgba(20,35,55,0.8);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--blue)}
.price-range-wrap{display:flex;align-items:center;gap:8px}
#priceRange{-webkit-appearance:none;width:140px;height:4px;border-radius:2px;background:linear-gradient(to right,var(--blue) 0%,var(--blue) 50%,rgba(59,130,246,0.2) 50%);cursor:pointer;outline:none}
#priceRange::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer}
#priceRangeVal{font-size:12px;color:var(--text2);min-width:55px}
.toggle-filter{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text2);padding:8px 12px;background:var(--glass2);border:1px solid var(--border);border-radius:8px;transition:.2s;user-select:none}
.toggle-filter:hover{background:var(--glass)}
.toggle-filter input{accent-color:var(--blue)}

/* Searching animation */
.searching{text-align:center;padding:40px;color:var(--text2)}
.searching-dots span{display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:50%;margin:0 3px;animation:bounce .8s ease-in-out infinite}
.searching-dots span:nth-child(2){animation-delay:.15s}
.searching-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.5)}40%{transform:scale(1)}}

/* Results */
.results-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.results-title{font-size:18px;font-weight:700}
.results-count{font-size:13px;color:var(--text2);opacity:.6}

.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

.result-card{background:rgba(20,35,55,0.7);border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(10px);transition:.3s;cursor:pointer;position:relative;overflow:hidden}
.result-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,0.2)}
.result-card.best-deal{border-color:#22c55e;box-shadow:0 0 20px rgba(34,197,94,0.15)}
.best-badge{position:absolute;top:10px;right:10px;background:#22c55e;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.store-name{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.store-icon{font-size:18px}
.product-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:10px;line-height:1.4}
.price-big{font-size:28px;font-weight:800;color:var(--blue);margin-bottom:6px}
.original-price{font-size:12px;color:var(--text2);opacity:.5;text-decoration:line-through;margin-left:6px;font-weight:400;font-size:14px}
.stars{color:#f59e0b;font-size:14px;margin-bottom:6px}
.star-count{font-size:12px;color:var(--text2);opacity:.6;margin-left:4px}
.delivery-info{font-size:12px;color:var(--text2);opacity:.7;display:flex;align-items:center;gap:4px}
.delivery-free{color:#22c55e;font-weight:500}
.delivery-fast{color:#f59e0b;font-weight:500}
.card-actions{display:flex;gap:8px;margin-top:12px}
.visit-btn{flex:1;padding:8px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s}
.visit-btn:hover{opacity:.9}
.history-btn{padding:8px 12px;background:var(--glass);border:1px solid var(--border);color:var(--text2);border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s}
.history-btn:hover{background:rgba(59,130,246,0.15)}

/* Price History modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(135deg,rgba(13,27,42,0.98),rgba(30,58,95,0.98));border:1px solid var(--border);border-radius:20px;padding:28px;min-width:340px;max-width:500px;width:90%}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:700;color:var(--blue)}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}
.chart-wrap{margin:16px 0}
.chart-label{font-size:11px;color:var(--text2);opacity:.5;margin-bottom:8px;display:flex;justify-content:space-between}
.line-chart{position:relative;height:80px;background:rgba(59,130,246,0.05);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.chart-line{position:absolute;bottom:0;left:0;right:0;height:100%;background:linear-gradient(to top,rgba(59,130,246,0.15),transparent)}
svg.chart-svg{width:100%;height:100%;overflow:visible}
.chart-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.chart-stat{text-align:center;padding:10px;background:rgba(59,130,246,0.08);border-radius:8px}
.chart-stat-label{font-size:10px;color:var(--text2);opacity:.5}
.chart-stat-val{font-size:16px;font-weight:700;color:var(--blue)}

.no-results{text-align:center;padding:60px 20px;color:var(--text2);opacity:.5;font-size:15px}

@media(max-width:600px){
  .search-row{flex-direction:column}
  .filter-row{gap:8px}
  .results-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav>
  <a class="back-btn" href="../../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Back
  </a>
  <h1>🕷️ Price Spider</h1>
</nav>

<main>
  <!-- Search -->
  <div class="search-section">
    <h2>Compare Prices Instantly</h2>
    <p>Search any product and compare prices from top UK & US retailers</p>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="e.g. iPhone 15, Sony WH-1000XM5, Nike Air Max..." onkeydown="if(event.key==='Enter')doSearch()"/>
      <button class="search-btn" onclick="doSearch()">🔍 Search</button>
    </div>
    <div class="recent-searches" id="recentSearches"></div>
  </div>

  <!-- Filters -->
  <div id="filtersSection" style="display:none">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Sort By</span>
        <select class="filter-select" id="sortSelect" onchange="renderResults()">
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
          <option value="delivery">Fastest Delivery</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Max Price</span>
        <div class="price-range-wrap">
          <input type="range" id="priceRange" min="0" max="2000" value="2000" step="10" oninput="updatePriceLabel();renderResults()"/>
          <span id="priceRangeVal">£2,000</span>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Min Rating</span>
        <select class="filter-select" id="ratingFilter" onchange="renderResults()">
          <option value="0">Any Rating</option>
          <option value="3">3+ Stars</option>
          <option value="4">4+ Stars</option>
          <option value="4.5">4.5+ Stars</option>
        </select>
      </div>
      <label class="toggle-filter">
        <input type="checkbox" id="freeDelivery" onchange="renderResults()"/> Free Delivery Only
      </label>
      <label class="toggle-filter">
        <input type="checkbox" id="nextDay" onchange="renderResults()"/> Next Day Only
      </label>
    </div>
  </div>

  <!-- Results area -->
  <div id="resultsArea"></div>
</main>

<!-- Price History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="historyTitle">📈 Price History (30 Days)</span>
      <button class="modal-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="chart-wrap">
      <div class="chart-label">
        <span>30 days ago</span>
        <span>Today</span>
      </div>
      <div class="line-chart">
        <svg class="chart-svg" id="chartSvg" viewBox="0 0 400 80" preserveAspectRatio="none"></svg>
      </div>
    </div>
    <div class="chart-stats" id="chartStats"></div>
    <p id="historyNote" style="font-size:12px;color:var(--text2);opacity:.5;margin-top:12px;text-align:center"></p>
  </div>
</div>

<script>
const STORES=[
  {name:'Amazon',icon:'📦',baseDiscount:.88,rating:()=>+(3.8+Math.random()*.9).toFixed(1),delivery:()=>Math.random()>.4?'Free delivery':'£3.99 delivery',isFree:()=>Math.random()>.4,isNextDay:()=>Math.random()>.5,url:'https://www.amazon.co.uk'},
  {name:'eBay',icon:'🛒',baseDiscount:.82,rating:()=>+(3.5+Math.random()*.9).toFixed(1),delivery:()=>Math.random()>.5?'Free delivery':'£2.99 delivery',isFree:()=>Math.random()>.5,isNextDay:()=>Math.random()>.3,url:'https://www.ebay.co.uk'},
  {name:'Walmart',icon:'🏪',baseDiscount:.9,rating:()=>+(3.6+Math.random()*.8).toFixed(1),delivery:()=>Math.random()>.6?'Free delivery (orders over £35)':'£4.99 delivery',isFree:()=>Math.random()>.6,isNextDay:()=>Math.random()>.4,url:'https://www.walmart.com'},
  {name:'John Lewis',icon:'🛍️',baseDiscount:1.0,rating:()=>+(4.1+Math.random()*.6).toFixed(1),delivery:()=>'Free delivery',isFree:()=>true,isNextDay:()=>Math.random()>.4,url:'https://www.johnlewis.com'},
  {name:'Currys',icon:'⚡',baseDiscount:.95,rating:()=>+(3.7+Math.random()*.7).toFixed(1),delivery:()=>Math.random()>.5?'Free delivery':'£5.99 delivery',isFree:()=>Math.random()>.5,isNextDay:()=>Math.random()>.6,url:'https://www.currys.co.uk'},
  {name:'Argos',icon:'🏷️',baseDiscount:.93,rating:()=>+(3.8+Math.random()*.6).toFixed(1),delivery:()=>Math.random()>.5?'Free click & collect':'£3.95 delivery',isFree:()=>Math.random()>.5,isNextDay:()=>Math.random()>.7,url:'https://www.argos.co.uk'},
  {name:'ASOS',icon:'👗',baseDiscount:.85,rating:()=>+(4.0+Math.random()*.5).toFixed(1),delivery:()=>Math.random()>.4?'Free delivery':'£3.50 delivery',isFree:()=>Math.random()>.4,isNextDay:()=>Math.random()>.5,url:'https://www.asos.com'},
  {name:'Very',icon:'💜',baseDiscount:.91,rating:()=>+(3.6+Math.random()*.8).toFixed(1),delivery:()=>Math.random()>.6?'Free delivery':'£3.99 delivery',isFree:()=>Math.random()>.6,isNextDay:()=>Math.random()>.4,url:'https://www.very.co.uk'},
];

let currentResults=[];
let currentQuery='';
const PRICE_SEEDS={};

function seededRandom(seed){
  let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};
}

function generatePrice(query,storeName,baseDiscount){
  const key=query.toLowerCase()+storeName;
  const seed=key.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const rng=seededRandom(seed);
  // Guess base price from query keywords
  const priceHints=[
    {kw:/iphone\s*1[5-6]|samsung\s*s2[4-5]/i,range:[700,1200]},
    {kw:/iphone\s*1[23]|pixel\s*[78]/i,range:[500,900]},
    {kw:/airpod|wh-?1000|buds/i,range:[80,350]},
    {kw:/laptop|macbook|notebook/i,range:[400,1800]},
    {kw:/tv|television|monitor/i,range:[150,2000]},
    {kw:/playstation|xbox|nintendo/i,range:[250,600]},
    {kw:/trainers|nike|adidas|sneaker/i,range:[40,250]},
    {kw:/dress|shirt|jeans|jacket/i,range:[15,200]},
    {kw:/coffee.*machine|nespresso/i,range:[40,400]},
    {kw:/dyson|hoover|vacuum/i,range:[80,600]},
    {kw:/kindle|tablet|ipad/i,range:[70,1200]},
    {kw:/watch|smartwatch|garmin/i,range:[50,800]},
  ];
  const hint=priceHints.find(h=>h.kw.test(query));
  const [lo,hi]=hint?hint.range:[20,500];
  const basePrice=lo+(rng()*(hi-lo));
  const price=basePrice*baseDiscount*(0.92+rng()*.16);
  const original=price*(1.1+rng()*.3);
  PRICE_SEEDS[key]={seed,lo,hi,basePrice,baseDiscount};
  return {price:Math.round(price*100)/100,original:Math.round(original*100)/100};
}

function generatePriceHistory(query,storeName,currentPrice){
  const key=query.toLowerCase()+storeName;
  const rng=seededRandom((PRICE_SEEDS[key]?.seed||42)*7);
  const points=[];
  let p=currentPrice*(1+rng()*.2);
  for(let i=0;i<30;i++){
    p+=( rng()-.45)*currentPrice*.05;
    p=Math.max(currentPrice*.7,Math.min(currentPrice*1.4,p));
    points.push(Math.round(p*100)/100);
  }
  points[29]=currentPrice;
  return points;
}

function renderStars(rating){
  let s='';
  for(let i=1;i<=5;i++){
    if(i<=Math.floor(rating))s+='★';
    else if(i-rating<1)s+='½';
    else s+='☆';
  }
  return s;
}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q)return;
  currentQuery=q;
  saveRecent(q);
  document.getElementById('filtersSection').style.display='none';
  document.getElementById('resultsArea').innerHTML=`
    <div class="searching">
      <div class="searching-dots"><span></span><span></span><span></span></div>
      <p style="margin-top:12px;font-size:14px">Searching across ${STORES.length} stores for <strong>"${q}"</strong>...</p>
    </div>`;
  setTimeout(()=>{
    currentResults=STORES.map(store=>{
      const {price,original}=generatePrice(q,store.name,store.baseDiscount);
      const freeD=store.isFree();
      const nextD=store.isNextDay();
      return {store:store.name,icon:store.icon,price,original,rating:store.rating(),
        deliveryText:store.delivery(),freeDelivery:freeD,nextDay:nextD,url:store.url};
    });
    document.getElementById('filtersSection').style.display='block';
    document.getElementById('priceRange').max=Math.ceil(Math.max(...currentResults.map(r=>r.price))*1.2/100)*100;
    document.getElementById('priceRange').value=document.getElementById('priceRange').max;
    updatePriceLabel();
    renderResults();
  },1800+Math.random()*700);
}

function renderResults(){
  if(!currentResults.length)return;
  let results=[...currentResults];
  // Filter
  const maxP=parseFloat(document.getElementById('priceRange').value);
  const minR=parseFloat(document.getElementById('ratingFilter').value);
  const freeOnly=document.getElementById('freeDelivery').checked;
  const nextOnly=document.getElementById('nextDay').checked;
  results=results.filter(r=>r.price<=maxP&&r.rating>=minR&&(!freeOnly||r.freeDelivery)&&(!nextOnly||r.nextDay));
  // Sort
  const sort=document.getElementById('sortSelect').value;
  if(sort==='price-asc')results.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc')results.sort((a,b)=>b.price-a.price);
  else if(sort==='rating')results.sort((a,b)=>b.rating-a.rating);
  else if(sort==='delivery')results.sort((a,b)=>(b.nextDay?1:0)-(a.nextDay?1:0)||(b.freeDelivery?1:0)-(a.freeDelivery?1:0));
  const lowestPrice=results.length?Math.min(...results.map(r=>r.price)):0;
  const html=results.length?results.map(r=>{
    const isBest=r.price===lowestPrice;
    const saving=r.original>r.price?`<span style="color:#22c55e;font-size:12px;margin-left:6px">Save £${(r.original-r.price).toFixed(2)}</span>`:'';
    const dStyle=r.freeDelivery?'delivery-free':r.nextDay?'delivery-fast':'';
    const dIcon=r.freeDelivery?'🚚':r.nextDay?'⚡':'📦';
    return `
    <div class="result-card${isBest?' best-deal':''}">
      ${isBest?'<span class="best-badge">✓ Best Price</span>':''}
      <div class="store-name"><span class="store-icon">${r.icon}</span>${r.store}</div>
      <div class="product-title">${currentQuery.slice(0,50)}${currentQuery.length>50?'...':''}</div>
      <div><span class="price-big">£${r.price.toFixed(2)}</span><span class="original-price">£${r.original.toFixed(2)}</span>${saving}</div>
      <div class="stars">${renderStars(r.rating)}<span class="star-count">${r.rating} / 5</span></div>
      <div class="delivery-info"><span class="${dStyle}">${dIcon} ${r.deliveryText}</span></div>
      <div class="card-actions">
        <button class="visit-btn" onclick="window.open('${r.url}','_blank')">🔗 Visit Store</button>
        <button class="history-btn" onclick="showHistory('${r.store}',${r.price})">📈 History</button>
      </div>
    </div>`}).join(''):
    '<div class="no-results">🔍 No results match your filters. Try adjusting them.</div>';
  document.getElementById('resultsArea').innerHTML=`
    <div class="results-header">
      <span class="results-title">Results for "<span style="color:var(--blue)">${currentQuery}</span>"</span>
      <span class="results-count">${results.length} store${results.length!==1?'s':''} found</span>
    </div>
    <div class="results-grid" style="margin-top:16px">${html}</div>`;
}

function showHistory(storeName,currentPrice){
  const points=generatePriceHistory(currentQuery,storeName,currentPrice);
  const min=Math.min(...points),max=Math.max(...points);
  const range=max-min||1;
  const W=400,H=80;
  const pts=points.map((p,i)=>`${(i/(points.length-1))*W},${H-((p-min)/range)*H*0.85-H*0.075}`).join(' ');
  const area=`${0},${H} ${pts} ${W},${H}`;
  document.getElementById('historyTitle').textContent=`📈 ${storeName} – Price History (30 Days)`;
  document.getElementById('chartSvg').innerHTML=`
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".02"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#cg)"/>
    <polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${W}" cy="${H-((currentPrice-min)/range)*H*0.85-H*0.075}" r="4" fill="#3b82f6"/>`;
  document.getElementById('chartStats').innerHTML=`
    <div class="chart-stat"><div class="chart-stat-label">Current</div><div class="chart-stat-val">£${currentPrice.toFixed(2)}</div></div>
    <div class="chart-stat"><div class="chart-stat-label">30d Low</div><div class="chart-stat-val" style="color:#22c55e">£${min.toFixed(2)}</div></div>
    <div class="chart-stat"><div class="chart-stat-label">30d High</div><div class="chart-stat-val" style="color:#ef4444">£${max.toFixed(2)}</div></div>`;
  document.getElementById('historyNote').textContent='Simulated price trend for demonstration purposes.';
  document.getElementById('historyModal').classList.add('show');
}

function closeHistory(){document.getElementById('historyModal').classList.remove('show');}
document.getElementById('historyModal').addEventListener('click',e=>{if(e.target===document.getElementById('historyModal'))closeHistory();});

function updatePriceLabel(){
  const v=document.getElementById('priceRange').value;
  document.getElementById('priceRangeVal').textContent=v>=2000?'Any':'£'+parseInt(v).toLocaleString();
  const pct=(v/document.getElementById('priceRange').max)*100;
  document.getElementById('priceRange').style.background=`linear-gradient(to right,var(--blue) 0%,var(--blue) ${pct}%,rgba(59,130,246,0.2) ${pct}%)`;
}

function saveRecent(q){
  let recents=JSON.parse(localStorage.getItem('priceRecents')||'[]');
  recents=recents.filter(r=>r!==q);recents.unshift(q);recents=recents.slice(0,8);
  localStorage.setItem('priceRecents',JSON.stringify(recents));
  renderRecents();
}

function renderRecents(){
  const recents=JSON.parse(localStorage.getItem('priceRecents')||'[]');
  const el=document.getElementById('recentSearches');
  if(!recents.length){el.innerHTML='';return;}
  el.innerHTML='<span class="recent-label">Recent:</span>'+recents.map(r=>`<span class="recent-chip" onclick="document.getElementById('searchInput').value='${r.replace(/'/g,"\\'")}';doSearch()">${r}</span>`).join('');
}

renderRecents();
</script>
</body>
</html>
