<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Food Analyser</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0800;--accent:#f97316;--accent2:#ea580c;--accent3:#fb923c;--border:rgba(249,115,22,0.2);--glass:rgba(249,115,22,0.08);--text:#fff7ed;--text2:#fdba74;--text3:rgba(255,247,237,0.6)}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0d0800,#1c0e00,#2d1600);min-height:100vh;color:var(--text)}
a{color:var(--accent);text-decoration:none}
.navbar{background:rgba(13,8,0,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.navbar h1{font-size:1.1rem;font-weight:600}
.back-btn{color:var(--text3);font-size:.85rem}
.back-btn:hover{color:var(--accent)}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
.section{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.section h2{font-size:1rem;font-weight:600;color:var(--text2);margin-bottom:16px}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;outline:none}
.search-row input:focus{border-color:var(--accent)}
.search-row input::placeholder{color:var(--text3)}
.btn{padding:10px 20px;border-radius:10px;border:none;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.result-item{padding:10px 14px;border-radius:10px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:4px}
.result-item:hover{background:var(--glass);border-color:var(--border)}
.result-item h4{font-size:.875rem;font-weight:500;color:var(--text)}
.result-item span{font-size:.75rem;color:var(--text3)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:16px auto;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.donut-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.donut-wrap{text-align:center}
.donut-label{font-size:.75rem;color:var(--text3);margin-top:4px}
.donut-val{font-size:1rem;font-weight:700;color:var(--text)}
.serving-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.serving-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'Inter',font-size:.8rem;cursor:pointer;transition:all .15s}
.serving-btn.active{background:rgba(249,115,22,.2);border-color:var(--accent);color:var(--accent)}
.health-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.health-fill{height:100%;border-radius:4px;transition:width .5s}
.nut-table{width:100%;border-collapse:collapse;font-size:.82rem}
.nut-table th{text-align:left;color:var(--text3);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--border)}
.nut-table td{padding:5px 8px;border-bottom:1px solid rgba(249,115,22,.07)}
.nut-table td:last-child{text-align:right;color:var(--text2)}
.compare-col{flex:1;background:rgba(249,115,22,.04);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0}
.compare-col h4{font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-row{margin-bottom:8px}
.progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text3);margin-bottom:3px}
.progress-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:.72rem;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.2);color:var(--accent3);margin:2px}
.log-entry{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.log-entry:last-child{border-bottom:none}
.empty{text-align:center;color:var(--text3);font-size:.9rem;padding:24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,.04);border-radius:12px;padding:4px}
.tab{flex:1;padding:8px;border-radius:9px;border:none;background:transparent;color:var(--text3);font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer;transition:all .2s}
.tab.active{background:rgba(249,115,22,.2);color:var(--accent);font-weight:500}
</style>
</head>
<body>
<nav class="navbar">
  <a class="back-btn" href="../../index.html">← Back</a>
  <h1>🔬 Food Analyser</h1>
  <div style="width:60px"></div>
</nav>
<div class="container">
  <div class="tabs">
    <button class="tab active" id="tab-search" onclick="showTab('search')">🔍 Search</button>
    <button class="tab" id="tab-compare" onclick="showTab('compare')">⚖️ Compare</button>
    <button class="tab" id="tab-log" onclick="showTab('log')">📋 Daily Log</button>
  </div>

  <!-- SEARCH TAB -->
  <div id="view-search">
    <div class="section">
      <h2>🔍 Search Food</h2>
      <div class="search-row">
        <input type="text" id="foodSearch" placeholder="e.g. apple, chicken breast, brown rice..."/>
        <button class="btn btn-primary" id="searchBtn">Search</button>
      </div>
      <div id="searchSpinner" style="display:none;text-align:center;padding:20px"><div class="spinner"></div></div>
      <div id="searchResults" style="margin-top:12px"></div>
    </div>

    <div class="section" id="nutritionPanel" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <h2 id="foodTitle" style="margin:0"></h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" id="addCompareBtn">+ Compare</button>
          <button class="btn btn-primary btn-sm" id="addLogBtn">+ Daily Log</button>
        </div>
      </div>
      <div class="serving-btns" id="servingBtns">
        <button class="serving-btn active" data-g="100">100g</button>
        <button class="serving-btn" data-g="50">50g</button>
        <button class="serving-btn" data-g="150">150g</button>
        <button class="serving-btn" data-g="200">200g</button>
        <input type="number" id="customServing" placeholder="Custom g" min="1" max="1000" style="padding:4px 8px;width:90px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'Inter',sans-serif;font-size:.8rem;outline:none"/>
      </div>

      <div class="donut-row" id="donutRow"></div>

      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:.85rem;color:var(--text2)">Health Score</span>
          <span id="healthScore" style="font-size:.9rem;font-weight:700;color:var(--accent)"></span>
        </div>
        <div class="health-bar"><div class="health-fill" id="healthFill" style="background:linear-gradient(90deg,#f97316,#ea580c)"></div></div>
      </div>

      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:280px">
          <h3 style="font-size:.85rem;color:var(--text2);margin-bottom:8px">📊 Macros & Minerals</h3>
          <table class="nut-table"><thead><tr><th>Nutrient</th><th>Amount</th></tr></thead><tbody id="macroBody"></tbody></table>
        </div>
        <div style="flex:1;min-width:280px">
          <h3 style="font-size:.85rem;color:var(--text2);margin-bottom:8px">💊 Vitamins & Minerals</h3>
          <table class="nut-table"><thead><tr><th>Nutrient</th><th>Amount</th></tr></thead><tbody id="vitaminBody"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <!-- COMPARE TAB -->
  <div id="view-compare" style="display:none">
    <div class="section">
      <h2>⚖️ Compare Foods (up to 3)</h2>
      <div id="compareNote" style="color:var(--text3);font-size:.875rem;margin-bottom:12px">Add foods from the Search tab to compare them here.</div>
      <div id="compareGrid" style="display:flex;gap:12px;flex-wrap:wrap"></div>
    </div>
  </div>

  <!-- LOG TAB -->
  <div id="view-log" style="display:none">
    <div class="section">
      <h2>📋 Today's Food Log</h2>
      <div id="logList"></div>
      <div style="margin-top:16px">
        <h3 style="font-size:.875rem;color:var(--text2);margin-bottom:10px">Daily Totals vs RDI</h3>
        <div id="rdiProgress"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://api.nal.usda.gov/fdc/v1/foods/search';
const API_KEY = 'DEMO_KEY';
const RDI = {calories:2000,protein:50,carbs:260,fat:78,fiber:28,sodium:2300};
let currentFood = null;
let currentServing = 100;
let compareList = JSON.parse(localStorage.getItem('analyserCompare')||'[]');
let dailyLog = JSON.parse(localStorage.getItem('foodAnalyserLog')||'[]').filter(e=>e.date===new Date().toLocaleDateString());

function showTab(t) {
  ['search','compare','log'].forEach(x=>{
    document.getElementById('view-'+x).style.display=x===t?'block':'none';
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
  });
  if(t==='compare')renderCompare();
  if(t==='log')renderLog();
}

function nutriVal(n, name, serving) {
  if(!n)return null;
  const found = n.find(x=>x.nutrientName&&x.nutrientName.toLowerCase().includes(name.toLowerCase()));
  if(!found)return null;
  return ((found.value||0)*(serving/100)).toFixed(1);
}

function getNutrients(food, serving) {
  const n = food.foodNutrients||[];
  const get = (name) => {
    const f = n.find(x=>x.nutrientName&&x.nutrientName.toLowerCase().includes(name.toLowerCase()));
    if(!f)return null;
    return parseFloat(((f.value||0)*(serving/100)).toFixed(2));
  };
  return {
    calories: get('energy') || get('calories'),
    protein: get('protein'),
    carbs: get('carbohydrate'),
    fat: get('total lipid') || get('fat'),
    fiber: get('fiber'),
    sugar: get('sugars'),
    satFat: get('saturated'),
    sodium: get('sodium'),
    vitC: get('vitamin c'),
    vitD: get('vitamin d'),
    vitB12: get('vitamin b-12') || get('b12'),
    iron: get('iron'),
    calcium: get('calcium'),
    potassium: get('potassium'),
    magnesium: get('magnesium'),
    zinc: get('zinc')
  };
}

function healthScore(vals) {
  let score = 60;
  if(vals.protein>10) score+=10;
  if(vals.fiber>3) score+=8;
  if(vals.vitC>10) score+=5;
  if(vals.calcium>50) score+=4;
  if(vals.iron>1) score+=4;
  if(vals.satFat>5) score-=10;
  if(vals.sodium>400) score-=8;
  if(vals.sugar>10) score-=8;
  if(vals.fat>20) score-=5;
  return Math.max(5,Math.min(100,Math.round(score)));
}

function svgDonut(val, max, color, label, unit) {
  const pct = Math.min(1, (val||0)/max);
  const r=36, cx=44, cy=44, stroke=7;
  const circ = 2*Math.PI*r;
  const dash = pct*circ;
  return `<div class="donut-wrap">
    <svg width="88" height="88" viewBox="0 0 88 88">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
      <text x="${cx}" y="${cy-5}" text-anchor="middle" fill="#fff7ed" font-family="Inter" font-size="11" font-weight="700">${val||0}</text>
      <text x="${cx}" y="${cy+9}" text-anchor="middle" fill="rgba(255,247,237,.5)" font-family="Inter" font-size="8">${unit}</text>
    </svg>
    <div class="donut-label">${label}</div>
  </div>`;
}

async function searchFood(query) {
  const sp = document.getElementById('searchSpinner');
  const res = document.getElementById('searchResults');
  sp.style.display='block'; res.innerHTML='';
  try {
    const r = await fetch(`${API}?query=${encodeURIComponent(query)}&api_key=${API_KEY}&pageSize=10&dataType=Survey%20(FNDDS),SR%20Legacy`);
    const d = await r.json();
    sp.style.display='none';
    const foods = d.foods||[];
    if(!foods.length){res.innerHTML='<div class="empty">No results found</div>';return}
    res.innerHTML = foods.map((f,i)=>`
      <div class="result-item" onclick="selectFood(${i})">
        <h4>${f.description}</h4>
        <span>${f.dataType||''} · ${f.foodCategory||''}</span>
      </div>`).join('');
    window._searchFoods = foods;
  } catch(e) { sp.style.display='none'; res.innerHTML='<div class="empty">Search failed. Try again.</div>'; }
}

function selectFood(i) {
  const food = window._searchFoods[i];
  currentFood = food;
  currentServing = 100;
  document.querySelectorAll('.serving-btn').forEach(b=>b.classList.toggle('active',b.dataset.g==='100'));
  renderNutrition(food, 100);
  document.getElementById('nutritionPanel').style.display='block';
  document.getElementById('nutritionPanel').scrollIntoView({behavior:'smooth'});
}

function renderNutrition(food, serving) {
  const vals = getNutrients(food, serving);
  document.getElementById('foodTitle').textContent = food.description;
  const dr = document.getElementById('donutRow');
  dr.innerHTML = [
    svgDonut(vals.calories, 2000, '#f97316','Calories','kcal'),
    svgDonut(vals.protein, 50, '#4ade80','Protein','g'),
    svgDonut(vals.carbs, 260, '#60a5fa','Carbs','g'),
    svgDonut(vals.fat, 78, '#f472b6','Fat','g')
  ].join('');
  const macros = [
    ['Calories', vals.calories, 'kcal'],['Protein', vals.protein, 'g'],['Carbs', vals.carbs, 'g'],
    ['Fat', vals.fat, 'g'],['Fibre', vals.fiber, 'g'],['Sugar', vals.sugar, 'g'],
    ['Saturated Fat', vals.satFat, 'g'],['Sodium', vals.sodium, 'mg']
  ];
  document.getElementById('macroBody').innerHTML = macros.map(([l,v,u])=>`<tr><td>${l}</td><td>${v!==null?v+u:'—'}</td></tr>`).join('');
  const vitamins = [
    ['Vitamin C', vals.vitC, 'mg'],['Vitamin D', vals.vitD, 'µg'],['Vitamin B12', vals.vitB12, 'µg'],
    ['Iron', vals.iron, 'mg'],['Calcium', vals.calcium, 'mg'],['Potassium', vals.potassium, 'mg'],
    ['Magnesium', vals.magnesium, 'mg'],['Zinc', vals.zinc, 'mg']
  ];
  document.getElementById('vitaminBody').innerHTML = vitamins.map(([l,v,u])=>`<tr><td>${l}</td><td>${v!==null?v+u:'—'}</td></tr>`).join('');
  const hs = healthScore(vals);
  document.getElementById('healthScore').textContent = hs+'/100';
  document.getElementById('healthFill').style.width = hs+'%';
  document.getElementById('healthFill').style.background = hs>70?'linear-gradient(90deg,#4ade80,#16a34a)':hs>40?'linear-gradient(90deg,#fbbf24,#f97316)':'linear-gradient(90deg,#f87171,#dc2626)';
}

document.getElementById('searchBtn').addEventListener('click',()=>searchFood(document.getElementById('foodSearch').value));
document.getElementById('foodSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchFood(e.target.value)});

document.querySelectorAll('.serving-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.serving-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentServing=parseInt(b.dataset.g);
    if(currentFood)renderNutrition(currentFood,currentServing);
  });
});

document.getElementById('customServing').addEventListener('change',e=>{
  const v=parseInt(e.target.value);
  if(v>0){currentServing=v;if(currentFood)renderNutrition(currentFood,v)}
});

document.getElementById('addCompareBtn').addEventListener('click',()=>{
  if(!currentFood)return;
  if(compareList.length>=3){alert('Max 3 foods in compare');return}
  if(!compareList.find(x=>x.fdcId===currentFood.fdcId)){
    compareList.push({...currentFood,_serving:currentServing});
    localStorage.setItem('analyserCompare',JSON.stringify(compareList));
    document.getElementById('addCompareBtn').textContent='✓ Added';
    setTimeout(()=>{document.getElementById('addCompareBtn').textContent='+ Compare'},2000);
  }
});

document.getElementById('addLogBtn').addEventListener('click',()=>{
  if(!currentFood)return;
  const vals = getNutrients(currentFood,currentServing);
  const entry={name:currentFood.description,serving:currentServing,date:new Date().toLocaleDateString(),calories:vals.calories||0,protein:vals.protein||0,carbs:vals.carbs||0,fat:vals.fat||0,fiber:vals.fiber||0};
  dailyLog.push(entry);
  const all = JSON.parse(localStorage.getItem('foodAnalyserLog')||'[]').filter(e=>e.date!==new Date().toLocaleDateString());
  all.push(...dailyLog);
  localStorage.setItem('foodAnalyserLog',JSON.stringify(all));
  document.getElementById('addLogBtn').textContent='✓ Logged';
  setTimeout(()=>{document.getElementById('addLogBtn').textContent='+ Daily Log'},2000);
});

function renderCompare() {
  const el=document.getElementById('compareGrid');
  if(!compareList.length){el.innerHTML='<div class="empty" style="width:100%">No foods added to compare yet</div>';return}
  const macroKeys=[['Calories','calories','kcal'],['Protein','protein','g'],['Carbs','carbs','g'],['Fat','fat','g'],['Fibre','fiber','g'],['Sodium','sodium','mg']];
  el.innerHTML=compareList.map((food,ci)=>{
    const vals=getNutrients(food,food._serving||100);
    const rows=macroKeys.map(([l,k,u])=>`<div style="display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;border-bottom:1px solid rgba(249,115,22,.08)"><span style="color:rgba(255,247,237,.6)">${l}</span><span style="color:#fdba74">${vals[k]!==null?vals[k]+u:'—'}</span></div>`).join('');
    return`<div class="compare-col"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><h4>${food.description}</h4><button onclick="removeCompare(${ci})" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:6px;padding:2px 6px;font-size:.7rem;cursor:pointer">✕</button></div>${rows}</div>`;
  }).join('');
}

function removeCompare(i){compareList.splice(i,1);localStorage.setItem('analyserCompare',JSON.stringify(compareList));renderCompare()}

function renderLog() {
  const el=document.getElementById('logList');
  if(!dailyLog.length){el.innerHTML='<div class="empty">No food logged today</div>';return}
  el.innerHTML=dailyLog.map((e,i)=>`<div class="log-entry"><div><div style="font-size:.875rem;font-weight:500;color:var(--text)">${e.name}</div><div style="font-size:.75rem;color:var(--text3)">${e.serving}g · ${e.calories}kcal</div></div><button onclick="removeLog(${i})" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer">✕</button></div>`).join('');
  const totals={calories:0,protein:0,carbs:0,fat:0,fiber:0};
  dailyLog.forEach(e=>{Object.keys(totals).forEach(k=>{totals[k]+=(parseFloat(e[k])||0)})});
  const rdiMap=[['Calories',totals.calories.toFixed(0),RDI.calories,'kcal'],['Protein',totals.protein.toFixed(1),RDI.protein,'g'],['Carbs',totals.carbs.toFixed(1),RDI.carbs,'g'],['Fat',totals.fat.toFixed(1),RDI.fat,'g'],['Fibre',totals.fiber.toFixed(1),RDI.fiber,'g']];
  document.getElementById('rdiProgress').innerHTML=rdiMap.map(([l,v,rdi,u])=>{
    const pct=Math.min(100,Math.round(parseFloat(v)/rdi*100));
    return`<div class="progress-row"><div class="progress-label"><span>${l}</span><span>${v}${u} / ${rdi}${u} (${pct}%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function removeLog(i){
  dailyLog.splice(i,1);
  const all=JSON.parse(localStorage.getItem('foodAnalyserLog')||'[]').filter(e=>e.date!==new Date().toLocaleDateString());
  all.push(...dailyLog);
  localStorage.setItem('foodAnalyserLog',JSON.stringify(all));
  renderLog();
}
</script>
</body>
</html>
