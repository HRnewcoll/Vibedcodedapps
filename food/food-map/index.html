<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Food Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0800;--accent:#f97316;--accent2:#ea580c;--accent3:#fb923c;--border:rgba(249,115,22,0.2);--glass:rgba(249,115,22,0.08);--text:#fff7ed;--text2:#fdba74;--text3:rgba(255,247,237,0.6)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
a{color:var(--accent);text-decoration:none}
.navbar{background:rgba(13,8,0,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1000}
.navbar h1{font-size:1.1rem;font-weight:600}
.back-btn{color:var(--text3);font-size:.85rem}
.back-btn:hover{color:var(--accent)}
#map{height:calc(100vh - 56px);width:100%;position:relative}
.map-controls{position:absolute;top:12px;left:12px;z-index:900;display:flex;flex-direction:column;gap:8px}
.search-bar{display:flex;gap:6px;margin-bottom:4px}
.search-bar input{background:rgba(13,8,0,.9);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;outline:none;width:200px}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text3)}
.category-btns{display:flex;flex-direction:column;gap:4px}
.cat-btn{background:rgba(13,8,0,.85);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text2);font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer;transition:all .2s;text-align:left;backdrop-filter:blur(8px)}
.cat-btn:hover,.cat-btn.active{background:var(--glass);border-color:var(--accent);color:var(--accent)}
.recenter-btn{position:absolute;bottom:20px;right:20px;z-index:900;background:rgba(13,8,0,.9);border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;font-size:1.2rem;transition:all .2s;backdrop-filter:blur(8px)}
.recenter-btn:hover{border-color:var(--accent)}
.sidebar{position:absolute;top:0;right:0;bottom:0;width:280px;background:rgba(13,8,0,.92);backdrop-filter:blur(16px);border-left:1px solid var(--border);z-index:900;transform:translateX(100%);transition:transform .3s;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h3{font-size:.95rem;color:var(--text2)}
.close-sidebar{background:none;border:none;color:var(--text3);font-size:1.1rem;cursor:pointer;padding:4px}
.close-sidebar:hover{color:var(--accent)}
.sidebar-list{padding:8px}
.sidebar-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .2s;border-bottom:1px solid rgba(249,115,22,.08)}
.sidebar-item:hover{background:var(--glass)}
.sidebar-item h4{font-size:.875rem;font-weight:500;color:var(--text)}
.sidebar-item span{font-size:.75rem;color:var(--text3)}
.toggle-sidebar-btn{position:absolute;top:50%;right:4px;transform:translateY(-50%);z-index:901;background:rgba(13,8,0,.9);border:1px solid var(--border);border-radius:10px 0 0 10px;padding:12px 8px;cursor:pointer;color:var(--text3);font-size:.85rem;transition:all .2s;backdrop-filter:blur(8px)}
.toggle-sidebar-btn.shifted{right:280px}
.toggle-sidebar-btn:hover{color:var(--accent);border-color:var(--accent)}
.loading-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,8,0,.85);border:1px solid var(--border);border-radius:12px;padding:20px 28px;z-index:1100;display:none;text-align:center;backdrop-filter:blur(12px)}
.loading-overlay.active{display:block}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-popup-content-wrapper{background:rgba(13,8,0,.95)!important;border:1px solid var(--border)!important;color:var(--text)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:rgba(13,8,0,.95)!important}
.leaflet-popup-content{color:var(--text)!important;font-family:'Inter',sans-serif!important;font-size:.85rem!important}
.popup-name{font-weight:600;color:var(--accent3);margin-bottom:4px}
.popup-detail{color:var(--text3);line-height:1.5}
.result-count{background:rgba(13,8,0,.85);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:.8rem;color:var(--text2);backdrop-filter:blur(8px)}
</style>
</head>
<body>
<nav class="navbar">
  <a class="back-btn" href="../../index.html">← Back</a>
  <h1>🗺️ Food Map</h1>
  <div style="width:60px"></div>
</nav>
<div style="position:relative">
  <div id="map"></div>
  <div class="map-controls">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search area..."/>
      <button class="cat-btn" id="searchAreaBtn" style="padding:8px 10px;font-size:.85rem">🔍</button>
    </div>
    <div id="resultCount" class="result-count" style="display:none"></div>
    <div class="category-btns">
      <button class="cat-btn" data-amenity="restaurant" data-label="Restaurants">🍕 Restaurants</button>
      <button class="cat-btn" data-amenity="cafe" data-label="Cafes">☕ Cafes</button>
      <button class="cat-btn" data-amenity="fast_food" data-label="Fast Food">🍔 Fast Food</button>
      <button class="cat-btn" data-amenity="supermarket" data-label="Supermarkets">🛒 Supermarkets</button>
      <button class="cat-btn" data-amenity="bakery" data-label="Bakeries">🥐 Bakeries</button>
    </div>
  </div>
  <button class="recenter-btn" id="recenterBtn" title="Re-center">📍</button>
  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p style="margin-top:8px;color:var(--text3);font-size:.85rem">Loading...</p></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3 id="sidebarTitle">Results</h3>
      <button class="close-sidebar" id="closeSidebar">✕</button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </div>
  <button class="toggle-sidebar-btn" id="toggleSidebar">☰</button>
</div>

<script>
const map = L.map('map', {zoomControl: true}).setView([51.505, -0.09], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap contributors', maxZoom: 19}).addTo(map);

let userLat = null, userLon = null;
let userMarker = null;
let placeMarkers = [];
let currentAmenity = null;

const loadingOverlay = document.getElementById('loadingOverlay');
const sidebar = document.getElementById('sidebar');
const toggleBtn = document.getElementById('toggleSidebar');

function showLoading(){loadingOverlay.classList.add('active')}
function hideLoading(){loadingOverlay.classList.remove('active')}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*1000).toFixed(0);
}

function formatDist(m){return m>=1000?`${(m/1000).toFixed(1)}km`:`${m}m`}

const orangeIcon = L.divIcon({className:'',html:`<div style="width:28px;height:28px;background:linear-gradient(135deg,#f97316,#ea580c);border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:12px">🍽</div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]});
const userIcon = L.divIcon({className:'',html:`<div style="width:32px;height:32px;background:linear-gradient(135deg,#f97316,#ea580c);border-radius:50%;border:3px solid #fff;box-shadow:0 2px 12px rgba(249,115,22,.5);display:flex;align-items:center;justify-content:center;font-size:14px">📍</div>`,iconSize:[32,32],iconAnchor:[16,16]});

function clearMarkers(){placeMarkers.forEach(m=>map.removeLayer(m));placeMarkers=[]}

function getLocate(){
  if(navigator.geolocation){
    showLoading();
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat=pos.coords.latitude;
      userLon=pos.coords.longitude;
      hideLoading();
      if(userMarker)map.removeLayer(userMarker);
      userMarker=L.marker([userLat,userLon],{icon:userIcon}).addTo(map).bindPopup('<div class="popup-name">📍 You are here</div>');
      map.setView([userLat,userLon],15);
    },err=>{hideLoading();console.warn('Geolocation error:',err.message)});
  }
}

async function fetchPlaces(amenity,label){
  if(!userLat){alert('Please allow location access first.');return}
  showLoading();
  clearMarkers();
  document.querySelectorAll('.cat-btn[data-amenity]').forEach(b=>b.classList.toggle('active',b.dataset.amenity===amenity));
  currentAmenity=amenity;
  const query=`[out:json][timeout:25];(node["amenity"="${amenity}"](around:2000,${userLat},${userLon});way["amenity"="${amenity}"](around:2000,${userLat},${userLon}););out center;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:`data=${encodeURIComponent(query)}`});
    const d=await r.json();
    hideLoading();
    const results=d.elements||[];
    const rc=document.getElementById('resultCount');
    rc.textContent=`${results.length} ${label} found`;
    rc.style.display='block';
    const sidebarItems=[];
    results.slice(0,80).forEach(el=>{
      const lat=el.lat||el.center?.lat;
      const lon=el.lon||el.center?.lon;
      if(!lat||!lon)return;
      const name=el.tags?.name||label.slice(0,-1);
      const addr=[el.tags?.['addr:street'],el.tags?.['addr:housenumber']].filter(Boolean).join(' ');
      const hours=el.tags?.opening_hours||'';
      const dist=haversine(userLat,userLon,lat,lon);
      const popup=`<div class="popup-name">${name}</div><div class="popup-detail">${addr?addr+'<br>':''}${hours?'🕐 '+hours+'<br>':''}📏 ${formatDist(dist)}</div>`;
      const m=L.marker([lat,lon],{icon:orangeIcon}).addTo(map).bindPopup(popup);
      placeMarkers.push(m);
      sidebarItems.push({name,dist:parseInt(dist),marker:m});
    });
    sidebarItems.sort((a,b)=>a.dist-b.dist);
    document.getElementById('sidebarTitle').textContent=`${label} (${sidebarItems.length})`;
    document.getElementById('sidebarList').innerHTML=sidebarItems.map((_,i)=>`<div class="sidebar-item" data-idx="${i}"><h4>${sidebarItems[i].name}</h4><span>${formatDist(sidebarItems[i].dist)} away</span></div>`).join('');
    document.querySelectorAll('.sidebar-item').forEach(el=>{
      el.addEventListener('click',()=>{
        const item=sidebarItems[parseInt(el.dataset.idx)];
        item.marker.openPopup();
        map.panTo(item.marker.getLatLng());
      });
    });
    sidebar.classList.add('open');
    toggleBtn.classList.add('shifted');
  }catch(e){hideLoading();console.error(e);alert('Failed to fetch places. Try again.')}
}

document.querySelectorAll('.cat-btn[data-amenity]').forEach(btn=>{
  btn.addEventListener('click',()=>fetchPlaces(btn.dataset.amenity,btn.dataset.label));
});

document.getElementById('recenterBtn').addEventListener('click',()=>{
  if(userLat)map.setView([userLat,userLon],15);
  else getLocate();
});

document.getElementById('closeSidebar').addEventListener('click',()=>{sidebar.classList.remove('open');toggleBtn.classList.remove('shifted')});
toggleBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');toggleBtn.classList.toggle('shifted')});

async function searchArea(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q)return;
  showLoading();
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,{headers:{'Accept-Language':'en'}});
    const d=await r.json();
    hideLoading();
    if(!d.length){alert('Location not found');return}
    const lat=parseFloat(d[0].lat),lon=parseFloat(d[0].lon);
    userLat=lat;userLon=lon;
    if(userMarker)map.removeLayer(userMarker);
    userMarker=L.marker([lat,lon],{icon:userIcon}).addTo(map).bindPopup(`<div class="popup-name">📍 ${d[0].display_name.split(',')[0]}</div>`);
    map.setView([lat,lon],14);
    if(currentAmenity){
      const btn=document.querySelector(`.cat-btn[data-amenity="${currentAmenity}"]`);
      if(btn)fetchPlaces(currentAmenity,btn.dataset.label);
    }
  }catch(e){hideLoading();alert('Search failed')}
}

document.getElementById('searchAreaBtn').addEventListener('click',searchArea);
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchArea()});

getLocate();
</script>
</body>
</html>
