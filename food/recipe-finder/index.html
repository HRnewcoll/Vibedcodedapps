<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Recipe Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0800;--accent:#f97316;--accent2:#ea580c;--accent3:#fb923c;--border:rgba(249,115,22,0.2);--glass:rgba(249,115,22,0.08);--text:#fff7ed;--text2:#fdba74;--text3:rgba(255,247,237,0.6)}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0d0800,#1c0e00,#2d1600);min-height:100vh;color:var(--text)}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const BASE = 'https://www.themealdb.com/api/json/v1/1';

function Spinner() {
  return <div style={{display:'flex',justifyContent:'center',padding:'40px'}}><div style={{width:36,height:36,border:'3px solid rgba(249,115,22,.2)',borderTopColor:'#f97316',borderRadius:'50%',animation:'spin .7s linear infinite'}}/></div>;
}

function SearchBar({ onSearch }) {
  const [q, setQ] = useState('');
  const submit = () => { if(q.trim()) onSearch(q); };
  return (
    <div style={{display:'flex',gap:8,marginBottom:16}}>
      <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="Search recipes..." style={{flex:1,background:'rgba(255,255,255,.06)',border:'1px solid rgba(249,115,22,.2)',borderRadius:10,padding:'10px 14px',color:'#fff7ed',fontFamily:'Inter',fontSize:'.9rem',outline:'none'}}/>
      <button onClick={submit} style={{padding:'10px 20px',background:'linear-gradient(135deg,#f97316,#ea580c)',border:'none',borderRadius:10,color:'#fff',fontFamily:'Inter',fontSize:'.9rem',fontWeight:500,cursor:'pointer'}}>Search</button>
    </div>
  );
}

function CategoryFilters({ onCategory, onArea, onRandom, activeCategory }) {
  const [categories, setCategories] = useState([]);
  const [areas, setAreas] = useState([]);
  useEffect(() => {
    fetch(`${BASE}/categories.php`).then(r=>r.json()).then(d=>setCategories(d.categories||[]));
    fetch(`${BASE}/list.php?a=list`).then(r=>r.json()).then(d=>setAreas(d.meals||[]));
  }, []);
  const catEmoji = {Beef:'🥩',Chicken:'🍗',Dessert:'🍰',Lamb:'🍖',Miscellaneous:'🍽️',Pasta:'🍝',Pork:'🥓',Seafood:'🦞',Side:'🥗',Starter:'🥣',Vegan:'🥦',Vegetarian:'🥕',Breakfast:'🥞',Goat:'🐐'};
  return (
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
        <button onClick={onRandom} style={{padding:'6px 14px',background:'rgba(249,115,22,.15)',border:'1px solid rgba(249,115,22,.3)',borderRadius:20,color:'#fb923c',fontFamily:'Inter',fontSize:'.8rem',cursor:'pointer'}}>🎲 Random Recipe</button>
        <select onChange={e=>e.target.value&&onArea(e.target.value)} defaultValue="" style={{padding:'6px 10px',background:'rgba(13,8,0,.8)',border:'1px solid rgba(249,115,22,.2)',borderRadius:20,color:'#fdba74',fontFamily:'Inter',fontSize:'.8rem',outline:'none'}}>
          <option value="">🌍 All Cuisines</option>
          {areas.map(a=><option key={a.strArea} value={a.strArea}>{a.strArea}</option>)}
        </select>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {categories.map(c=>(
          <button key={c.idCategory} onClick={()=>onCategory(c.strCategory)} style={{padding:'5px 12px',background:activeCategory===c.strCategory?'rgba(249,115,22,.25)':'rgba(255,255,255,.06)',border:`1px solid ${activeCategory===c.strCategory?'#f97316':'rgba(249,115,22,.2)'}`,borderRadius:20,color:activeCategory===c.strCategory?'#f97316':'#fdba74',fontFamily:'Inter',fontSize:'.78rem',cursor:'pointer',transition:'all .15s'}}>
            {catEmoji[c.strCategory]||'🍴'} {c.strCategory}
          </button>
        ))}
      </div>
    </div>
  );
}

function RecipeCard({ recipe, onClick, isFav, onFav }) {
  return (
    <div onClick={onClick} style={{background:'rgba(249,115,22,.06)',border:'1px solid rgba(249,115,22,.15)',borderRadius:14,overflow:'hidden',cursor:'pointer',transition:'all .2s',position:'relative'}} onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(249,115,22,.4)';e.currentTarget.style.transform='translateY(-2px)'}} onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(249,115,22,.15)';e.currentTarget.style.transform=''}}>
      <img src={recipe.strMealThumb} alt={recipe.strMeal} style={{width:'100%',height:160,objectFit:'cover',display:'block'}}/>
      <button onClick={e=>{e.stopPropagation();onFav(recipe)}} style={{position:'absolute',top:8,right:8,background:'rgba(0,0,0,.5)',border:'none',borderRadius:'50%',width:32,height:32,fontSize:'1rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>{isFav?'❤️':'🤍'}</button>
      <div style={{padding:12}}>
        <div style={{fontWeight:600,fontSize:'.875rem',color:'#fff7ed',marginBottom:4,lineHeight:1.3}}>{recipe.strMeal}</div>
        <div style={{fontSize:'.75rem',color:'rgba(255,247,237,.5)'}}>{recipe.strCategory} · {recipe.strArea||'International'}</div>
      </div>
    </div>
  );
}

function RecipeModal({ recipe, onClose, isFav, onFav }) {
  const [full, setFull] = useState(null);
  useEffect(() => {
    if(!recipe)return;
    fetch(`${BASE}/lookup.php?i=${recipe.idMeal}`).then(r=>r.json()).then(d=>setFull(d.meals?.[0]||null));
  }, [recipe?.idMeal]);
  if(!recipe)return null;
  const data = full || recipe;
  const ingredients = [];
  for(let i=1;i<=20;i++){
    const ing=data[`strIngredient${i}`];
    const meas=data[`strMeasure${i}`];
    if(ing&&ing.trim())ingredients.push({ing:ing.trim(),meas:(meas||'').trim()});
  }
  const steps = (data.strInstructions||'').split(/\r?\n/).filter(s=>s.trim()).map((s,i)=>({n:i+1,t:s.trim()}));
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(6px)',zIndex:2000,overflowY:'auto',display:'flex',justifyContent:'center',padding:'24px 16px'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'linear-gradient(135deg,#1c0e00,#2d1600)',border:'1px solid rgba(249,115,22,.3)',borderRadius:20,width:'100%',maxWidth:700,height:'fit-content'}}>
        <div style={{position:'relative'}}>
          <img src={data.strMealThumb} alt={data.strMeal} style={{width:'100%',height:260,objectFit:'cover',borderRadius:'20px 20px 0 0',display:'block'}}/>
          <button onClick={onClose} style={{position:'absolute',top:12,right:12,background:'rgba(0,0,0,.6)',border:'none',borderRadius:'50%',width:36,height:36,color:'#fff',fontSize:'1.1rem',cursor:'pointer'}}>✕</button>
          <button onClick={()=>onFav(data)} style={{position:'absolute',top:12,right:56,background:'rgba(0,0,0,.6)',border:'none',borderRadius:'50%',width:36,height:36,fontSize:'1rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>{isFav?'❤️':'🤍'}</button>
        </div>
        <div style={{padding:24}}>
          <h2 style={{fontSize:'1.4rem',fontWeight:700,color:'#fff7ed',marginBottom:6}}>{data.strMeal}</h2>
          <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
            <span style={{padding:'4px 12px',background:'rgba(249,115,22,.15)',border:'1px solid rgba(249,115,22,.3)',borderRadius:20,fontSize:'.78rem',color:'#fb923c'}}>{data.strCategory}</span>
            {data.strArea&&<span style={{padding:'4px 12px',background:'rgba(249,115,22,.1)',border:'1px solid rgba(249,115,22,.2)',borderRadius:20,fontSize:'.78rem',color:'#fdba74'}}>{data.strArea}</span>}
          </div>
          <h3 style={{fontSize:.9+'rem',fontWeight:600,color:'#fdba74',marginBottom:10}}>🧂 Ingredients</h3>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:6,marginBottom:20}}>
            {ingredients.map((x,i)=>(
              <div key={i} style={{background:'rgba(249,115,22,.08)',border:'1px solid rgba(249,115,22,.15)',borderRadius:8,padding:'6px 10px',fontSize:'.82rem',display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'#fff7ed'}}>{x.ing}</span>
                <span style={{color:'rgba(255,247,237,.5)'}}>{x.meas}</span>
              </div>
            ))}
          </div>
          <h3 style={{fontSize:.9+'rem',fontWeight:600,color:'#fdba74',marginBottom:10}}>📋 Instructions</h3>
          <div style={{fontSize:'.85rem',lineHeight:1.7,color:'rgba(255,247,237,.8)',marginBottom:20}}>
            {steps.length>1?steps.map(s=><p key={s.n} style={{marginBottom:10}}><strong style={{color:'#f97316'}}>{s.n}.</strong> {s.t}</p>):<p style={{whiteSpace:'pre-line'}}>{data.strInstructions}</p>}
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {data.strYoutube&&<a href={data.strYoutube} target="_blank" rel="noreferrer" style={{padding:'8px 16px',background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,color:'#f87171',fontSize:'.85rem',fontWeight:500}}>▶ YouTube</a>}
            {data.strSource&&<a href={data.strSource} target="_blank" rel="noreferrer" style={{padding:'8px 16px',background:'rgba(249,115,22,.1)',border:'1px solid rgba(249,115,22,.2)',borderRadius:10,color:'#fb923c',fontSize:'.85rem',fontWeight:500}}>🔗 Source</a>}
            <button onClick={()=>window.print()} style={{padding:'8px 16px',background:'rgba(255,255,255,.06)',border:'1px solid rgba(249,115,22,.2)',borderRadius:10,color:'#fdba74',fontFamily:'Inter',fontSize:'.85rem',cursor:'pointer'}}>🖨️ Print</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function FavouritesList({ favs, onSelect, onRemove }) {
  const [open, setOpen] = useState(false);
  if(!favs.length)return null;
  return (
    <div style={{background:'rgba(249,115,22,.06)',border:'1px solid rgba(249,115,22,.2)',borderRadius:14,marginBottom:20,overflow:'hidden'}}>
      <button onClick={()=>setOpen(!open)} style={{width:'100%',padding:'14px 20px',background:'none',border:'none',color:'#fdba74',fontFamily:'Inter',fontSize:'.9rem',fontWeight:600,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        ❤️ Favourites ({favs.length}) <span>{open?'▲':'▼'}</span>
      </button>
      {open&&<div style={{padding:'0 16px 16px',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10}}>
        {favs.map(r=>(
          <div key={r.idMeal} style={{position:'relative',cursor:'pointer',borderRadius:10,overflow:'hidden',border:'1px solid rgba(249,115,22,.2)'}} onClick={()=>onSelect(r)}>
            <img src={r.strMealThumb} alt={r.strMeal} style={{width:'100%',height:90,objectFit:'cover',display:'block'}}/>
            <div style={{padding:'6px 8px',fontSize:'.75rem',color:'#fff7ed',background:'rgba(13,8,0,.7)'}}>{r.strMeal}</div>
            <button onClick={e=>{e.stopPropagation();onRemove(r.idMeal)}} style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,.6)',border:'none',borderRadius:'50%',width:22,height:22,color:'#f87171',fontSize:.7+'rem',cursor:'pointer'}}>✕</button>
          </div>
        ))}
      </div>}
    </div>
  );
}

function App() {
  const [recipes, setRecipes] = useState([]);
  const [loading, setLoading] = useState(false);
  const [selected, setSelected] = useState(null);
  const [favs, setFavs] = useState(() => JSON.parse(localStorage.getItem('recipeFavourites')||'[]'));
  const [activeCategory, setActiveCategory] = useState('');
  const [empty, setEmpty] = useState(false);

  const saveFavs = (f) => { setFavs(f); localStorage.setItem('recipeFavourites', JSON.stringify(f)); };
  const isFav = (r) => favs.some(f=>f.idMeal===r.idMeal);
  const toggleFav = (r) => { if(isFav(r)) saveFavs(favs.filter(f=>f.idMeal!==r.idMeal)); else saveFavs([...favs, r]); };

  const search = async (q) => {
    setLoading(true); setEmpty(false); setActiveCategory('');
    const r = await fetch(`${BASE}/search.php?s=${encodeURIComponent(q)}`).then(x=>x.json());
    setLoading(false);
    const meals = r.meals||[];
    setRecipes(meals);
    setEmpty(meals.length===0);
  };

  const byCategory = async (cat) => {
    setLoading(true); setEmpty(false); setActiveCategory(cat);
    const r = await fetch(`${BASE}/filter.php?c=${encodeURIComponent(cat)}`).then(x=>x.json());
    setLoading(false);
    const meals = r.meals||[];
    setRecipes(meals);
    setEmpty(meals.length===0);
  };

  const byArea = async (area) => {
    setLoading(true); setEmpty(false); setActiveCategory('');
    const r = await fetch(`${BASE}/filter.php?a=${encodeURIComponent(area)}`).then(x=>x.json());
    setLoading(false);
    setRecipes(r.meals||[]);
  };

  const random = async () => {
    setLoading(true);
    const r = await fetch(`${BASE}/random.php`).then(x=>x.json());
    setLoading(false);
    const meal = r.meals?.[0];
    if(meal) setSelected(meal);
  };

  useEffect(() => { search('chicken'); }, []);

  return (
    <>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <nav style={{background:'rgba(13,8,0,.8)',backdropFilter:'blur(12px)',borderBottom:'1px solid rgba(249,115,22,.2)',padding:'0 24px',height:56,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100}}>
        <a href="../../index.html" style={{color:'rgba(255,247,237,.6)',fontSize:'.85rem',textDecoration:'none'}}>← Back</a>
        <h1 style={{fontSize:'1.1rem',fontWeight:600,color:'#fff7ed'}}>🍴 Recipe Finder</h1>
        <div style={{width:60}}/>
      </nav>
      <div style={{maxWidth:900,margin:'0 auto',padding:'24px 16px'}}>
        <FavouritesList favs={favs} onSelect={setSelected} onRemove={id=>saveFavs(favs.filter(f=>f.idMeal!==id))}/>
        <SearchBar onSearch={search}/>
        <CategoryFilters onCategory={byCategory} onArea={byArea} onRandom={random} activeCategory={activeCategory}/>
        {loading && <Spinner/>}
        {empty && !loading && <div style={{textAlign:'center',color:'rgba(255,247,237,.5)',padding:40}}>No recipes found. Try a different search.</div>}
        {!loading && recipes.length>0 && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
            {recipes.map(r=>(
              <RecipeCard key={r.idMeal} recipe={r} onClick={()=>setSelected(r)} isFav={isFav(r)} onFav={toggleFav}/>
            ))}
          </div>
        )}
      </div>
      {selected && <RecipeModal recipe={selected} onClose={()=>setSelected(null)} isFav={isFav(selected)} onFav={r=>{toggleFav(r)}}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
