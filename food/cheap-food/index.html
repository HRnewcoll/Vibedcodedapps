<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cheap Food Finder</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{--bg:#0d0800;--accent:#f97316;--border:rgba(249,115,22,0.2);--text:#fff7ed;--card:#1a0e00;--muted:#a07040;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
  a{color:var(--accent);text-decoration:none;}
  ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--card);}
  ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}
  .app{max-width:960px;margin:0 auto;padding:16px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:16px;transition:color .2s;}
  .back-link:hover{color:var(--accent);}
  .header{text-align:center;padding:20px 0 28px;}
  .header h1{font-size:2rem;font-weight:800;color:var(--accent);}
  .header p{color:var(--muted);margin-top:6px;font-size:14px;}
  .tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border);}
  .tab{flex:1;padding:9px;border:none;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;}
  .tab.active{background:var(--accent);color:#fff;}
  .tab:hover:not(.active){color:var(--accent);}
  .budget-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px;}
  .budget-panel h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px;}
  .budget-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .budget-amount{font-size:2rem;font-weight:800;color:var(--accent);min-width:80px;}
  input[type=range]{flex:1;min-width:160px;accent-color:var(--accent);}
  .budget-period{display:flex;gap:6px;}
  .period-btn{padding:5px 14px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s;}
  .period-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  .search-wrap{position:relative;flex:1;min-width:180px;}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px 9px 36px;font-size:13px;}
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
  select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;}
  select:focus{outline:none;border-color:var(--accent);}
  .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px;}
  .recipe-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:all .2s;position:relative;}
  .recipe-card:hover{border-color:rgba(249,115,22,0.5);transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,0.1);}
  .recipe-emoji{font-size:40px;text-align:center;margin-bottom:10px;}
  .recipe-name{font-size:15px;font-weight:700;margin-bottom:6px;}
  .recipe-cost{font-size:1.3rem;font-weight:800;color:var(--accent);}
  .recipe-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:12px;color:var(--muted);}
  .recipe-meta span{display:flex;align-items:center;gap:3px;}
  .diff-badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .diff-easy{background:rgba(5,150,105,0.2);color:#34d399;}
  .diff-medium{background:rgba(217,119,6,0.2);color:#fbbf24;}
  .diff-hard{background:rgba(220,38,38,0.2);color:#f87171;}
  .nutrition{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .nut{background:rgba(249,115,22,0.1);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--muted);}
  .heart-btn{position:absolute;top:14px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;transition:transform .2s;}
  .heart-btn:hover{transform:scale(1.2);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#1a0e00;border:1px solid var(--border);border-radius:20px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-title{font-size:1.4rem;font-weight:800;}
  .close-btn{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;transition:color .2s;}
  .close-btn:hover{color:var(--accent);}
  .modal-emoji{font-size:60px;text-align:center;margin:12px 0;}
  .section-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;}
  .ingredient-list{list-style:none;}
  .ingredient-list li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .ingredient-list li:last-child{border-bottom:none;}
  .ingredient-price{color:var(--accent);font-weight:600;}
  .steps{counter-reset:steps;}
  .step{display:flex;gap:12px;margin-bottom:12px;font-size:13px;line-height:1.6;}
  .step-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;margin-top:1px;}
  .tips-list{list-style:none;}
  .tips-list li{padding:6px 0 6px 20px;position:relative;font-size:13px;color:var(--muted);}
  .tips-list li::before{content:'💡';position:absolute;left:0;}
  .deals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .deal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .deal-store{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;}
  .deal-name{font-size:14px;font-weight:700;margin-bottom:6px;}
  .deal-prices{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;}
  .deal-new{font-size:1.2rem;font-weight:800;color:var(--accent);}
  .deal-old{font-size:13px;color:var(--muted);text-decoration:line-through;}
  .deal-save{font-size:11px;background:rgba(249,115,22,0.2);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:700;}
  .deal-exp{font-size:11px;color:var(--muted);margin-top:6px;}
  .mealplan{margin-bottom:24px;}
  .mealplan h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px;}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .day-cell{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:80px;text-align:center;}
  .day-name{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .day-recipe{font-size:12px;cursor:pointer;line-height:1.4;}
  .day-recipe .emoji{font-size:20px;display:block;margin-bottom:3px;}
  .day-cost{font-size:11px;color:var(--accent);}
  .day-empty{font-size:11px;color:var(--muted);cursor:pointer;padding-top:8px;}
  .day-empty:hover{color:var(--accent);}
  .week-total{text-align:right;font-size:13px;color:var(--muted);margin-top:10px;}
  .week-total strong{color:var(--accent);}
  .shopping-section{margin-top:20px;}
  .shopping-section h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px;}
  .shopping-add{display:flex;gap:8px;margin-bottom:14px;}
  .shopping-add input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;}
  .shopping-add input:focus{outline:none;border-color:var(--accent);}
  .btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#ea6b0e;transform:translateY(-1px);}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .shopping-list{list-style:none;}
  .shop-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .shop-item:last-child{border-bottom:none;}
  .shop-item input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;}
  .shop-item.checked span{text-decoration:line-through;color:var(--muted);}
  .shop-del{background:none;border:none;cursor:pointer;color:var(--muted);margin-left:auto;font-size:13px;transition:color .2s;}
  .shop-del:hover{color:#f87171;}
  .shop-price{color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap;}
  .empty{text-align:center;padding:40px;color:var(--muted);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f97316;color:#fff;padding:10px 24px;border-radius:12px;font-weight:600;font-size:14px;z-index:999;pointer-events:none;box-shadow:0 4px 20px rgba(249,115,22,0.4);}
  .total-cost-modal{background:rgba(249,115,22,0.1);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .total-cost-modal .price{font-size:1.5rem;font-weight:800;color:var(--accent);}
  .alt-ingredients{background:rgba(249,115,22,0.05);border-radius:10px;padding:12px;font-size:13px;color:var(--muted);}
  @media(max-width:640px){
    .week-grid{grid-template-columns:repeat(4,1fr);}
    .recipe-grid{grid-template-columns:1fr;}
    .tabs span{display:none;}
    .deals-grid{grid-template-columns:1fr;}
  }
</style>
</head>

function calcRecipeCost(recipe){
  return recipe.ingredients.reduce((sum, ing) => {
    const db = INGREDIENTS_DB[ing.name];
    if(!db) return sum;
    return sum + db.price * ing.qty;
  }, 0);
}

// ─── Recipes Tab ─────────────────────────────────────────────────────────────
function RecipesTab({ budget, period, favourites, onToggleFav, onOpenRecipe }){
  const [search, setSearch] = useState('');
  const [dietary, setDietary] = useState('Any');
  const [maxCook, setMaxCook] = useState('Any');
  const [maxCost, setMaxCost] = useState('Any');

  const dailyBudget = period === 'weekly' ? budget / 7 : budget;
  const mealBudget = dailyBudget / 3;

  const filtered = useMemo(() => {
    return RECIPES.filter(r => {
      const cost = calcRecipeCost(r);
      const perServing = cost / r.serves;
      if(search && !r.name.toLowerCase().includes(search.toLowerCase()) &&
         !r.ingredients.some(i => i.name.toLowerCase().includes(search.toLowerCase()))) return false;
      if(dietary !== 'Any' && r.dietary !== dietary) return false;
      if(maxCook === '15' && r.cookTime > 15) return false;
      if(maxCook === '30' && r.cookTime > 30) return false;
      if(maxCook === '60' && r.cookTime > 60) return false;
      if(maxCost === '1' && perServing > 1) return false;
      if(maxCost === '2' && perServing > 2) return false;
      if(maxCost === '3' && perServing > 3) return false;
      return true;
    });
  }, [search, dietary, maxCook, maxCost]);

  return (
    <div>
      <div className="filters">
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input type="text" placeholder="Search recipes or ingredients…" value={search} onChange={e => setSearch(e.target.value)}/>
        </div>
        <select value={dietary} onChange={e => setDietary(e.target.value)}>
          <option>Any</option><option>Vegan</option><option>Vegetarian</option><option>Meat</option>
        </select>
        <select value={maxCook} onChange={e => setMaxCook(e.target.value)}>
          <option value="Any">Any time</option>
          <option value="15">Under 15 min</option>
          <option value="30">Under 30 min</option>
          <option value="60">Under 1 hour</option>
        </select>
        <select value={maxCost} onChange={e => setMaxCost(e.target.value)}>
          <option value="Any">Any cost</option>
          <option value="1">Under £1/serving</option>
          <option value="2">Under £2/serving</option>
          <option value="3">Under £3/serving</option>
        </select>
      </div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:14}}>
        Budget: <strong style={{color:'var(--accent)'}}>£{mealBudget.toFixed(2)}</strong> per meal · {filtered.length} recipes
      </div>
      {filtered.length === 0 && <div className="empty"><div style={{fontSize:40}}>🥘</div><p>No recipes match your filters.</p></div>}
      <div className="recipe-grid">
        {filtered.map(r => {
          const cost = calcRecipeCost(r);
          const perServing = cost / r.serves;
          const diffClass = r.difficulty === 'Easy' ? 'diff-easy' : r.difficulty === 'Medium' ? 'diff-medium' : 'diff-hard';
          const fav = favourites.includes(r.id);
          const withinBudget = perServing <= mealBudget;
          return (
            <div key={r.id} className="recipe-card" onClick={() => onOpenRecipe(r)} style={withinBudget ? {borderColor:'rgba(249,115,22,0.4)'} : {}}>
              <button className="heart-btn" onClick={e => {e.stopPropagation(); onToggleFav(r.id);}} title={fav?'Remove favourite':'Add favourite'}>
                {fav ? '❤️' : '🤍'}
              </button>
              <div className="recipe-emoji">{r.emoji}</div>
              <div className="recipe-name">{r.name}</div>
              <div className="recipe-cost">£{perServing.toFixed(2)} <span style={{fontSize:13,fontWeight:400,color:'var(--muted)'}}>/ serving</span></div>
              <div className="recipe-meta">
                <span>⏱ {r.cookTime}min</span>
                <span>👤 {r.serves}</span>
                <span className={'diff-badge ' + diffClass}>{r.difficulty}</span>
                <span style={{fontSize:11,padding:'2px 7px',borderRadius:20,background:r.dietary==='Vegan'?'rgba(5,150,105,0.15)':r.dietary==='Vegetarian'?'rgba(59,130,246,0.15)':'rgba(220,38,38,0.15)',color:r.dietary==='Vegan'?'#34d399':r.dietary==='Vegetarian'?'#60a5fa':'#f87171'}}>{r.dietary}</span>
              </div>
              <div className="nutrition">
                <span className="nut">🔥{r.nutrition.cal}</span>
                <span className="nut">💪{r.nutrition.protein}g</span>
                <span className="nut">🌾{r.nutrition.carbs}g</span>
              </div>
              {withinBudget && <div style={{marginTop:8,fontSize:11,color:'#34d399',fontWeight:600}}>✓ Within your budget</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MealPlanTab({ mealPlan, onAssignDay, onClearDay, shoppingList, onUpdateShoppingList }){
  const [picking, setPicking] = useState(null);
  const [newItem, setNewItem] = useState('');

  const weekCost = DAYS.reduce((s, d) => {
    if(!mealPlan[d]) return s;
    const r = RECIPES.find(r => r.id === mealPlan[d]);
    return r ? s + calcRecipeCost(r) : s;
  }, 0);

  const addToList = () => {
    if(!newItem.trim()) return;
    const item = {id:'si'+Date.now(),name:newItem.trim(),price:null,checked:false,auto:false};
    onUpdateShoppingList([...shoppingList, item]);
    setNewItem('');
  };

  const toggleCheck = (id) => {
    onUpdateShoppingList(shoppingList.map(i => i.id===id ? {...i,checked:!i.checked} : i));
  };

  const removeItem = (id) => {
    onUpdateShoppingList(shoppingList.filter(i => i.id!==id));
  };

  const genShoppingList = () => {
    const items = [];
    DAYS.forEach(d => {
      if(!mealPlan[d]) return;
      const r = RECIPES.find(r => r.id === mealPlan[d]);
      if(!r) return;
      r.ingredients.forEach(ing => {
        const db = INGREDIENTS_DB[ing.name];
        const existing = items.find(i => i.name === ing.name);
        if(!existing){
          items.push({id:'ag'+Date.now()+Math.random(),name:ing.name,price:db ? db.price*ing.qty : null,checked:false,auto:true,note:ing.note});
        }
      });
    });
    const manual = shoppingList.filter(i => !i.auto);
    onUpdateShoppingList([...items, ...manual]);
  };

  return (
    <div>
      <div className="mealplan">
        <h3>📅 Weekly Meal Plan</h3>
        <div className="week-grid">
          {DAYS.map(d => {
            const recipeId = mealPlan[d];
            const r = recipeId ? RECIPES.find(r => r.id === recipeId) : null;
            return (
              <div key={d} className="day-cell">
                <div className="day-name">{d}</div>
                {r ? (
                  <div className="day-recipe" onClick={() => setPicking(d)}>
                    <span className="emoji">{r.emoji}</span>
                    <span style={{fontSize:11}}>{r.name}</span>
                    <div className="day-cost">£{(calcRecipeCost(r)/r.serves).toFixed(2)}</div>
                  </div>
                ) : (
                  <div className="day-empty" onClick={() => setPicking(d)}>+ Add meal</div>
                )}
                {r && <button style={{marginTop:4,background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:11}} onClick={() => onClearDay(d)}>✕</button>}
              </div>
            );
          })}
        </div>
        <div className="week-total">Week total: <strong>£{weekCost.toFixed(2)}</strong></div>
        <div style={{marginTop:10,display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={genShoppingList}>🛒 Generate Shopping List</button>
        </div>
      </div>

      {picking && (
        <div className="modal-overlay" onClick={e => e.target===e.currentTarget && setPicking(null)}>
          <div className="modal" style={{maxWidth:460}}>
            <div className="modal-header">
              <div className="modal-title">Pick a recipe for {picking}</div>
              <button className="close-btn" onClick={() => setPicking(null)}>×</button>
            </div>
            <div className="recipe-grid" style={{marginTop:12}}>
              {RECIPES.map(r => (
                <div key={r.id} className="recipe-card" onClick={() => { onAssignDay(picking, r.id); setPicking(null); }}>
                  <div className="recipe-emoji" style={{fontSize:28,marginBottom:6}}>{r.emoji}</div>
                  <div className="recipe-name" style={{fontSize:13}}>{r.name}</div>
                  <div className="recipe-cost" style={{fontSize:1.1+'rem'}}>£{(calcRecipeCost(r)/r.serves).toFixed(2)}/serving</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="shopping-section">
        <h3>🛒 Shopping List</h3>
        <div className="shopping-add">
          <input
            type="text"
            placeholder="Add an item manually…"
            value={newItem}
            onChange={e => setNewItem(e.target.value)}
            onKeyDown={e => { if(e.key==='Enter') addToList(); }}
          />
          <button className="btn btn-primary" onClick={addToList}>Add</button>
        </div>
        {shoppingList.length === 0 && (
          <div className="empty" style={{padding:24}}>
            <p>No items yet. Assign meals above then click Generate.</p>
          </div>
        )}
        <ul className="shopping-list">
          {shoppingList.map(item => (
            <li key={item.id} className={'shop-item' + (item.checked?' checked':'')}>
              <input type="checkbox" checked={item.checked} onChange={() => toggleCheck(item.id)}/>
              <span>{item.name}{item.note ? ' ('+item.note+')' : ''}</span>
              {item.price !== null && <span className="shop-price">≈ £{item.price.toFixed(2)}</span>}
              <button className="shop-del" onClick={() => removeItem(item.id)}>✕</button>
            </li>
          ))}
        </ul>
        {shoppingList.length > 0 && (
          <div style={{marginTop:12,textAlign:'right',fontSize:13,color:'var(--muted)'}}>
            Total: <strong style={{color:'var(--accent)'}}>
              £{shoppingList.filter(i=>!i.checked&&i.price!==null).reduce((s,i)=>s+(i.price||0),0).toFixed(2)}
            </strong> remaining
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App(){
  const [tab, setTab] = useState('recipes');
  const [budget, setBudget] = useState(25);
  const [period, setPeriod] = useState('weekly');
  const [favourites, setFavourites] = useState(() => loadFavourites());
  const [mealPlan, setMealPlan] = useState(() => loadMealPlan());
  const [shoppingList, setShoppingList] = useState(() => loadShoppingList());
  const [selectedRecipe, setSelectedRecipe] = useState(null);
  const [toast, setToast] = useState('');
  const toastRef = useRef(null);

  useEffect(() => { saveFavourites(favourites); }, [favourites]);
  useEffect(() => { saveMealPlan(mealPlan); }, [mealPlan]);
  useEffect(() => { saveShoppingList(shoppingList); }, [shoppingList]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    if(toastRef.current) clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToast(''), 2500);
  }, []);

  const toggleFav = useCallback((id) => {
    setFavourites(prev => {
      const next = prev.includes(id) ? prev.filter(f => f!==id) : [...prev, id];
      showToast(prev.includes(id) ? '💔 Removed from favourites' : '❤️ Added to favourites!');
      return next;
    });
  }, [showToast]);

  const assignDay = useCallback((day, recipeId) => {
    setMealPlan(prev => ({...prev, [day]: recipeId}));
    showToast('📅 Added to ' + day + '!');
  }, [showToast]);

  const clearDay = useCallback((day) => {
    setMealPlan(prev => { const n={...prev}; delete n[day]; return n; });
  }, []);

  const addToDay = useCallback((day, recipe) => {
    assignDay(day, recipe.id);
  }, [assignDay]);

  const sliderMax = period === 'weekly' ? 100 : 20;
  const sliderMin = period === 'weekly' ? 7 : 1;

  return (
    <div className="app">
      <a href="../../index.html" className="back-link">← Back to Apps</a>
      <div className="header">
        <h1>🍳 Cheap Food Finder</h1>
        <p>Budget recipes, supermarket deals, and weekly meal planning — all in one place.</p>
      </div>

      <div className="budget-panel">
        <h3>💰 Your Budget</h3>
        <div className="budget-row">
          <div className="budget-amount">£{budget}</div>
          <input
            type="range"
            min={sliderMin}
            max={sliderMax}
            value={budget}
            onChange={e => setBudget(Number(e.target.value))}
          />
          <div className="budget-period">
            <button className={'period-btn' + (period==='daily'?' active':'')} onClick={() => { setPeriod('daily'); setBudget(Math.min(budget,20)); }}>Daily</button>
            <button className={'period-btn' + (period==='weekly'?' active':'')} onClick={() => { setPeriod('weekly'); setBudget(Math.max(budget,7)); }}>Weekly</button>
          </div>
        </div>
        <div style={{fontSize:12,color:'var(--muted)',marginTop:8}}>
          ≈ £{(period==='weekly' ? budget/21 : budget/3).toFixed(2)} per meal · £{(period==='weekly'?budget/7:budget).toFixed(2)} per day
        </div>
      </div>

      <div className="tabs">
        <button className={'tab' + (tab==='recipes'?' active':'')} onClick={() => setTab('recipes')}>🍽️ <span>Recipes</span></button>
        <button className={'tab' + (tab==='favourites'?' active':'')} onClick={() => setTab('favourites')}>❤️ <span>Favourites ({favourites.length})</span></button>
        <button className={'tab' + (tab==='deals'?' active':'')} onClick={() => setTab('deals')}>🏷️ <span>Deals</span></button>
        <button className={'tab' + (tab==='plan'?' active':'')} onClick={() => setTab('plan')}>📅 <span>Meal Plan</span></button>
      </div>

      {tab === 'recipes' && (
        <RecipesTab
          budget={budget}
          period={period}
          favourites={favourites}
          onToggleFav={toggleFav}
          onOpenRecipe={setSelectedRecipe}
        />
      )}
      {tab === 'favourites' && (
        <div>
          {favourites.length === 0 && (
            <div className="empty">
              <div style={{fontSize:48}}>🤍</div>
              <p>No favourites yet. Heart a recipe to save it here.</p>
            </div>
          )}
          <div className="recipe-grid">
            {RECIPES.filter(r => favourites.includes(r.id)).map(r => {
              const cost = calcRecipeCost(r);
              const perServing = cost / r.serves;
              const diffClass = r.difficulty === 'Easy' ? 'diff-easy' : r.difficulty === 'Medium' ? 'diff-medium' : 'diff-hard';
              return (
                <div key={r.id} className="recipe-card" onClick={() => setSelectedRecipe(r)}>
                  <button className="heart-btn" onClick={e => {e.stopPropagation(); toggleFav(r.id);}}>❤️</button>
                  <div className="recipe-emoji">{r.emoji}</div>
                  <div className="recipe-name">{r.name}</div>
                  <div className="recipe-cost">£{perServing.toFixed(2)}<span style={{fontSize:13,fontWeight:400,color:'var(--muted)'}}>/serving</span></div>
                  <div className="recipe-meta">
                    <span>⏱ {r.cookTime}min</span>
                    <span className={'diff-badge '+diffClass}>{r.difficulty}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {tab === 'deals' && <DealsTab />}
      {tab === 'plan' && (
        <MealPlanTab
          mealPlan={mealPlan}
          onAssignDay={assignDay}
          onClearDay={clearDay}
          shoppingList={shoppingList}
          onUpdateShoppingList={setShoppingList}
        />
      )}

      {selectedRecipe && (
        <RecipeModal
          recipe={selectedRecipe}
          onClose={() => setSelectedRecipe(null)}
          onAddToDay={addToDay}
        />
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
