<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Planner — Envelope Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#020b18; --accent:#3b82f6; --accent2:#2563eb; --accent3:#60a5fa;
  --border:rgba(59,130,246,0.2); --glass:rgba(59,130,246,0.08);
  --text:#e0f2fe; --text2:#93c5fd; --text3:rgba(224,242,254,0.6);
  --green:#22c55e; --red:#ef4444; --yellow:#eab308;
}
body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#020b18,#041525,#020f1e); min-height:100vh; color:var(--text); display:flex; flex-direction:column; }
.back-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:var(--glass); border:1px solid var(--border); border-radius:8px; color:var(--text2); text-decoration:none; font-size:13px; }
.back-btn:hover { background:rgba(59,130,246,0.16); }
header { padding:14px 20px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); flex-shrink:0; }
header h1 { font-size:18px; font-weight:700; color:var(--accent3); }
.layout { display:flex; flex:1; overflow:hidden; }
.sidebar { width:280px; flex-shrink:0; border-right:1px solid var(--border); overflow-y:auto; padding:14px; background:rgba(0,0,0,0.15); }
.main { flex:1; overflow-y:auto; padding:16px 20px; }
.panel { background:var(--glass); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; }
.panel-title { font-size:11px; font-weight:700; color:var(--text2); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; }
input[type=text],input[type=number],input[type=date],input[type=color],select { background:rgba(0,0,0,0.35); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:7px 10px; font-size:12px; width:100%; margin-bottom:7px; font-family:inherit; }
input[type=color] { height:32px; padding:2px 4px; cursor:pointer; }
input:focus,select:focus { outline:none; border-color:var(--accent); }
.btn { padding:7px 14px; border-radius:7px; border:none; cursor:pointer; font-weight:600; font-size:12px; font-family:inherit; transition:all 0.2s; }
.btn-primary { background:var(--accent2); color:#fff; }
.btn-primary:hover { background:var(--accent); }
.btn-sm { padding:3px 9px; border-radius:5px; font-size:11px; }
.btn-danger { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.25); }
.btn-danger:hover { background:rgba(239,68,68,0.28); }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text2); }
.btn-outline:hover { background:var(--glass); }
.src-item,.env-item { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(59,130,246,0.07); font-size:12px; }
.src-item:last-child,.env-item:last-child { border-bottom:none; }
.summary-row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
.sum-card { background:var(--glass); border:1px solid var(--border); border-radius:9px; padding:10px 12px; }
.sum-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
.sum-value { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
.month-nav { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.month-nav button { background:var(--glass); border:1px solid var(--border); color:var(--text2); width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:15px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.env-card { background:rgba(0,0,0,0.25); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:8px; cursor:pointer; transition:border-color 0.2s; }
.env-card:hover { border-color:var(--accent); }
.progress-wrap { background:rgba(0,0,0,0.3); border-radius:4px; height:6px; overflow:hidden; margin:5px 0 4px; }
.progress-bar { height:100%; border-radius:4px; transition:width 0.4s; }
.exp-detail { background:rgba(0,0,0,0.2); border-radius:6px; margin-top:8px; padding:8px; font-size:11px; display:none; }
.exp-detail.open { display:block; }
.exp-row { display:flex; align-items:center; gap:8px; padding:3px 0; border-bottom:1px solid rgba(59,130,246,0.07); }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { color:var(--text3); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border); text-align:left; }
td { padding:6px 8px; border-bottom:1px solid rgba(59,130,246,0.06); }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<header>
  <a href="../../index.html" class="back-btn">← Back</a>
  <h1>✉️ Budget Planner</h1>
</header>
<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- Income Sources -->
    <div class="panel">
      <div class="panel-title">Income Sources</div>
      <input type="text" id="incName" placeholder="Source name (e.g. Salary)">
      <input type="number" id="incAmt" placeholder="Monthly amount ($)">
      <button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="addIncome()">+ Add Source</button>
      <div id="incomeList"></div>
      <div style="font-size:12px;font-weight:700;color:var(--green);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
        Total: <span id="incomeTotal">$0.00</span>
      </div>
    </div>
    <!-- Envelopes -->
    <div class="panel">
      <div class="panel-title">Envelopes</div>
      <input type="text" id="envName" placeholder="Envelope name">
      <input type="number" id="envAmt" placeholder="Allocated amount ($)">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:7px;">
        <label style="font-size:11px;color:var(--text3);white-space:nowrap">Color:</label>
        <input type="color" id="envColor" value="#3b82f6" style="margin-bottom:0;flex:1">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="addEnvelope()">+ Add Envelope</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- Month Nav -->
    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <span id="monthLabel" style="font-size:15px;font-weight:700"></span>
      <button onclick="nextMonth()">›</button>
    </div>

    <!-- Summary -->
    <div class="summary-row" id="summaryRow"></div>

    <!-- Chart + Add Expense -->
    <div class="grid2" style="margin-bottom:14px;">
      <div class="panel">
        <div class="panel-title">Allocation Overview</div>
        <canvas id="donutCanvas" width="260" height="260" style="margin:0 auto;display:block;"></canvas>
        <div id="donutLegend" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-title">Add Expense</div>
          <input type="number" id="expAmt" placeholder="Amount ($)">
          <select id="expEnv"><option value="">Select envelope…</option></select>
          <input type="text" id="expNote" placeholder="Note">
          <input type="date" id="expDate">
          <button class="btn btn-primary" style="width:100%" onclick="addExpense()">+ Add Expense</button>
        </div>
        <!-- Savings Goal -->
        <div class="panel">
          <div class="panel-title">Savings Goal</div>
          <input type="text" id="goalDesc" placeholder="Goal description">
          <input type="number" id="goalTarget" placeholder="Target amount ($)">
          <button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="saveGoal()">Save Goal</button>
          <div id="goalDisplay"></div>
        </div>
      </div>
    </div>

    <!-- Envelope Cards -->
    <div class="panel">
      <div class="panel-title">Envelopes</div>
      <div id="envCards"></div>
    </div>

    <!-- Monthly Expense List -->
    <div class="panel">
      <div class="panel-title">Monthly Expenses</div>
      <table>
        <thead><tr><th>Date</th><th>Envelope</th><th>Note</th><th style="text-align:right">Amount</th><th></th></tr></thead>
        <tbody id="expenseList"></tbody>
      </table>
      <div id="expenseEmpty" style="text-align:center;padding:24px;color:var(--text3);font-size:13px;">No expenses this month.</div>
    </div>
  </div>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const now=new Date();
let curYear=now.getFullYear(), curMon=now.getMonth();

function load(k,d){try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let incomes=load('budgetIncome',[]);
let envelopes=load('budgetEnvelopes',[]);
let expenses=load('budgetExpenses',[]);
let savingsGoal=load('savingsGoal',{desc:'',target:0});

document.getElementById('expDate').value=now.toISOString().slice(0,10);
document.getElementById('monthLabel').textContent=`${MONTHS[curMon]} ${curYear}`;

function prevMonth(){if(curMon===0){curMon=11;curYear--;}else curMon--;updateMonthLabel();render();}
function nextMonth(){if(curMon===11){curMon=0;curYear++;}else curMon++;updateMonthLabel();render();}
function updateMonthLabel(){document.getElementById('monthLabel').textContent=`${MONTHS[curMon]} ${curYear}`;}

function addIncome(){
  const name=document.getElementById('incName').value.trim();
  const amt=parseFloat(document.getElementById('incAmt').value);
  if(!name||isNaN(amt)||amt<=0)return;
  incomes.push({id:Date.now(),name,amt});
  save('budgetIncome',incomes);
  document.getElementById('incName').value='';
  document.getElementById('incAmt').value='';
  render();
}
function deleteIncome(id){incomes=incomes.filter(x=>x.id!==id);save('budgetIncome',incomes);render();}

function addEnvelope(){
  const name=document.getElementById('envName').value.trim();
  const amt=parseFloat(document.getElementById('envAmt').value);
  const color=document.getElementById('envColor').value;
  if(!name||isNaN(amt)||amt<=0)return;
  envelopes.push({id:Date.now(),name,amt,color});
  save('budgetEnvelopes',envelopes);
  document.getElementById('envName').value='';
  document.getElementById('envAmt').value='';
  render();
}
function deleteEnvelope(id){
  envelopes=envelopes.filter(x=>x.id!==id);
  expenses=expenses.filter(x=>x.envId!==id);
  save('budgetEnvelopes',envelopes);save('budgetExpenses',expenses);render();
}

function addExpense(){
  const amt=parseFloat(document.getElementById('expAmt').value);
  const envId=parseInt(document.getElementById('expEnv').value);
  const note=document.getElementById('expNote').value.trim();
  const date=document.getElementById('expDate').value;
  if(isNaN(amt)||amt<=0||!envId||!date)return alert('Fill amount, envelope and date.');
  expenses.push({id:Date.now(),amt,envId,note,date});
  save('budgetExpenses',expenses);
  document.getElementById('expAmt').value='';
  document.getElementById('expNote').value='';
  render();
}
function deleteExpense(id){expenses=expenses.filter(x=>x.id!==id);save('budgetExpenses',expenses);render();}

function saveGoal(){
  savingsGoal={desc:document.getElementById('goalDesc').value.trim(),target:parseFloat(document.getElementById('goalTarget').value)||0};
  save('savingsGoal',savingsGoal);render();
}

function monthExpenses(){
  return expenses.filter(e=>{const d=new Date(e.date);return d.getFullYear()===curYear&&d.getMonth()===curMon;});
}

function envSpent(envId){return monthExpenses().filter(e=>e.envId===envId).reduce((a,b)=>a+b.amt,0);}

function render(){
  renderIncomeList();
  renderSummary();
  renderEnvSelect();
  renderDonut();
  renderEnvCards();
  renderExpenseList();
  renderGoal();
}

function renderIncomeList(){
  const el=document.getElementById('incomeList');
  const total=incomes.reduce((a,b)=>a+b.amt,0);
  el.innerHTML=incomes.map(src=>`
    <div class="src-item">
      <span style="flex:1;color:var(--text2)">${src.name}</span>
      <span style="font-weight:600">$${src.amt.toFixed(2)}</span>
      <button class="btn btn-sm btn-danger" onclick="deleteIncome(${src.id})">✕</button>
    </div>`).join('');
  document.getElementById('incomeTotal').textContent=`$${total.toFixed(2)}`;
}

function renderSummary(){
  const totalIncome=incomes.reduce((a,b)=>a+b.amt,0);
  const totalAlloc=envelopes.reduce((a,b)=>a+b.amt,0);
  const unalloc=totalIncome-totalAlloc;
  const totalSpent=monthExpenses().reduce((a,b)=>a+b.amt,0);
  const netSavings=totalIncome-totalSpent;
  document.getElementById('summaryRow').innerHTML=`
    <div class="sum-card"><div class="sum-label">Total Income</div><div class="sum-value" style="color:var(--green)">$${totalIncome.toFixed(2)}</div></div>
    <div class="sum-card"><div class="sum-label">Allocated</div><div class="sum-value">$${totalAlloc.toFixed(2)}</div></div>
    <div class="sum-card"><div class="sum-label">Unallocated</div><div class="sum-value" style="color:${unalloc<0?'var(--red)':'var(--text2)'}">$${unalloc.toFixed(2)}</div></div>
    <div class="sum-card"><div class="sum-label">Spent</div><div class="sum-value" style="color:var(--red)">$${totalSpent.toFixed(2)}</div></div>
    <div class="sum-card"><div class="sum-label">Net Savings</div><div class="sum-value" style="color:${netSavings<0?'var(--red)':'var(--green)'}">$${netSavings.toFixed(2)}</div></div>`;
}

function renderEnvSelect(){
  const sel=document.getElementById('expEnv');
  const cur=sel.value;
  sel.innerHTML='<option value="">Select envelope…</option>'+envelopes.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  sel.value=cur;
}

function renderDonut(){
  const canvas=document.getElementById('donutCanvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=100,r=50;
  ctx.clearRect(0,0,W,H);
  const totalAlloc=envelopes.reduce((a,b)=>a+b.amt,0);
  const legend=document.getElementById('donutLegend');
  if(!totalAlloc||!envelopes.length){
    ctx.fillStyle='rgba(59,130,246,0.15)';ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#020b18';ctx.fill();
    legend.innerHTML='<span style="font-size:11px;color:var(--text3)">No envelopes</span>';
    return;
  }
  let angle=-Math.PI/2;
  let legendHtml='';
  envelopes.forEach(env=>{
    const slice=(env.amt/totalAlloc)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=env.color;ctx.fill();
    ctx.strokeStyle='#020b18';ctx.lineWidth=2;ctx.stroke();
    legendHtml+=`<div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:8px;height:8px;border-radius:50%;background:${env.color}"></div>
      <span style="color:var(--text3)">${env.name}</span>
    </div>`;
    angle+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#020b18';ctx.fill();
  legend.innerHTML=legendHtml;
}

function renderEnvCards(){
  const el=document.getElementById('envCards');
  if(!envelopes.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">No envelopes yet. Add one in the sidebar.</div>';return;}
  el.innerHTML=envelopes.map(env=>{
    const spent=envSpent(env.id);
    const remaining=env.amt-spent;
    const pct=env.amt>0?Math.min(100,(spent/env.amt)*100):0;
    const over=remaining<0;
    const envExps=monthExpenses().filter(e=>e.envId===env.id);
    return `<div class="env-card" onclick="toggleEnvDetail(${env.id})">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:28px;height:28px;border-radius:50%;background:${env.color};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px">✉</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${env.name}</div>
          <div style="font-size:11px;color:var(--text3)">$${env.amt.toFixed(2)} allocated</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700;color:${over?'var(--red)':'var(--green)'}">$${Math.abs(remaining).toFixed(2)} ${over?'over':'left'}</div>
          <div style="font-size:11px;color:var(--text3)">Spent: $${spent.toFixed(2)}</div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteEnvelope(${env.id})" style="flex-shrink:0">✕</button>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;background:${over?'var(--red)':env.color}"></div></div>
      <div class="exp-detail" id="envDetail${env.id}">
        ${envExps.length?envExps.map(ex=>`<div class="exp-row">
          <span style="color:var(--text3);flex:1">${ex.date}</span>
          <span style="flex:2;color:var(--text2)">${ex.note||'—'}</span>
          <span style="font-weight:600;color:var(--red)">-$${ex.amt.toFixed(2)}</span>
          <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteExpense(${ex.id})" style="margin-left:6px">✕</button>
        </div>`).join(''):'<div style="color:var(--text3)">No expenses this month.</div>'}
      </div>
    </div>`;
  }).join('');
}

function toggleEnvDetail(id){
  const el=document.getElementById(`envDetail${id}`);
  if(el) el.classList.toggle('open');
}

function renderExpenseList(){
  const exps=monthExpenses().sort((a,b)=>b.date.localeCompare(a.date));
  const tbody=document.getElementById('expenseList');
  const empty=document.getElementById('expenseEmpty');
  if(!exps.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  tbody.innerHTML=exps.map(e=>{
    const env=envelopes.find(x=>x.id===e.envId);
    return `<tr>
      <td>${e.date}</td>
      <td>${env?`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${env.color};display:inline-block"></span>${env.name}</span>`:'Unknown'}</td>
      <td style="color:var(--text3)">${e.note||'—'}</td>
      <td style="text-align:right;font-weight:600;color:var(--red)">-$${e.amt.toFixed(2)}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteExpense(${e.id})">✕</button></td>
    </tr>`;
  }).join('');
}

function renderGoal(){
  const el=document.getElementById('goalDisplay');
  if(!savingsGoal.target){el.innerHTML='';return;}
  const totalIncome=incomes.reduce((a,b)=>a+b.amt,0);
  const totalSpent=monthExpenses().reduce((a,b)=>a+b.amt,0);
  const monthlySavings=totalIncome-totalSpent;
  const pct=savingsGoal.target>0?Math.min(100,(monthlySavings/savingsGoal.target)*100):0;
  const monthsToGoal=monthlySavings>0?(savingsGoal.target/monthlySavings).toFixed(1):'∞';
  document.getElementById('goalDesc').value=savingsGoal.desc||'';
  document.getElementById('goalTarget').value=savingsGoal.target||'';
  el.innerHTML=`
    <div style="font-size:12px;color:var(--text2);margin-bottom:6px">${savingsGoal.desc||'My Goal'}: <strong>$${savingsGoal.target.toFixed(2)}</strong></div>
    <div style="background:rgba(0,0,0,0.3);border-radius:4px;height:8px;overflow:hidden;margin-bottom:4px">
      <div style="height:100%;border-radius:4px;background:var(--green);width:${pct}%;transition:width 0.4s"></div>
    </div>
    <div style="font-size:11px;color:var(--text3)">Monthly savings: <strong style="color:var(--green)">$${monthlySavings.toFixed(2)}</strong> · Est. ${monthsToGoal} months to goal</div>`;
}

render();
</script>
</body>
</html>
