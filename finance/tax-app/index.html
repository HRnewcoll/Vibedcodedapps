<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tax Calculator 2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#020b18; --accent:#3b82f6; --accent2:#2563eb; --accent3:#60a5fa;
  --border:rgba(59,130,246,0.2); --glass:rgba(59,130,246,0.08);
  --text:#e0f2fe; --text2:#93c5fd; --text3:rgba(224,242,254,0.6);
  --green:#22c55e; --red:#ef4444; --yellow:#eab308;
}
body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#020b18,#041525,#020f1e); min-height:100vh; color:var(--text); }
.back-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:var(--glass); border:1px solid var(--border); border-radius:8px; color:var(--text2); text-decoration:none; font-size:13px; }
.back-btn:hover { background:rgba(59,130,246,0.16); }
.disclaimer { background:rgba(234,179,8,0.1); border:1px solid rgba(234,179,8,0.3); border-radius:8px; padding:10px 16px; color:#fde68a; font-size:12px; }
header { padding:14px 24px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); }
header h1 { font-size:19px; font-weight:700; color:var(--accent3); }
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border); padding:0 24px; }
.tab { padding:12px 24px; cursor:pointer; border-bottom:2px solid transparent; font-size:14px; font-weight:500; color:var(--text3); transition:all 0.2s; white-space:nowrap; }
.tab.active { color:var(--accent3); border-bottom-color:var(--accent3); }
.tab:hover { color:var(--text2); }
.app-body { padding:20px 24px; max-width:900px; margin:0 auto; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.panel { background:var(--glass); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
.panel-title { font-size:11px; font-weight:700; color:var(--text2); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; color:var(--text3); margin-bottom:5px; }
input[type=number], select { background:rgba(0,0,0,0.35); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:9px 12px; font-size:13px; width:100%; font-family:inherit; }
input:focus, select:focus { outline:none; border-color:var(--accent); }
.btn-primary { background:var(--accent2); color:#fff; border:none; border-radius:8px; padding:11px 24px; font-size:14px; font-weight:600; cursor:pointer; width:100%; font-family:inherit; transition:background 0.2s; }
.btn-primary:hover { background:var(--accent); }
/* Results table */
.results-table { width:100%; border-collapse:collapse; }
.results-table th { text-align:left; font-size:11px; color:var(--text3); padding:8px 10px; border-bottom:1px solid var(--border); font-weight:500; }
.results-table td { padding:8px 10px; border-bottom:1px solid rgba(59,130,246,0.07); font-size:13px; }
.results-table td:last-child { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.results-table tr.total-row td { font-weight:700; border-top:1px solid var(--border); color:var(--accent3); }
.results-table tr.takehome td { font-weight:700; color:var(--green); font-size:15px; }
.results-table tr.highlight td { color:var(--text2); }
.result-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
.result-badge-blue { background:rgba(59,130,246,0.15); color:var(--accent3); }
.anim-row { animation:fadeUp 0.3s ease forwards; opacity:0; transform:translateY(8px); }
@keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
/* Print */
@media print {
  body { background:white !important; color:black !important; }
  .tabs, header .back-btn, .btn-primary { display:none !important; }
  .panel { border:1px solid #ccc !important; background:white !important; }
  .panel-title, label, th, td { color:black !important; }
  .results-table tr.takehome td { color:green !important; }
}
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// ── UK CALCULATOR ──────────────────────────────────────────────────────────
function calcUK({ employment, selfEmployment, rental, dividends, pension, giftAid }) {
  const e = v => parseFloat(v)||0;
  const empInc = e(employment), seProfit = e(selfEmployment),
        rentalInc = e(rental), divInc = e(dividends),
        pensionContr = e(pension), giftAidDons = e(giftAid);

  const totalIncome = empInc + seProfit + rentalInc + divInc;
  const adjustedNetIncome = totalIncome - pensionContr - (giftAidDons * 125/100);

  // Personal allowance
  let pa = 12570;
  if (adjustedNetIncome > 100000) pa = Math.max(0, pa - Math.floor((adjustedNetIncome - 100000)/2));
  if (adjustedNetIncome >= 125140) pa = 0;

  // Non-savings income (employment + SE + rental)
  const nonSavings = empInc + seProfit + rentalInc;
  let incomeTax = 0;
  const taxableNonSavings = Math.max(0, nonSavings - pa);
  const remaining_after_pa = Math.max(0, nonSavings - pa);
  // Basic rate band: up to £50,270 total (above PA)
  const basic_limit = 50270 - pa;
  const higher_limit = 125140 - pa;
  if (remaining_after_pa > 0) {
    const basic = Math.min(remaining_after_pa, Math.max(0, 50270 - pa));
    const higher = Math.min(Math.max(0, remaining_after_pa - Math.max(0, 50270 - pa)), Math.max(0, 125140 - 50270));
    const add = Math.max(0, remaining_after_pa - Math.max(0, 125140 - pa));
    incomeTax += basic * 0.20;
    incomeTax += higher * 0.40;
    incomeTax += add * 0.45;
  }

  // Dividends (£500 allowance from 2024/25)
  let divTax = 0;
  const taxableDiv = Math.max(0, divInc - 500);
  if (taxableDiv > 0) {
    // Which band does it fall in?
    const usedBand = nonSavings > pa ? Math.min(nonSavings - pa, 50270 - pa) : 0;
    const leftInBasic = Math.max(0, (50270 - pa) - usedBand);
    const divBasic = Math.min(taxableDiv, leftInBasic);
    const divHigher = Math.min(Math.max(0, taxableDiv - divBasic), 125140 - 50270);
    const divAdd = Math.max(0, taxableDiv - divBasic - divHigher);
    divTax = divBasic*0.0875 + divHigher*0.3375 + divAdd*0.3935;
  }

  // National Insurance
  let niClass1 = 0, niClass2 = 0, niClass4 = 0;
  if (empInc > 0) {
    const niBasic = Math.min(Math.max(0, empInc - 12570), 50270 - 12570);
    const niHigher = Math.max(0, empInc - 50270);
    niClass1 = niBasic * 0.08 + niHigher * 0.02;
  }
  if (seProfit > 12570) niClass2 = 179.40;
  if (seProfit > 12570) {
    const seBasic = Math.min(Math.max(0, seProfit - 12570), 50270 - 12570);
    const seHigher = Math.max(0, seProfit - 50270);
    niClass4 = seBasic * 0.09 + seHigher * 0.02;
  }

  const totalNI = niClass1 + niClass2 + niClass4;
  const totalTax = incomeTax + divTax + totalNI;
  const effectiveRate = totalIncome > 0 ? (totalTax/totalIncome*100) : 0;
  const takeHome = totalIncome - totalTax - pensionContr;

  return {
    rows: [
      { label:'Total Gross Income', value: totalIncome, fmt:'gbp' },
      { label:'Personal Allowance', value: pa, fmt:'gbp' },
      { label:'Adjusted Net Income', value: adjustedNetIncome, fmt:'gbp' },
      { label:'─── Income Tax (Non-Savings)', value: incomeTax, fmt:'gbp', indent:true },
      { label:'─── Dividend Tax', value: divTax, fmt:'gbp', indent:true },
      { label:'─── NI Class 1 (Employment)', value: niClass1, fmt:'gbp', indent:true, skip: empInc===0 },
      { label:'─── NI Class 2 (Self-Employment)', value: niClass2, fmt:'gbp', indent:true, skip: seProfit===0 },
      { label:'─── NI Class 4 (Self-Employment)', value: niClass4, fmt:'gbp', indent:true, skip: seProfit===0 },
    ],
    totalTax, effectiveRate, takeHome, currency:'£'
  };
}

// ── US CALCULATOR ──────────────────────────────────────────────────────────
function applyBrackets(taxable, brackets) {
  let tax = 0, prev = 0;
  for (const [limit, rate] of brackets) {
    if (taxable <= prev) break;
    const band = Math.min(taxable, limit) - prev;
    tax += band * rate;
    prev = limit;
  }
  return tax;
}

function calcUS({ gross, filingStatus, deductionType, itemisedAmt, k401 }) {
  const e = v => parseFloat(v)||0;
  const grossInc=e(gross), contrib401k=e(k401), itemised=e(itemisedAmt);
  const stdDeductions = { Single:14600, MFJ:29200, HOH:21900 };
  const std = stdDeductions[filingStatus]||14600;
  const deduction = deductionType==='Itemised' ? itemised : std;
  const agi = Math.max(0, grossInc - contrib401k);
  const taxable = Math.max(0, agi - deduction);

  const brackets = {
    Single: [[11600,0.10],[47150,0.12],[100525,0.22],[191950,0.24],[243725,0.32],[609350,0.35],[Infinity,0.37]],
    MFJ:    [[23200,0.10],[94300,0.12],[201050,0.22],[383900,0.24],[487450,0.32],[731200,0.35],[Infinity,0.37]],
    HOH:    [[16550,0.10],[63100,0.12],[100500,0.22],[191950,0.24],[243700,0.32],[609350,0.35],[Infinity,0.37]]
  };
  const bracks = brackets[filingStatus] || brackets.Single;
  const fedTax = applyBrackets(taxable, bracks);

  // Marginal rate
  let marginalRate = 0.10;
  for (const [limit, rate] of bracks) {
    if (taxable <= limit) { marginalRate = rate; break; }
  }

  // FICA
  const ssCap = 168600;
  const ss = Math.min(grossInc, ssCap) * 0.062;
  const medicareSurcharge = filingStatus==='MFJ' ? 0 : Math.max(0, grossInc-200000)*0.009;
  const medicare = grossInc*0.0145 + medicareSurcharge;

  const totalTax = fedTax + ss + medicare;
  const effectiveRate = grossInc > 0 ? (totalTax/grossInc*100) : 0;
  const takeHome = grossInc - totalTax - contrib401k;

  return {
    rows: [
      { label:'Gross Income', value: grossInc, fmt:'usd' },
      { label:'401(k) Contribution', value: contrib401k, fmt:'usd' },
      { label:'AGI', value: agi, fmt:'usd' },
      { label:`Deduction (${deductionType})`, value: deduction, fmt:'usd' },
      { label:'Taxable Income', value: taxable, fmt:'usd' },
      { label:'─── Federal Income Tax', value: fedTax, fmt:'usd', indent:true },
      { label:'─── Social Security (6.2%)', value: ss, fmt:'usd', indent:true },
      { label:'─── Medicare (1.45%+)', value: medicare, fmt:'usd', indent:true },
    ],
    totalTax, effectiveRate, marginalRate, takeHome, currency:'$'
  };
}

// ── RESULTS TABLE ──────────────────────────────────────────────────────────
function ResultsTable({ result, mode }) {
  if (!result) return null;
  const fmt = (v, t) => {
    const sym = t==='gbp'?'£':'$';
    return `${sym}${Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  };
  return (
    <div className="panel" style={{animationDelay:'0s'}}>
      <div className="panel-title">Results</div>
      <table className="results-table">
        <thead><tr><th>Component</th><th>Amount</th></tr></thead>
        <tbody>
          {result.rows.filter(r=>!r.skip).map((r,i)=>(
            <tr key={i} className={`anim-row ${r.indent?'':'highlight'}`} style={{animationDelay:`${i*0.05}s`}}>
              <td style={{paddingLeft: r.indent?'22px':'10px', color: r.indent?'var(--text3)':'var(--text2)'}}>{r.label}</td>
              <td>{fmt(r.value, r.fmt)}</td>
            </tr>
          ))}
          <tr className="anim-row total-row" style={{animationDelay:`${result.rows.length*0.05}s`}}>
            <td>Total Tax</td><td style={{color:'var(--red)'}}>{fmt(result.totalTax, mode==='uk'?'gbp':'usd')}</td>
          </tr>
          {result.marginalRate !== undefined && (
            <tr className="anim-row" style={{animationDelay:`${(result.rows.length+1)*0.05}s`}}>
              <td style={{color:'var(--text3)'}}>Marginal Rate</td><td>{(result.marginalRate*100).toFixed(0)}%</td>
            </tr>
          )}
          <tr className="anim-row" style={{animationDelay:`${(result.rows.length+2)*0.05}s`}}>
            <td style={{color:'var(--text3)'}}>Effective Rate</td><td>{result.effectiveRate.toFixed(2)}%</td>
          </tr>
          <tr className="anim-row takehome" style={{animationDelay:`${(result.rows.length+3)*0.05}s`}}>
            <td>Take-Home Pay</td><td>{fmt(result.takeHome, mode==='uk'?'gbp':'usd')}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

// ── UK FORM ────────────────────────────────────────────────────────────────
function UKForm({ onCalc }) {
  const [f, setF] = useState({ employment:'', selfEmployment:'', rental:'', dividends:'', pension:'', giftAid:'' });
  const set = k => e => setF(v=>({...v,[k]:e.target.value}));
  return (
    <div>
      <div className="panel">
        <div className="panel-title">🇬🇧 UK Income (2024/25)</div>
        <div className="grid2">
          <div>
            <div className="field"><label>Employment Income (£)</label><input type="number" placeholder="0" value={f.employment} onChange={set('employment')}/></div>
            <div className="field"><label>Self-Employment Profit (£)</label><input type="number" placeholder="0" value={f.selfEmployment} onChange={set('selfEmployment')}/></div>
            <div className="field"><label>Rental Income (£)</label><input type="number" placeholder="0" value={f.rental} onChange={set('rental')}/></div>
          </div>
          <div>
            <div className="field"><label>Dividend Income (£)</label><input type="number" placeholder="0" value={f.dividends} onChange={set('dividends')}/></div>
            <div className="field"><label>Pension Contributions (£)</label><input type="number" placeholder="0" value={f.pension} onChange={set('pension')}/></div>
            <div className="field"><label>Gift Aid Donations (£)</label><input type="number" placeholder="0" value={f.giftAid} onChange={set('giftAid')}/></div>
          </div>
        </div>
        <button className="btn-primary" onClick={()=>onCalc(f)}>Calculate Tax</button>
      </div>
      <div style={{fontSize:'11px',color:'var(--text3)',marginTop:8}}>
        Based on 2024/25 rates. PA £12,570 · Basic 20% · Higher 40% · Additional 45% · NI Class 1/2/4
      </div>
    </div>
  );
}

// ── US FORM ────────────────────────────────────────────────────────────────
function USForm({ onCalc }) {
  const [f, setF] = useState({ gross:'', filingStatus:'Single', deductionType:'Standard', itemisedAmt:'', k401:'' });
  const set = k => e => setF(v=>({...v,[k]:e.target.value}));
  return (
    <div>
      <div className="panel">
        <div className="panel-title">🇺🇸 US Federal Income (2024)</div>
        <div className="grid2">
          <div>
            <div className="field"><label>Gross Income ($)</label><input type="number" placeholder="0" value={f.gross} onChange={set('gross')}/></div>
            <div className="field"><label>Filing Status</label>
              <select value={f.filingStatus} onChange={set('filingStatus')}>
                <option value="Single">Single</option>
                <option value="MFJ">Married Filing Jointly</option>
                <option value="HOH">Head of Household</option>
              </select>
            </div>
            <div className="field"><label>401(k) Contributions ($)</label><input type="number" placeholder="0" value={f.k401} onChange={set('k401')}/></div>
          </div>
          <div>
            <div className="field"><label>Deduction Type</label>
              <select value={f.deductionType} onChange={set('deductionType')}>
                <option value="Standard">Standard</option>
                <option value="Itemised">Itemised</option>
              </select>
            </div>
            {f.deductionType==='Itemised' && (
              <div className="field"><label>Itemised Deduction Amount ($)</label><input type="number" placeholder="0" value={f.itemisedAmt} onChange={set('itemisedAmt')}/></div>
            )}
          </div>
        </div>
        <button className="btn-primary" onClick={()=>onCalc(f)}>Calculate Tax</button>
      </div>
      <div style={{fontSize:'11px',color:'var(--text3)',marginTop:8}}>
        Standard deductions: Single $14,600 · MFJ $29,200 · HOH $21,900 · SS cap $168,600 · Medicare 1.45%+
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('uk');
  const [ukResult, setUKResult] = useState(null);
  const [usResult, setUSResult] = useState(null);

  return (
    <div>
      <header>
        <a href="../../index.html" className="back-btn">← Back</a>
        <h1>🧾 Tax Calculator 2024</h1>
        <div style={{marginLeft:'auto'}}>
          <button onClick={()=>window.print()} style={{background:'var(--glass)',border:'1px solid var(--border)',color:'var(--text2)',padding:'7px 14px',borderRadius:'7px',cursor:'pointer',fontSize:'12px'}}>🖨 Print</button>
        </div>
      </header>

      <div className="tabs">
        <div className={`tab${tab==='uk'?' active':''}`} onClick={()=>setTab('uk')}>🇬🇧 UK Self-Assessment</div>
        <div className={`tab${tab==='us'?' active':''}`} onClick={()=>setTab('us')}>🇺🇸 US Federal</div>
      </div>

      <div className="app-body">
        <div className="disclaimer" style={{marginBottom:16}}>⚠️ For guidance only. Consult a qualified tax professional. Calculations are approximate.</div>

        {tab==='uk' && (
          <div className="grid2">
            <UKForm onCalc={vals=>setUKResult(calcUK(vals))}/>
            <ResultsTable result={ukResult} mode="uk"/>
          </div>
        )}
        {tab==='us' && (
          <div className="grid2">
            <USForm onCalc={vals=>setUSResult(calcUS(vals))}/>
            <ResultsTable result={usResult} mode="us"/>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
