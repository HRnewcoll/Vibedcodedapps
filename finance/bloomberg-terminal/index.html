*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020b18;--accent:#f59e0b;--accent2:#d97706;--accent3:#fbbf24;

body{font-family:'JetBrains Mono',monospace;background:var(--bg);min-height:100vh;color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.3)}
::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:3px}
/* NAV */
.top-nav{position:sticky;top:0;z-index:200;background:rgba(2,11,24,0.97);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.nav-main{display:flex;align-items:center;gap:12px;padding:8px 16px}
.nav-logo{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:0.12em;white-space:nowrap;text-shadow:0 0 20px rgba(245,158,11,0.4)}
.nav-clock{font-size:13px;color:var(--accent3);font-weight:600;min-width:180px;text-align:right}
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:rgba(245,158,11,0.1);border:1px solid var(--border);border-radius:6px;color:var(--accent3);text-decoration:none;font-size:11px;font-family:inherit;transition:all 0.2s;white-space:nowrap}
.back-btn:hover{background:rgba(245,158,11,0.2);color:var(--accent)}
.ticker-strip{background:rgba(0,0,0,0.4);border-top:1px solid var(--border);padding:5px 0;overflow:hidden;white-space:nowrap}
.ticker-inner{display:inline-block;animation:scroll-left 45s linear infinite}
.ticker-inner:hover{animation-play-state:paused}
.ticker-item{display:inline-block;padding:0 24px;font-size:12px;font-weight:600}
.ticker-sym{color:var(--accent3);margin-right:6px}
.ticker-price{color:var(--text)}
.ticker-chg.up{color:var(--green)}
.ticker-chg.dn{color:var(--red)}
@keyframes scroll-left{0%{transform:translateX(0%)}100%{transform:translateX(-50%)}}
/* TABS */
.tab-bar{display:flex;gap:2px;padding:8px 16px;background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border)}
.tab-btn{padding:7px 20px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:700;letter-spacing:0.08em;cursor:pointer;font-family:inherit;border-radius:5px;transition:all 0.2s}
.tab-btn:hover:not(.active){background:rgba(245,158,11,0.08);color:var(--text)}
.tab-btn.active{background:rgba(245,158,11,0.18);color:var(--accent);border-bottom:2px solid var(--accent)}
/* LAYOUT */
.app-body{padding:12px 16px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.panel-title{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
/* MARKET CARDS */
.mkt-card{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:7px;padding:10px 14px;transition:border-color 0.2s}
.mkt-card:hover{border-color:rgba(245,158,11,0.4)}
.mkt-sym{font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:0.06em}
.mkt-name{font-size:10px;color:var(--text3);margin-bottom:6px}
.mkt-price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;transition:color 0.4s}
.mkt-chg{font-size:11px;font-weight:600;margin-top:2px}
.flash-green{animation:flashG 0.6s ease}
.flash-red{animation:flashR 0.6s ease}
@keyframes flashG{0%,100%{color:inherit}50%{color:var(--green)}}
@keyframes flashR{0%,100%{color:inherit}50%{color:var(--red)}}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:7px 10px;text-align:left;color:var(--accent3);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}

.dn{color:var(--red)}

.ob-bar{position:absolute;top:0;bottom:0;opacity:0.12;border-radius:3px;z-index:0}
.ob-cell{position:relative;z-index:1;flex:1;text-align:right}

.chart-line{fill:none;stroke-width:2}
.chart-area{opacity:0.15}

input:focus,select:focus{outline:none;border-color:var(--accent)}
select option{background:#0a1628}

.btn-acc:hover{background:var(--accent3)}

/* ─── Data generators ───────────────────────────────────────────────── */
function genPrices(base,n,seed,vol=0.012){
  const rng=mkRng(seed);
  const arr=[base];
  for(let i=1;i<n;i++){
    const chg=(rng()-0.5)*2*vol*arr[i-1];
    arr.push(Math.max(arr[i-1]+chg,base*0.4));
  }
  return arr;
}

function genCandles(base,n,seed){
  const rng=mkRng(seed);
  const candles=[];
  let price=base;
  for(let i=0;i<n;i++){
    const open=price;
    const change=(rng()-0.48)*0.025*price;
    const close=open+change;
    const highMult=1+(rng()*0.015);
    const lowMult=1-(rng()*0.015);
    const high=Math.max(open,close)*highMult;
    const low=Math.min(open,close)*lowMult;
    candles.push({open,close,high,low});
    price=close;
  }
  return candles;
}

function genVolumes(n,seed){
  const rng=mkRng(seed);
  return Array.from({length:n},()=>5e6+(rng()*45e6));
}

function sma(arr,period){
  return arr.map((_,i)=>{
    if(i<period-1)return null;
    return arr.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period;
  });
}

/* ─── Hook: live price walk ─────────────────────────────────────────── */
function useLivePrice(base,seed,interval=3000,vol=0.003){
  const rng=useRef(mkRng(seed+100));
  const [price,setPrice]=useState(()=>{
    const r=mkRng(seed+99);
    return base*(1+(r()-0.5)*0.02);
  });
  const [flash,setFlash]=useState('');
  const prevRef=useRef(price);
  useEffect(()=>{
    const id=setInterval(()=>{
      setPrice(p=>{
        const delta=(rng.current()-0.5)*2*vol*p;
        const next=p+delta;
        setFlash(delta>=0?'flash-green':'flash-red');
        setTimeout(()=>setFlash(''),650);
        prevRef.current=p;
        return next;
      });
    },interval+(Math.random()*800-400));
    return ()=>clearInterval(id);
  },[interval,vol]);
  const chg=price-base;
  const chgPct=(chg/base)*100;
  return {price,flash,chg,chgPct};
}

function TickerStrip(){
  const ITEMS=TICKER_SYMS.map((sym,i)=>({sym,seed:i+200}));
  const [prices,setPrices]=useState(()=>ITEMS.map(it=>{
    const r=mkRng(it.seed);const b=200+r()*600;
    return {price:b,base:b};
  }));
  useEffect(()=>{
    const rngs=ITEMS.map(it=>mkRng(it.seed+300));
    const id=setInterval(()=>{
      setPrices(prev=>prev.map((p,i)=>{
        const delta=(rngs[i]()-0.5)*0.006*p.price;
        return {...p,price:p.price+delta};
      }));
    },1800);
    return ()=>clearInterval(id);
  },[]);
  const doubled=[...ITEMS,...ITEMS];
  return (
    <div className="ticker-strip">
      <div className="ticker-inner">
        {doubled.map((it,i)=>{
          const p=prices[i%ITEMS.length];
          const chg=((p.price-p.base)/p.base)*100;
          return (
            <span key={i} className="ticker-item">
              <span className="ticker-sym">{it.sym}</span>
              <span className="ticker-price">{fmt(p.price,p.price>100?2:4)}</span>
              <span className={`ticker-chg ${chg>=0?'up':'dn'}`}> {fmtPct(chg)}</span>
            </span>
          );
        })}
      </div>
    </div>
  );
}

/* ─── CandleChart ───────────────────────────────────────────────────── */
function CandleChart({base,seed,title}){
  const [candles,setCandles]=useState(()=>genCandles(base,30,seed));
  useEffect(()=>{
    const rng=mkRng(seed+500);
    const id=setInterval(()=>{
      setCandles(prev=>{
        const last=prev[prev.length-1];
        const open=last.close;
        const change=(rng()-0.48)*0.025*open;
        const close=open+change;
        const high=Math.max(open,close)*(1+rng()*0.015);
        const low=Math.min(open,close)*(1-rng()*0.015);
        return [...prev.slice(1),{open,close,high,low}];
      });
    },4000);
    return ()=>clearInterval(id);
  },[base,seed]);
  const W=560,H=180,PL=50,PR=10,PT=10,PB=20;
  const cW=W-PL-PR,cH=H-PT-PB;
  const allHi=candles.map(c=>c.high);
  const allLo=candles.map(c=>c.low);
  const hi=Math.max(...allHi);
  const lo=Math.min(...allLo);
  const range=hi-lo||1;
  const scaleY=v=>PT+cH-(((v-lo)/range)*cH);
  const bw=Math.floor(cW/candles.length);
  const gap=1;
  return (
    <div className="panel">
      <div className="panel-title">📊 {title} — Candlestick (30 bars)</div>
      <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`}>
        {[0,0.25,0.5,0.75,1].map((f,i)=>{
          const y=PT+cH*f;
          const v=hi-range*f;
          return <g key={i}>
            <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="rgba(245,158,11,0.1)" strokeDasharray="3,3"/>
            <text x={PL-4} y={y+4} fill="rgba(203,213,225,0.5)" fontSize="9" textAnchor="end">{fmt(v,0)}</text>
          </g>;
        })}
        {candles.map((c,i)=>{
          const x=PL+i*bw+bw/2;
          const isUp=c.close>=c.open;
          const color=isUp?'var(--green)':'var(--red)';
          const bodyTop=scaleY(Math.max(c.open,c.close));
          const bodyBot=scaleY(Math.min(c.open,c.close));
          const bodyH=Math.max(bodyBot-bodyTop,1);
          const cbw=Math.max(bw-gap*2-2,2);
          return <g key={i}>
            <line x1={x} y1={scaleY(c.high)} x2={x} y2={scaleY(c.low)} stroke={color} strokeWidth="1"/>
            <rect x={x-cbw/2} y={bodyTop} width={cbw} height={bodyH} fill={isUp?'var(--green)':'var(--red)'} opacity="0.85"/>
          </g>;
        })}
        <text x={PL} y={H-3} fill="rgba(203,213,225,0.4)" fontSize="9">SIMULATED</text>
      </svg>
    </div>
  );
}

/* ─── OrderBook ─────────────────────────────────────────────────────── */
function OrderBook({base,seed}){
  const rng=useRef(mkRng(seed+700));
  const [book,setBook]=useState(()=>{
    const r=mkRng(seed+700);
    const mid=base*(1+(r()-0.5)*0.005);
    const spread=mid*0.0004;
    const asks=Array.from({length:8},(_,i)=>{
      const px=mid+spread/2+(i*spread*0.8);
      const sz=(r()*200+20).toFixed(2);
      return {px,sz};
    });
    const bids=Array.from({length:8},(_,i)=>{
      const px=mid-spread/2-(i*spread*0.8);
      const sz=(r()*200+20).toFixed(2);
      return {px,sz};
    });
    return {asks,bids,mid};
  });
  useEffect(()=>{
    const id=setInterval(()=>{
      setBook(prev=>{
        const delta=(rng.current()-0.5)*0.001*prev.mid;
        const mid=prev.mid+delta;
        const spread=mid*0.0004;
        const asks=prev.asks.map((a,i)=>({px:mid+spread/2+(i*spread*0.8),sz:Math.max(0.01,parseFloat(a.sz)+(rng.current()-0.5)*20).toFixed(2)}));
        const bids=prev.bids.map((b,i)=>({px:mid-spread/2-(i*spread*0.8),sz:Math.max(0.01,parseFloat(b.sz)+(rng.current()-0.5)*20).toFixed(2)}));
        return {asks,bids,mid};
      });
    },3000);
    return ()=>clearInterval(id);
  },[]);
  const maxSz=Math.max(...book.asks.map(a=>parseFloat(a.sz)),...book.bids.map(b=>parseFloat(b.sz)));
  const dp=base>1000?2:base>100?3:4;
  return (
    <div className="panel">
      <div className="panel-title">📋 Order Book</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <div>
          <div style={{fontSize:10,color:'var(--red)',fontWeight:700,marginBottom:5,letterSpacing:'0.06em'}}>ASKS (SELL)</div>
          {[...book.asks].reverse().map((a,i)=>(
            <div key={i} className="ob-row" style={{marginBottom:2}}>
              <div className="ob-bar" style={{background:'var(--red)',width:(parseFloat(a.sz)/maxSz*100)+'%',right:0}}></div>
              <span className="ob-cell" style={{color:'var(--red)'}}>{fmt(a.px,dp)}</span>
              <span className="ob-cell">{a.sz}</span>
            </div>
          ))}
        </div>
        <div>
          <div style={{fontSize:10,color:'var(--green)',fontWeight:700,marginBottom:5,letterSpacing:'0.06em'}}>BIDS (BUY)</div>
          {book.bids.map((b,i)=>(
            <div key={i} className="ob-row" style={{marginBottom:2}}>
              <div className="ob-bar" style={{background:'var(--green)',width:(parseFloat(b.sz)/maxSz*100)+'%',left:0}}></div>
              <span className="ob-cell" style={{color:'var(--green)'}}>{fmt(b.px,dp)}</span>
              <span className="ob-cell">{b.sz}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{textAlign:'center',padding:'8px 0 0',fontSize:13,fontWeight:700,color:'var(--accent)'}}>
        MID: {fmt(book.mid,dp)}
      </div>
    </div>
  );
}

/* ─── LineChart (reusable) ──────────────────────────────────────────── */
function LineChart({prices,smaLine,color='var(--blue)',W=580,H=180,title}){
  const PL=50,PR=12,PT=12,PB=22;
  const cW=W-PL-PR,cH=H-PT-PB;
  const hi=Math.max(...prices);
  const lo=Math.min(...prices);
  const range=hi-lo||1;
  const scaleX=(i)=>PL+(i/(prices.length-1))*cW;
  const scaleY=(v)=>PT+cH-((v-lo)/range)*cH;
  const pts=prices.map((v,i)=>`${scaleX(i)},${scaleY(v)}`).join(' ');
  const areaPts=`${PL},${PT+cH} `+prices.map((v,i)=>`${scaleX(i)},${scaleY(v)}`).join(' ')+` ${scaleX(prices.length-1)},${PT+cH}`;
  const smaPts=smaLine?smaLine.map((v,i)=>v!=null?`${scaleX(i)},${scaleY(v)}`:null).filter(Boolean).join(' '):null;
  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`}>
      {[0,0.25,0.5,0.75,1].map((f,i)=>{
        const v=hi-range*f;
        const y=PT+cH*f;
        return <g key={i}>
          <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="rgba(245,158,11,0.08)" strokeDasharray="3,3"/>
          <text x={PL-4} y={y+4} fill="rgba(203,213,225,0.45)" fontSize="9" textAnchor="end">{fmt(v,v>1000?0:2)}</text>
        </g>;
      })}
      <polygon points={areaPts} fill={color} opacity="0.08"/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
      {smaPts&&<polyline points={smaPts} fill="none" stroke="var(--accent)" strokeWidth="1.5" strokeDasharray="4,2" opacity="0.8"/>}
      {smaLine&&<text x={W-PR} y={12} fill="var(--accent)" fontSize="9" textAnchor="end">SMA20</text>}
    </svg>
  );
}

/* ─── VolumeChart ───────────────────────────────────────────────────── */
function VolumeChart({vols}){
  const W=580,H=80,PL=50,PR=12,PT=8,PB=5;
  const cW=W-PL-PR,cH=H-PT-PB;
  const max=Math.max(...vols);
  const bw=Math.floor(cW/vols.length)-1;
  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`}>
      {vols.map((v,i)=>{
        const h=(v/max)*cH;
        const x=PL+i*(cW/vols.length);
        return <rect key={i} x={x} y={PT+cH-h} width={bw} height={h} fill="var(--blue)" opacity="0.5"/>;
      })}
      <text x={PL-4} y={PT+10} fill="rgba(203,213,225,0.45)" fontSize="9" textAnchor="end">{fmtK(max)}</text>
    </svg>
  );
}

/* ─── FX Heatmap ────────────────────────────────────────────────────── */
function FXHeatmap(){
  const [data,setData]=useState(()=>FX_PAIRS.map((p,i)=>{const r=mkRng(p.seed+600);return {pair:p.pair,chg:(r()-0.5)*2};}));
  useEffect(()=>{
    const rng=mkRng(7777);
    const id=setInterval(()=>{
      setData(prev=>prev.map(d=>({...d,chg:d.chg+(rng()-0.5)*0.15})));
    },3000);
    return ()=>clearInterval(id);
  },[]);
  const getColor=chg=>{

  return (
    <div className="panel">
      <div className="panel-title">🔥 FX Heatmap (% Change)</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
        {data.map(d=>(

            <div style={{fontSize:10,color:'var(--text2)',marginBottom:3}}>{d.pair}</div>
            <div style={{fontSize:14,fontWeight:700,color:d.chg>=0?'var(--green)':'var(--red)'}}>{fmtPct(d.chg)}</div>
          </div>
        ))}

}

/* ─── FX Converter ──────────────────────────────────────────────────── */
function FXConverter(){
  const [amount,setAmount]=useState('1000');
  const [fromPair,setFromPair]=useState('EUR/USD');
  const [toPair,setToPair]=useState('GBP/USD');
  const getRate=pair=>{
    const found=FX_PAIRS.find(p=>p.pair===pair);
    return found?found.base:1;
  };
  const result=useMemo(()=>{
    const n=parseFloat(amount)||0;
    const from=getRate(fromPair);
    const to=getRate(toPair);
    return (n/from)*to;
  },[amount,fromPair,toPair]);
  const pairs=FX_PAIRS.map(p=>p.pair);

          <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} style={{width:140}} placeholder="Amount"/>
        </div>
        <div>
          <div style={{fontSize:10,color:'var(--text3)',marginBottom:4}}>FROM PAIR</div>
          <select value={fromPair} onChange={e=>setFromPair(e.target.value)} style={{width:130}}>
            {pairs.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div style={{paddingBottom:8,fontSize:18,color:'var(--accent)'}}>→</div>
        <div>
          <div style={{fontSize:10,color:'var(--text3)',marginBottom:4}}>TO PAIR</div>
          <select value={toPair} onChange={e=>setToPair(e.target.value)} style={{width:130}}>
            {pairs.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
      </div>
      <div style={{marginTop:14,background:'rgba(245,158,11,0.08)',border:'1px solid var(--border)',borderRadius:8,padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontSize:13,color:'var(--text3)'}}>{parseFloat(amount)||0} {fromPair} =</div>
        <div style={{fontSize:22,fontWeight:700,color:'var(--accent)'}}>{fmt(result,4)}</div>
        <div style={{fontSize:13,color:'var(--text3)'}}>{toPair}</div>

      <div style={{fontSize:10,color:'var(--text3)',marginTop:6}}>Using base mid-market rates. Live spreads apply in real trading.</div>
    </div>
  );
}

/* ─── YieldCurve ────────────────────────────────────────────────────── */
function YieldCurve(){
  const [pts,setPts]=useState(YIELD_POINTS);
  useEffect(()=>{
    const rng=mkRng(11111);
    const id=setInterval(()=>{
      setPts(prev=>prev.map(p=>({...p,y:clamp(p.y+(rng()-0.5)*0.04,0.1,10)})));
    },4000);
    return ()=>clearInterval(id);
  },[]);
  const W=500,H=160,PL=45,PR=20,PT=10,PB=30;
  const cW=W-PL-PR,cH=H-PT-PB;
  const ys=pts.map(p=>p.y);
  const maxY=Math.max(...ys)+0.3;
  const minY=Math.max(Math.min(...ys)-0.3,0);
  const range=maxY-minY||1;
  const scaleX=i=>PL+(i/(pts.length-1))*cW;
  const scaleY=v=>PT+cH-((v-minY)/range)*cH;
  const lineP=pts.map((p,i)=>`${scaleX(i)},${scaleY(p.y)}`).join(' ');
  const areaP=`${PL},${PT+cH} `+pts.map((p,i)=>`${scaleX(i)},${scaleY(p.y)}`).join(' ')+` ${scaleX(pts.length-1)},${PT+cH}`;
  const [hov,setHov]=useState(null);
  return (
    <div className="panel">
      <div className="panel-title">📈 US Treasury Yield Curve</div>
      <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`}>
        {[minY,(minY+maxY)/2,maxY].map((v,i)=>{
          const y=scaleY(v);
          return <g key={i}>
            <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="rgba(245,158,11,0.08)" strokeDasharray="3,3"/>
            <text x={PL-4} y={y+4} fill="rgba(203,213,225,0.45)" fontSize="9" textAnchor="end">{fmt(v,2)}%</text>
          </g>;
        })}
        <polygon points={areaP} fill="var(--blue)" opacity="0.1"/>
        <polyline points={lineP} fill="none" stroke="var(--blue)" strokeWidth="2.5" strokeLinejoin="round"/>
        {pts.map((p,i)=>(
          <g key={i} className="yc-dot" onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
            <circle cx={scaleX(i)} cy={scaleY(p.y)} r={hov===i?7:5} fill="var(--bg)" stroke="var(--blue)" strokeWidth="2"/>
            <text x={scaleX(i)} y={H-PB+15} fill="rgba(203,213,225,0.6)" fontSize="10" textAnchor="middle">{p.t}</text>
            {hov===i&&<text x={scaleX(i)} y={scaleY(p.y)-10} fill="var(--accent3)" fontSize="10" textAnchor="middle">{fmt(p.y,2)}%</text>}
          </g>
        ))}
      </svg>
    </div>
  );
}

/* ─── NEWS TAB ──────────────────────────────────────────────────────── */
function NewsTab(){
  const [readSet,setReadSet]=useState(()=>{
    try{const s=localStorage.getItem('bbg_read');return s?new Set(JSON.parse(s)):new Set();}catch{return new Set();}
  });
  const [expanded,setExpanded]=useState(null);
  const [filter,setFilter]=useState('All');
  const cats=['All','Markets','Crypto','FX','Macro'];
  const filtered=filter==='All'?NEWS_DATA:NEWS_DATA.filter(n=>n.cat===filter);
  const markRead=useCallback(id=>{
    setReadSet(prev=>{
      const next=new Set(prev);next.add(id);
      try{localStorage.setItem('bbg_read',JSON.stringify([...next]));}catch{}
      return next;
    });
  },[]);
  const toggle=id=>{
    setExpanded(prev=>prev===id?null:id);
    markRead(id);
  };
  const badgeCls=cat=>({Markets:'badge-mkts',Crypto:'badge-crypto',FX:'badge-fx',Macro:'badge-macro'}[cat]||'badge-mkts');
  return (
    <div>
      <div className="panel" style={{marginBottom:10}}>
        <div className="panel-title">📰 Financial News Feed</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
          {cats.map(c=>(
            <button key={c} className={`btn ${filter===c?'btn-acc':'btn-ghost'}`} style={{padding:'4px 14px',fontSize:11}} onClick={()=>setFilter(c)}>{c}</button>
          ))}
          <div style={{marginLeft:'auto',fontSize:11,color:'var(--text3)',display:'flex',alignItems:'center',gap:4}}>
            <span className="pulse"></span>{filtered.length} headlines
          </div>
        </div>
        {filtered.map(n=>(
          <div key={n.id} className={`news-item ${readSet.has(n.id)?'read':''}`} onClick={()=>toggle(n.id)}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
              <span className={`badge ${badgeCls(n.cat)}`}>{n.cat}</span>
              <div style={{flex:1}}>
                <div className="news-headline">{n.hl}</div>
                <div className="news-meta">
                  <span>{n.ts}</span>
                  <span>•</span>
                  {readSet.has(n.id)&&<span style={{color:'var(--green)'}}>✓ Read</span>}
                  {expanded===n.id?<span>▲ Collapse</span>:<span>▼ Expand</span>}
                </div>
                {expanded===n.id&&<div className="news-preview">{n.preview}</div>}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── Clock ─────────────────────────────────────────────────────────── */
function Clock(){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const id=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(id);},[]);
  const pad=n=>String(n).padStart(2,'0');
  const d=now;
  const dateStr=d.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
  const h=d.getHours();
  const timeStr=`${pad(h%12||12)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${h>=12?'PM':'AM'}`;
  return <div className="nav-clock">{dateStr} &nbsp; {timeStr}</div>;
}

        <div className="nav-main">

          <div className="nav-logo">⬛ BLOOMBERG TERMINAL</div>

        </div>

        <div className="tab-bar">

  );
}
