<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#020b18; --accent:#3b82f6; --accent2:#2563eb; --accent3:#60a5fa;
  --border:rgba(59,130,246,0.2); --glass:rgba(59,130,246,0.08);
  --text:#e0f2fe; --text2:#93c5fd; --text3:rgba(224,242,254,0.6);
  --green:#22c55e; --red:#ef4444; --yellow:#eab308;
}
body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#020b18,#041525,#020f1e); min-height:100vh; color:var(--text); }
.back-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:var(--glass); border:1px solid var(--border); border-radius:8px; color:var(--text2); text-decoration:none; font-size:13px; }
.back-btn:hover { background:rgba(59,130,246,0.16); }
header { padding:14px 24px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--border); }
header h1 { font-size:19px; font-weight:700; color:var(--accent3); }
.disclaimer { background:rgba(234,179,8,0.1); border:1px solid rgba(234,179,8,0.3); border-radius:8px; padding:10px 16px; color:#fde68a; font-size:12px; margin:16px 24px 0; }
.app-body { padding:16px 24px; }
.panel { background:var(--glass); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
.panel-title { font-size:11px; font-weight:700; color:var(--text2); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:12px; }
.form-row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
.form-group { display:flex; flex-direction:column; gap:4px; }
.form-group label { font-size:11px; color:var(--text3); }
input { background:rgba(0,0,0,0.35); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:8px 12px; font-size:13px; font-family:inherit; }
input:focus { outline:none; border-color:var(--accent); }
.btn { padding:8px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:13px; font-family:inherit; transition:all 0.2s; }
.btn-primary { background:var(--accent2); color:#fff; }
.btn-primary:hover { background:var(--accent); }
.btn-secondary { background:rgba(59,130,246,0.15); color:var(--text2); border:1px solid var(--border); }
.btn-secondary:hover { background:rgba(59,130,246,0.25); }
.btn-danger { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.25); }
.btn-danger:hover { background:rgba(239,68,68,0.28); }
.btn-sm { padding:4px 10px; font-size:11px; border-radius:5px; }
.cards-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.stat-card { background:var(--glass); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
.stat-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px; }
.stat-value { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { color:var(--text3); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
th:first-child { text-align:left; }
td { padding:8px 10px; border-bottom:1px solid rgba(59,130,246,0.07); text-align:right; font-variant-numeric:tabular-nums; }
td:first-child { text-align:left; font-weight:600; }
tr.totals-row { font-weight:700; border-top:1px solid var(--border); background:rgba(59,130,246,0.06); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
canvas { display:block; }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<header>
  <a href="../../index.html" class="back-btn">← Back</a>
  <h1>📈 Portfolio Tracker</h1>
  <div style="margin-left:auto;display:flex;gap:10px;">
    <button class="btn btn-secondary" onclick="refreshPrices()">🔄 Refresh Prices</button>
  </div>
</header>

<div class="disclaimer">⚠️ Simulated / manual prices for educational use only. Not financial advice.</div>

<div class="app-body">
  <!-- Add Holding -->
  <div class="panel">
    <div class="panel-title">Add Holding</div>
    <div class="form-row">
      <div class="form-group"><label>Symbol</label><input id="fSym" placeholder="AAPL" style="width:100px;text-transform:uppercase"></div>
      <div class="form-group"><label>Shares</label><input id="fShares" type="number" placeholder="10" style="width:100px"></div>
      <div class="form-group"><label>Avg Buy Price ($)</label><input id="fBuy" type="number" placeholder="150.00" style="width:130px"></div>
      <button class="btn btn-primary" onclick="addHolding()">+ Add</button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="cards-row" id="summaryCards"></div>

  <!-- Portfolio Table + Donut -->
  <div class="grid2">
    <div class="panel" style="overflow-x:auto;">
      <div class="panel-title">Holdings</div>
      <table id="portfolioTable">
        <thead><tr>
          <th>Symbol</th><th>Shares</th><th>Buy $</th><th>Current $</th><th>Value</th><th>Gain $</th><th>Gain %</th><th></th>
        </tr></thead>
        <tbody id="portfolioBody"></tbody>
        <tfoot id="portfolioFoot"></tfoot>
      </table>
      <div id="portfolioEmpty" style="text-align:center;padding:24px;color:var(--text3);font-size:13px;">No holdings yet. Add your first one above.</div>
    </div>
    <div class="panel">
      <div class="panel-title">Allocation</div>
      <canvas id="donutCanvas" width="260" height="260" style="margin:0 auto;"></canvas>
      <div id="donutLegend" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
  </div>

  <!-- Dividend Log -->
  <div class="panel">
    <div class="panel-title">Dividend Log</div>
    <div class="form-row" style="margin-bottom:14px;">
      <div class="form-group"><label>Symbol</label><input id="dSym" placeholder="AAPL" style="width:90px;text-transform:uppercase"></div>
      <div class="form-group"><label>Date</label><input id="dDate" type="date" style="width:140px"></div>
      <div class="form-group"><label>$/Share</label><input id="dAmt" type="number" placeholder="0.24" style="width:110px"></div>
      <button class="btn btn-primary" onclick="addDividend()">+ Add</button>
    </div>
    <table id="divTable">
      <thead><tr><th>Date</th><th>Symbol</th><th>Shares</th><th>$/Share</th><th>Total</th><th></th></tr></thead>
      <tbody id="divBody"></tbody>
    </table>
    <div style="margin-top:10px;font-size:13px;color:var(--text2);">Total Dividends: <strong id="divTotal" style="color:var(--green)">$0.00</strong></div>
  </div>
</div>

<script>
const COLORS=['#3b82f6','#8b5cf6','#22c55e','#f59e0b','#ec4899','#ef4444','#10b981','#60a5fa','#a78bfa','#34d399'];

function load(key,def){try{const s=localStorage.getItem(key);return s?JSON.parse(s):def;}catch{return def;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

let holdings=load('portfolioHoldings',[]);
let dividends=load('dividendLog',[]);

document.getElementById('dDate').value=new Date().toISOString().slice(0,10);

function addHolding(){
  const sym=document.getElementById('fSym').value.trim().toUpperCase();
  const shares=parseFloat(document.getElementById('fShares').value);
  const buyPrice=parseFloat(document.getElementById('fBuy').value);
  if(!sym||isNaN(shares)||isNaN(buyPrice)||shares<=0||buyPrice<=0) return alert('Please fill all fields correctly.');
  const currentPrice=buyPrice*(0.75+Math.random()*0.5);
  holdings.push({id:Date.now(),symbol:sym,shares,buyPrice,currentPrice});
  save('portfolioHoldings',holdings);
  document.getElementById('fSym').value='';
  document.getElementById('fShares').value='';
  document.getElementById('fBuy').value='';
  render();
}

function deleteHolding(id){
  holdings=holdings.filter(h=>h.id!==id);
  save('portfolioHoldings',holdings);
  render();
}

function refreshPrices(){
  holdings=holdings.map(h=>({...h,currentPrice:Math.max(0.01,h.currentPrice*(0.85+Math.random()*0.3))}));
  save('portfolioHoldings',holdings);
  render();
}

function addDividend(){
  const sym=document.getElementById('dSym').value.trim().toUpperCase();
  const date=document.getElementById('dDate').value;
  const amt=parseFloat(document.getElementById('dAmt').value);
  if(!sym||!date||isNaN(amt)||amt<=0) return alert('Please fill all fields.');
  const holding=holdings.find(h=>h.symbol===sym);
  const shares=holding?holding.shares:0;
  dividends.push({id:Date.now(),symbol:sym,date,amtPerShare:amt,shares});
  save('dividendLog',dividends);
  document.getElementById('dSym').value='';
  document.getElementById('dAmt').value='';
  renderDividends();
}

function deleteDividend(id){
  dividends=dividends.filter(d=>d.id!==id);
  save('dividendLog',dividends);
  renderDividends();
}

function render(){
  renderTable();
  renderSummary();
  renderDonut();
  renderDividends();
}

function renderTable(){
  const body=document.getElementById('portfolioBody');
  const foot=document.getElementById('portfolioFoot');
  const empty=document.getElementById('portfolioEmpty');
  if(!holdings.length){body.innerHTML='';foot.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  let totalValue=0,totalCost=0,totalGain=0;
  body.innerHTML=holdings.map((h,i)=>{
    const value=h.shares*h.currentPrice;
    const cost=h.shares*h.buyPrice;
    const gain=value-cost;
    const gainPct=(gain/cost)*100;
    totalValue+=value; totalCost+=cost; totalGain+=gain;
    const col=gain>=0?'var(--green)':'var(--red)';
    const sign=gain>=0?'+':'';
    return `<tr>
      <td style="color:${COLORS[i%COLORS.length]}">${h.symbol}</td>
      <td>${h.shares.toLocaleString()}</td>
      <td>$${h.buyPrice.toFixed(2)}</td>
      <td>$${h.currentPrice.toFixed(2)}</td>
      <td>$${value.toFixed(2)}</td>
      <td style="color:${col}">${sign}$${gain.toFixed(2)}</td>
      <td style="color:${col}">${sign}${gainPct.toFixed(2)}%</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteHolding(${h.id})">✕</button></td>
    </tr>`;
  }).join('');
  const totGainPct=totalCost>0?((totalGain/totalCost)*100):0;
  const totCol=totalGain>=0?'var(--green)':'var(--red)';
  const sign=totalGain>=0?'+':'';
  foot.innerHTML=`<tr class="totals-row">
    <td colspan="4">TOTAL</td>
    <td>$${totalValue.toFixed(2)}</td>
    <td style="color:${totCol}">${sign}$${totalGain.toFixed(2)}</td>
    <td style="color:${totCol}">${sign}${totGainPct.toFixed(2)}%</td>
    <td></td>
  </tr>`;
}

function renderSummary(){
  const totalValue=holdings.reduce((a,h)=>a+h.shares*h.currentPrice,0);
  const totalCost=holdings.reduce((a,h)=>a+h.shares*h.buyPrice,0);
  const totalGain=totalValue-totalCost;
  const gainPct=totalCost>0?(totalGain/totalCost*100):0;
  const col=totalGain>=0?'var(--green)':'var(--red)';
  const sign=totalGain>=0?'+':'';
  document.getElementById('summaryCards').innerHTML=`
    <div class="stat-card"><div class="stat-label">Total Value</div><div class="stat-value">$${totalValue.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Cost</div><div class="stat-value">$${totalCost.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Gain $</div><div class="stat-value" style="color:${col}">${sign}$${totalGain.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Gain %</div><div class="stat-value" style="color:${col}">${sign}${gainPct.toFixed(2)}%</div></div>`;
}

function renderDonut(){
  const canvas=document.getElementById('donutCanvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=100,r=50;
  ctx.clearRect(0,0,W,H);
  const total=holdings.reduce((a,h)=>a+h.shares*h.currentPrice,0);
  const legend=document.getElementById('donutLegend');
  if(!total||!holdings.length){
    ctx.fillStyle='rgba(59,130,246,0.15)';
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#020b18';ctx.fill();
    legend.innerHTML='<span style="font-size:12px;color:var(--text3)">No holdings</span>';
    return;
  }
  let angle=-Math.PI/2;
  let legendHtml='';
  holdings.forEach((h,i)=>{
    const val=h.shares*h.currentPrice;
    const slice=(val/total)*Math.PI*2;
    const color=COLORS[i%COLORS.length];
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=color;ctx.fill();
    ctx.strokeStyle='#020b18';ctx.lineWidth=2;ctx.stroke();
    legendHtml+=`<div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></div>
      <span style="color:var(--text3)">${h.symbol}</span>
      <span style="font-weight:600">${(val/total*100).toFixed(1)}%</span>
    </div>`;
    angle+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#020b18';ctx.fill();
  ctx.fillStyle='var(--text3)';ctx.font='bold 11px Inter';ctx.textAlign='center';ctx.fillText('Allocation',cx,cy+4);
  legend.innerHTML=legendHtml;
}

function renderDividends(){
  const body=document.getElementById('divBody');
  const totEl=document.getElementById('divTotal');
  let total=0;
  body.innerHTML=[...dividends].sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{
    const tot=d.amtPerShare*(d.shares||0);
    total+=tot;
    return `<tr>
      <td>${d.date}</td><td>${d.symbol}</td><td>${d.shares||'—'}</td>
      <td>$${d.amtPerShare.toFixed(4)}</td><td>$${tot.toFixed(2)}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteDividend(${d.id})">✕</button></td>
    </tr>`;
  }).join('');
  totEl.textContent=`$${total.toFixed(2)}`;
}

render();
</script>
</body>
</html>
