<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Shooting Games — VibedApps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --amber: #f59e0b; --amber2: #fbbf24;
      --border: rgba(245,158,11,.25); --glass: rgba(245,158,11,.08);
      --text: #fef3c7; --text2: rgba(254,243,199,.65); --text3: rgba(254,243,199,.38);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d0500, #1a0a00, #2d1600);
      min-height: 100vh; color: var(--text);
    }
    nav {
      position: sticky; top: 0;
      background: rgba(13,5,0,.96); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between; z-index: 100;
    }
    .back-btn { color: var(--amber); text-decoration: none; font-size: 14px; font-weight: 600; }
    nav h1 {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .menu { display: flex; justify-content: center; gap: 12px; padding: 16px 24px 8px; }
    .mbtn {
      background: var(--glass); border: 1px solid var(--border);
      color: var(--amber); padding: 10px 28px; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all .15s;
    }
    .mbtn:hover, .mbtn.active {
      background: rgba(245,158,11,.2); border-color: var(--amber);
    }
    .ga {
      display: none; flex-direction: column; align-items: center;
      padding: 6px 16px 32px; gap: 8px;
    }
    .ga.active { display: flex; }
    .hud {
      display: flex; gap: 18px; align-items: center;
      flex-wrap: wrap; justify-content: center;
    }
    .hi { color: var(--text2); font-size: 14px; font-weight: 700; }
    .hi strong { color: var(--amber2); }
    canvas {
      border: 2px solid var(--border); border-radius: 8px;
      display: block; max-width: 100%; cursor: crosshair;
    }
    .btn {
      background: var(--glass); border: 1px solid var(--border);
      color: var(--amber); padding: 8px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all .15s;
    }
    .btn:hover { background: rgba(245,158,11,.18); }
    .info { color: var(--text3); font-size: 12px; text-align: center; max-width: 600px; }
    .btn-row { display: flex; gap: 8px; align-items: center; }
    /* pause overlay handled in canvas */
  </style>
</head>
<body>
<nav>
  <a class="back-btn" href="../index.html">← Back</a>
  <h1>🔫 Shooting Games</h1>
  <div></div>
</nav>

<div class="menu">
  <button class="mbtn active" id="mb1" onclick="showGame(1)">👾 Space Invaders</button>
  <button class="mbtn" id="mb2" onclick="showGame(2)">🎯 Target Shooter</button>
</div>

<!-- ===== SPACE INVADERS ===== -->
<div class="ga active" id="g1">
  <div class="hud">
    <span class="hi">Score: <strong id="si-score">0</strong></span>
    <span class="hi">Hi-Score: <strong id="si-hi">0</strong></span>
    <span class="hi">Lives: <strong id="si-lives">❤️❤️❤️</strong></span>
    <span class="hi">Level: <strong id="si-level">1</strong></span>
  </div>
  <canvas id="si-canvas" width="594" height="500"></canvas>
  <div class="btn-row">
    <button class="btn" onclick="siInit()">↺ Restart</button>
    <button class="btn" id="si-pause-btn" onclick="siTogglePause()">⏸ Pause</button>
  </div>
  <div class="info">← → to move · Space to shoot · P to pause</div>
</div>

<!-- ===== TARGET SHOOTER ===== -->
<div class="ga" id="g2">
  <div class="hud">
    <span class="hi">Score: <strong id="ts-score">0</strong></span>
    <span class="hi">Hi-Score: <strong id="ts-hi">0</strong></span>
    <span class="hi">Time: <strong id="ts-time">60</strong>s</span>
    <span class="hi">Combo: <strong id="ts-combo">x1</strong></span>
  </div>
  <canvas id="ts-canvas" width="640" height="440"></canvas>
  <div class="btn-row">
    <button class="btn" onclick="tsInit()">↺ Restart</button>
    <button class="btn" id="ts-pause-btn" onclick="tsTogglePause()">⏸ Pause</button>
  </div>
  <div class="info">Click targets to shoot · Small = more points · 🟡 Bonus targets = 3× · Build combos for higher score!</div>
</div>

<script>
// =========================================
// AUDIO CONTEXT HELPER
// =========================================
let _ac;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}

function beep(freq, dur, type, vol) {
  try {
    const ac = getAC();
    const osc  = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime((vol || .15), ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + dur);
  } catch(e) { console.warn('AudioContext error:', e); }
}

function playShoot()   { beep(440, .05, 'square', .12); }
function playHit()     { beep(220, .08, 'sawtooth', .15); beep(110, .1, 'square', .1); }
function playExplode() { beep(120, .2,  'sawtooth', .2); beep(80, .15, 'square', .15); }
function playWin()     { [523,659,784,1047].forEach((f,i) => setTimeout(()=>beep(f,.12,'sine',.18), i*100)); }
function playLose()    { [330,262,196].forEach((f,i) => setTimeout(()=>beep(f,.2,'sawtooth',.18), i*150)); }
function playTS()      { beep(880, .04, 'sine', .1); }
function playCombo()   { beep(1200, .06, 'sine', .15); }

// =========================================
// GAME SWITCHER
// =========================================
function showGame(n) {
  [1,2].forEach(i => {
    document.getElementById('g'+i).classList.toggle('active', i===n);
    document.getElementById('mb'+i).classList.toggle('active', i===n);
  });
}

// =========================================
// SPACE INVADERS
// =========================================
(function() {
  const cv  = document.getElementById('si-canvas');
  const ctx = cv.getContext('2d');
  const W = 594, H = 500;

  const ROWS = 3, COLS = 11;
  const AW = 36, AH = 24, HGAP = 54, VGAP = 44;
  const GRID_W = (COLS-1)*HGAP + AW;
  const START_X = (W - GRID_W) / 2;
  const START_Y = 56;

  // 4 shields (bunkers)
  const SHIELD_XS  = [60, 180, 310, 435];
  const SHIELD_Y   = 370;
  const BLK_W = 10, BLK_H = 8;
  const SHIELD_COLS = 6, SHIELD_ROWS = 4;

  const PLAYER_W = 44, PLAYER_H = 14, PLAYER_Y = H - 38, PLAYER_SPD = 4;
  const BULLET_W = 3, BULLET_H = 14, BULLET_SPD = 9;
  const ABUL_W   = 3, ABUL_H   = 10, ABUL_SPD   = 4.5;

  let aliens, shields, player, bullets, aBullets;
  let score, lives, level, dir, dropQueued, aTimer, aSpeed, gs, paused;

  const hiScore = { v: parseInt(localStorage.getItem('siHi')||'0',10) };
  document.getElementById('si-hi').textContent = hiScore.v.toLocaleString();

  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); if (gs==='playing' && !paused) fireBullet(); }
    if (e.code === 'KeyP')  siTogglePause();
    if (e.code === 'KeyR' && gs !== 'playing') siInit();
  });
  document.addEventListener('keyup', e => keys[e.code] = false);

  function makeShields() {
    const s = [];
    SHIELD_XS.forEach(sx => {
      const blocks = [];
      for (let row = 0; row < SHIELD_ROWS; row++) {
        for (let col = 0; col < SHIELD_COLS; col++) {
          // Remove top corners for bunker shape
          if (row === 0 && (col === 0 || col === SHIELD_COLS-1)) continue;
          if (row === SHIELD_ROWS-1 && (col === 1 || col === 2 || col === 3 || col === 4)) continue;
          blocks.push({
            x: sx + col*BLK_W, y: SHIELD_Y + row*BLK_H,
            hp: 4, alive: true
          });
        }
      }
      s.push(blocks);
    });
    return s;
  }

  window.siInit = function() {
    score = 0; lives = 3; level = 1; dir = 1; dropQueued = false;
    aTimer = 0; aSpeed = 60; gs = 'playing'; paused = false;
    aliens = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        aliens.push({
          r, c,
          x: START_X + c*HGAP,
          y: START_Y + r*VGAP,
          alive: true,
          type: r === 0 ? 'boss' : r === 1 ? 'mid' : 'basic',
          frame: 0
        });
      }
    }
    shields  = makeShields();
    player   = { x: W/2 - PLAYER_W/2, inv: 0 };
    bullets  = [];
    aBullets = [];
    updateHUD();
    document.getElementById('si-pause-btn').textContent = '⏸ Pause';
  };

  window.siTogglePause = function() {
    if (gs !== 'playing') return;
    paused = !paused;
    document.getElementById('si-pause-btn').textContent = paused ? '▶ Resume' : '⏸ Pause';
  };

  function fireBullet() {
    if (bullets.length >= 3) return;
    bullets.push({ x: player.x + PLAYER_W/2 - BULLET_W/2, y: PLAYER_Y });
    playShoot();
  }

  function updateHUD() {
    document.getElementById('si-score').textContent = score.toLocaleString();
    document.getElementById('si-lives').textContent = '❤️'.repeat(Math.max(0, lives));
    document.getElementById('si-level').textContent = level;
    if (score > hiScore.v) {
      hiScore.v = score;
      localStorage.setItem('siHi', score);
      document.getElementById('si-hi').textContent = score.toLocaleString();
    }
  }

  function update() {
    if (gs !== 'playing' || paused) return;

    // Player movement
    if (keys['ArrowLeft']  || keys['KeyA']) player.x = Math.max(4, player.x - PLAYER_SPD);
    if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(W - PLAYER_W - 4, player.x + PLAYER_SPD);
    if (player.inv > 0) player.inv--;

    // Move player bullets
    bullets.forEach(b => b.y -= BULLET_SPD);
    bullets = bullets.filter(b => b.y > -20);

    // Move alien bullets
    const lvlSpd = ABUL_SPD + (level - 1) * .4;
    aBullets.forEach(b => b.y += lvlSpd);
    aBullets = aBullets.filter(b => b.y < H + 20);

    const alive = aliens.filter(a => a.alive);
    if (alive.length === 0) {
      // Level up
      level++;
      aSpeed = Math.max(10, 60 - level * 6);
      aliens.forEach(a => {
        a.alive = true;
        a.x = START_X + a.c*HGAP;
        a.y = START_Y + a.r*VGAP;
        a.frame = 0;
      });
      dir = 1; dropQueued = false; aTimer = 0;
      bullets = []; aBullets = [];
      updateHUD();
      playWin();
      return;
    }

    // Alien march tick
    const liveCount = alive.length;
    const tickRate  = Math.max(8, aSpeed * (liveCount / (ROWS * COLS)));
    aTimer++;
    if (aTimer >= tickRate) {
      aTimer = 0;
      alive.forEach(a => a.frame = 1 - a.frame);
      if (dropQueued) {
        aliens.forEach(a => { if (a.alive) a.y += 18; });
        dir *= -1; dropQueued = false;
      } else {
        aliens.forEach(a => { if (a.alive) a.x += dir * 10; });
        const xs = alive.map(a => a.x);
        if (Math.min(...xs) < 4 || Math.max(...xs) + AW > W - 4) dropQueued = true;
      }
      // Random alien shoots
      if (Math.random() < 0.28) {
        const shooter = alive[Math.floor(Math.random()*alive.length)];
        aBullets.push({ x: shooter.x + AW/2 - ABUL_W/2, y: shooter.y + AH });
      }
    }

    // Player bullets vs aliens
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      for (let ai = 0; ai < aliens.length; ai++) {
        const a = aliens[ai];
        if (!a.alive) continue;
        if (b.x < a.x+AW && b.x+BULLET_W > a.x && b.y < a.y+AH && b.y+BULLET_H > a.y) {
          a.alive = false;
          bullets.splice(bi, 1);
          const pts = a.type==='boss' ? 30 : a.type==='mid' ? 20 : 10;
          score += pts * level;
          playHit();
          updateHUD();
          break;
        }
      }
    }

    // Bullets vs shields
    const allBullets = [
      ...bullets.map(b  => ({x:b.x, y:b.y, w:BULLET_W, h:BULLET_H, src:'player'})),
      ...aBullets.map(b => ({x:b.x, y:b.y, w:ABUL_W,   h:ABUL_H,   src:'alien'}))
    ];
    allBullets.forEach(b => {
      shields.forEach(sg => sg.forEach(blk => {
        if (!blk.alive) return;
        if (b.x < blk.x+BLK_W && b.x+b.w > blk.x && b.y < blk.y+BLK_H && b.y+b.h > blk.y) {
          blk.hp--; if (blk.hp <= 0) blk.alive = false;
          // Remove the bullet from game arrays
          if (b.src === 'player') bullets  = bullets.filter(p  => !(p.x===b.x));
          else                    aBullets = aBullets.filter(p => !(p.x===b.x));
        }
      }));
    });

    // Alien bullets vs player
    if (player.inv <= 0) {
      for (let bi = aBullets.length - 1; bi >= 0; bi--) {
        const b = aBullets[bi];
        if (b.x < player.x+PLAYER_W && b.x+ABUL_W > player.x &&
            b.y < PLAYER_Y+PLAYER_H && b.y+ABUL_H > PLAYER_Y) {
          lives--;
          aBullets.splice(bi, 1);
          player.inv = 120;
          playLose();
          updateHUD();
          if (lives <= 0) gs = 'over';
          break;
        }
      }
    }

    // Aliens reach ground
    alive.forEach(a => { if (a.y + AH >= PLAYER_Y - 4) gs = 'over'; });
  }

  function drawAlien(a) {
    const x = a.x, y = a.y, f = a.frame;
    if (a.type === 'boss') {
      ctx.fillStyle = '#a78bfa';
      // Main body
      ctx.fillRect(x+4, y, AW-8, AH);
      ctx.fillRect(x, y+6, AW, AH-12);
      // Antennae
      if (f===0) {
        ctx.fillRect(x+2,  y-6, 4, 8);
        ctx.fillRect(x+AW-6, y-6, 4, 8);
      } else {
        ctx.fillRect(x+6,  y-4, 4, 6);
        ctx.fillRect(x+AW-10, y-4, 4, 6);
      }
      // Eyes
      ctx.fillStyle = '#0d0522';
      ctx.fillRect(x+8, y+6, 5, 5);
      ctx.fillRect(x+AW-13, y+6, 5, 5);
      // Mouth
      ctx.fillRect(x+8, y+15, 4, 3);
      ctx.fillRect(x+14, y+15, 4, 3);
      ctx.fillRect(x+20, y+15, 4, 3);
    } else if (a.type === 'mid') {
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(x+6, y, AW-12, AH);
      ctx.fillRect(x, y+7, AW, AH-14);
      // Arms
      if (f===0) {
        ctx.fillRect(x-5, y+4, 7, 9);
        ctx.fillRect(x+AW-2, y+4, 7, 9);
      } else {
        ctx.fillRect(x-3, y+10, 5, 8);
        ctx.fillRect(x+AW-2, y+10, 5, 8);
      }
      ctx.fillStyle = '#0a1a0a';
      ctx.fillRect(x+8, y+6, 5, 5);
      ctx.fillRect(x+AW-13, y+6, 5, 5);
    } else {
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x+4, y, AW-8, AH);
      ctx.fillRect(x, y+8, AW, AH-14);
      if (f===0) {
        ctx.fillRect(x-4, y+AH-8, 6, 6);
        ctx.fillRect(x+AW-2, y+AH-8, 6, 6);
      } else {
        ctx.fillRect(x-6, y+AH-12, 6, 6);
        ctx.fillRect(x+AW, y+AH-12, 6, 6);
      }
      ctx.fillStyle = '#1a0a00';
      ctx.fillRect(x+8, y+8, 5, 5);
      ctx.fillRect(x+AW-13, y+8, 5, 5);
    }
  }

  function draw() {
    ctx.fillStyle = '#010208';
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 60; i++) {
      const sx = ((i*137+19) % W), sy = ((i*79+11) % H);
      ctx.fillRect(sx, sy, i%5===0?2:1, i%5===0?2:1);
    }

    // Shields
    shields.forEach(sg => sg.forEach(blk => {
      if (!blk.alive) return;
      const t = blk.hp / 4;
      ctx.fillStyle = `rgba(245,158,11,${.25 + t*.75})`;
      ctx.fillRect(blk.x, blk.y, BLK_W, BLK_H);
    }));

    // Aliens
    aliens.filter(a => a.alive).forEach(drawAlien);

    // Player ship
    if (player.inv <= 0 || Math.floor(player.inv/6) % 2 === 0) {
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(player.x, PLAYER_Y, PLAYER_W, PLAYER_H);
      ctx.fillRect(player.x + PLAYER_W/2 - 4, PLAYER_Y - 12, 8, 14);
      ctx.fillRect(player.x - 6, PLAYER_Y + 6, 8, 8);
      ctx.fillRect(player.x + PLAYER_W - 2, PLAYER_Y + 6, 8, 8);
    }

    // Player bullets
    ctx.fillStyle = '#fbbf24';
    bullets.forEach(b => {
      ctx.fillRect(b.x, b.y, BULLET_W, BULLET_H);
      ctx.fillStyle = 'rgba(251,191,36,.4)';
      ctx.fillRect(b.x - 1, b.y, BULLET_W + 2, BULLET_H + 4);
      ctx.fillStyle = '#fbbf24';
    });

    // Alien bullets
    ctx.fillStyle = '#ef4444';
    aBullets.forEach(b => {
      ctx.fillRect(b.x, b.y, ABUL_W, ABUL_H);
      ctx.fillStyle = 'rgba(239,68,68,.4)';
      ctx.fillRect(b.x-1, b.y, ABUL_W+2, ABUL_H+4);
      ctx.fillStyle = '#ef4444';
    });

    // Ground line
    ctx.fillStyle = 'rgba(245,158,11,.55)';
    ctx.fillRect(0, H-4, W, 4);

    // Pause overlay
    if (paused && gs === 'playing') {
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 40px Inter,sans-serif';
      ctx.fillText('PAUSED', W/2, H/2 - 16);
      ctx.fillStyle = 'rgba(254,243,199,.5)';
      ctx.font = '15px Inter,sans-serif';
      ctx.fillText('Press P or click Resume to continue', W/2, H/2 + 20);
    }

    // Game over
    if (gs === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,.78)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 44px Inter,sans-serif';
      ctx.fillText('GAME OVER', W/2, H/2 - 56);
      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 22px Inter,sans-serif';
      ctx.fillText('Score: ' + score.toLocaleString(), W/2, H/2 - 10);
      ctx.fillText('Level: ' + level, W/2, H/2 + 24);
      if (score >= hiScore.v) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px Inter,sans-serif';
        ctx.fillText('🏆 New High Score!', W/2, H/2 + 58);
      }
      ctx.fillStyle = 'rgba(254,243,199,.45)';
      ctx.font = '14px Inter,sans-serif';
      ctx.fillText('Press R or click Restart', W/2, H/2 + 88);
    }
  }

  siInit();
  (function loop() { update(); draw(); requestAnimationFrame(loop); })();
})();

// =========================================
// TARGET SHOOTER
// =========================================
(function() {
  const cv  = document.getElementById('ts-canvas');
  const ctx = cv.getContext('2d');
  const W = 640, H = 440;

  // Target types: { radius, points, color, label }
  const TARGET_TYPES = [
    { r: 38, pts: 10,  color: '#ef4444', ring: '#fca5a5', label: '10' },
    { r: 26, pts: 25,  color: '#f59e0b', ring: '#fbbf24', label: '25' },
    { r: 16, pts: 60,  color: '#3b82f6', ring: '#93c5fd', label: '60' },
    { r: 10, pts: 120, color: '#8b5cf6', ring: '#c4b5fd', label: '120' },
    { r: 30, pts: 50,  color: '#d97706', ring: '#fcd34d', label: '50×3', bonus: true }
  ];

  const GAME_TIME   = 60;
  const COMBO_DECAY = 1200;  // ms to reset combo

  let targets, particles, floatTexts;
  let score, timeLeft, combo, lastHitTime, gs, paused;
  let spawnTimer, gameInterval, spawnInterval;

  const hiScore = { v: parseInt(localStorage.getItem('tsHi')||'0',10) };
  document.getElementById('ts-hi').textContent = hiScore.v.toLocaleString();

  function randBetween(a, b) { return a + Math.random() * (b - a); }

  function spawnTarget() {
    if (gs !== 'playing' || paused) return;
    const type = Math.random() < .12
      ? TARGET_TYPES[4]  // bonus target
      : TARGET_TYPES[Math.floor(Math.random() * 4)];

    const pad = type.r + 20;
    const t = {
      id:    Math.random(),
      x:     randBetween(pad, W - pad),
      y:     randBetween(pad + 40, H - pad),
      r:     type.r,
      pts:   type.pts,
      color: type.color,
      ring:  type.ring,
      bonus: !!type.bonus,
      label: type.label,
      life:  1.0,        // 0..1, fades out
      maxLife: type.bonus ? 2.5 : 3.5 + Math.random(),  // seconds
      elapsed: 0,
      scale:  0.1,       // grow in
      pulse:  0
    };
    targets.push(t);
  }

  function addParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        r:  2 + Math.random() * 4,
        color,
        life: 1.0,
        decay: .02 + Math.random() * .015
      });
    }
  }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, vy: -1.2, text, color, life: 1.0 });
  }

  window.tsInit = function() {
    targets    = [];
    particles  = [];
    floatTexts = [];
    score      = 0;
    timeLeft   = GAME_TIME;
    combo      = 1;
    lastHitTime = 0;
    gs         = 'playing';
    paused     = false;

    clearInterval(gameInterval);
    clearInterval(spawnInterval);

    document.getElementById('ts-score').textContent  = 0;
    document.getElementById('ts-time').textContent   = GAME_TIME;
    document.getElementById('ts-combo').textContent  = 'x1';
    document.getElementById('ts-pause-btn').textContent = '⏸ Pause';

    // Countdown timer
    gameInterval = setInterval(() => {
      if (paused || gs !== 'playing') return;
      timeLeft--;
      document.getElementById('ts-time').textContent = timeLeft;
      if (timeLeft <= 0) {
        gs = 'over';
        clearInterval(gameInterval);
        clearInterval(spawnInterval);
        if (score > hiScore.v) {
          hiScore.v = score;
          localStorage.setItem('tsHi', score);
          document.getElementById('ts-hi').textContent = score.toLocaleString();
        }
        playWin();
      }
    }, 1000);

    // Spawn timer: starts fast, targets spawn 0.8–1.8s apart
    function scheduleSpawn() {
      if (gs !== 'playing') return;
      const delay = 800 + Math.random() * 1000;
      spawnTimer = setTimeout(() => {
        if (!paused && gs === 'playing') spawnTarget();
        scheduleSpawn();
      }, delay);
    }
    scheduleSpawn();

    // Spawn some initial targets
    for (let i = 0; i < 3; i++) spawnTarget();
  };

  window.tsTogglePause = function() {
    if (gs !== 'playing') return;
    paused = !paused;
    document.getElementById('ts-pause-btn').textContent = paused ? '▶ Resume' : '⏸ Pause';
  };

  cv.addEventListener('click', e => {
    if (gs !== 'playing' || paused) { if (gs === 'over') tsInit(); return; }
    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top)  * (H / rect.height);
    handleShot(mx, my);
  });

  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    if (gs !== 'playing' || paused) return;
    const rect  = cv.getBoundingClientRect();
    const touch = e.touches[0];
    const mx = (touch.clientX - rect.left) * (W / rect.width);
    const my = (touch.clientY - rect.top)  * (H / rect.height);
    handleShot(mx, my);
  }, { passive: false });

  function handleShot(mx, my) {
    const now = Date.now();
    let hit = false;

    // Check targets in reverse order (top-most first)
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const dx = mx - t.x, dy = my - t.y;
      if (dx*dx + dy*dy <= t.r * t.r) {
        // Hit!
        const timeSinceLast = now - lastHitTime;
        if (timeSinceLast < COMBO_DECAY) {
          combo = Math.min(combo + 1, 8);
        } else {
          combo = 1;
        }
        lastHitTime = now;

        const basePoints = t.pts * (t.bonus ? 3 : 1);
        const earned     = basePoints * combo;
        score += earned;

        document.getElementById('ts-score').textContent = score.toLocaleString();
        document.getElementById('ts-combo').textContent = 'x' + combo;

        if (score > hiScore.v) {
          hiScore.v = score;
          localStorage.setItem('tsHi', score);
          document.getElementById('ts-hi').textContent = score.toLocaleString();
        }

        // Particles
        const pCol = t.bonus ? '#fbbf24' : t.color;
        addParticles(t.x, t.y, pCol, t.bonus ? 22 : 14);

        // Float text
        const txtCol = combo >= 4 ? '#fbbf24' : combo >= 2 ? '#4ade80' : '#fff';
        addFloatText(t.x, t.y - t.r, (combo > 1 ? 'x'+combo+' ' : '') + '+'+earned, txtCol);

        // Sound
        if (t.bonus) playCombo();
        else if (combo >= 3) playCombo();
        else playTS();

        targets.splice(i, 1);
        hit = true;
        break;
      }
    }

    if (!hit) {
      // Miss — reset combo
      combo = 1;
      document.getElementById('ts-combo').textContent = 'x1';
      // Miss flash particle
      addParticles(mx, my, '#ffffff', 3);
      beep(200, .06, 'square', .06);
    }
  }

  function update(dt) {
    if (gs !== 'playing' || paused) return;

    // Check combo decay
    if (Date.now() - lastHitTime > COMBO_DECAY && combo > 1) {
      combo = 1;
      document.getElementById('ts-combo').textContent = 'x1';
    }

    // Update targets
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      t.elapsed += dt;
      t.scale    = Math.min(1, t.scale + dt * 6);   // grow in over ~0.17s
      t.pulse    = (t.pulse + dt * 3) % (Math.PI*2);
      t.life     = Math.max(0, 1 - (t.elapsed / t.maxLife));
      if (t.life <= 0) targets.splice(i, 1);
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= .90; p.vy *= .90;
      p.r  *= .95;
      p.life -= p.decay;
      if (p.life <= 0 || p.r < .3) particles.splice(i, 1);
    }

    // Update float texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y    += f.vy;
      f.life -= .018;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }
  }

  function drawCrosshair(x, y) {
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x-12,y); ctx.lineTo(x+12,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-12); ctx.lineTo(x,y+12); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.stroke();
  }

  function drawTarget(t) {
    const sx = t.x, sy = t.y;
    const sc = t.scale;
    const r  = t.r * sc;
    const alpha = Math.min(1, t.life * 2.5);   // fade out in last 40%

    ctx.save();
    ctx.globalAlpha = alpha;

    // Outer glow
    if (t.bonus) {
      const grad = ctx.createRadialGradient(sx,sy,r*.3,sx,sy,r*1.6);
      grad.addColorStop(0, 'rgba(251,191,36,.22)');
      grad.addColorStop(1, 'rgba(251,191,36,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(sx,sy,r*1.6,0,Math.PI*2); ctx.fill();
    }

    // Rings (bullseye)
    const rings = [1, .65, .38];
    const cols  = t.bonus
      ? ['#d97706','#fbbf24','#fef9c3']
      : [t.color, t.ring, '#fff'];
    rings.forEach((rf, ri) => {
      ctx.beginPath();
      ctx.arc(sx, sy, r*rf, 0, Math.PI*2);
      ctx.fillStyle = cols[ri];
      ctx.fill();
    });

    // Border
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Pulse ring when about to expire
    if (t.life < .35) {
      ctx.beginPath();
      ctx.arc(sx, sy, r + Math.sin(t.pulse)*4 + 4, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(239,68,68,${t.life * 2.5})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Label
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(9, r*.55)|0}px Inter,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.label, sx, sy);

    if (t.bonus) {
      ctx.fillStyle = '#fbbf24';
      ctx.font = `bold ${Math.max(8, r*.38)|0}px Inter,sans-serif`;
      ctx.fillText('BONUS', sx, sy + r*.5);
    }

    ctx.restore();
  }

  let prevTime = performance.now();
  function draw(now) {
    const dt = Math.min(.05, (now - prevTime) / 1000);
    prevTime = now;
    update(dt);

    // Background
    ctx.fillStyle = '#050a14';
    ctx.fillRect(0,0,W,H);

    // Grid
    ctx.strokeStyle = 'rgba(245,158,11,.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Particles
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle   = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // Targets
    targets.forEach(drawTarget);

    // Float texts
    floatTexts.forEach(f => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle   = f.color;
      ctx.font        = 'bold 18px Inter,sans-serif';
      ctx.textAlign   = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor  = 'rgba(0,0,0,.8)';
      ctx.shadowBlur   = 6;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    // Timer bar
    const barW = W * (timeLeft / GAME_TIME);
    const barCol = timeLeft > 20 ? '#22c55e' : timeLeft > 10 ? '#f59e0b' : '#ef4444';
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fillRect(0, H-5, W, 5);
    ctx.fillStyle = barCol;
    ctx.fillRect(0, H-5, barW, 5);

    // Pause overlay
    if (paused && gs === 'playing') {
      ctx.fillStyle = 'rgba(0,0,0,.62)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 42px Inter,sans-serif';
      ctx.fillText('PAUSED', W/2, H/2 - 16);
      ctx.fillStyle = 'rgba(254,243,199,.45)';
      ctx.font = '15px Inter,sans-serif';
      ctx.fillText('Click Pause button or press P to resume', W/2, H/2 + 22);
    }

    // Game over
    if (gs === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,.78)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 44px Inter,sans-serif';
      ctx.fillText('TIME\'S UP!', W/2, H/2 - 68);
      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 26px Inter,sans-serif';
      ctx.fillText('Final Score: ' + score.toLocaleString(), W/2, H/2 - 18);
      ctx.font = '18px Inter,sans-serif';
      ctx.fillText('High Score: ' + hiScore.v.toLocaleString(), W/2, H/2 + 18);
      if (score >= hiScore.v) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px Inter,sans-serif';
        ctx.fillText('🏆 New High Score!', W/2, H/2 + 52);
      }
      ctx.fillStyle = 'rgba(254,243,199,.45)';
      ctx.font = '14px Inter,sans-serif';
      ctx.fillText('Click canvas or Restart to play again', W/2, H/2 + 84);
    }

    requestAnimationFrame(draw);
  }

  tsInit();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
