<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DebateArena – Argue What Matters</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{--bg:#080f1a;--accent:#6366f1;--accent2:#4f46e5;--border:rgba(99,102,241,0.2);--text:#e0e7ff;--card:rgba(99,102,241,0.07);--danger:#ef4444;--success:#22c55e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  button{cursor:pointer;border:none;outline:none;font-family:inherit}
  input,textarea,select{font-family:inherit;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:3px}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .badge-Politics{background:rgba(239,68,68,.18);color:#fca5a5}
  .badge-Science{background:rgba(34,197,94,.18);color:#86efac}
  .badge-Society{background:rgba(251,191,36,.18);color:#fde68a}
  .badge-Tech{background:rgba(99,102,241,.25);color:#a5b4fc}
  .badge-Sport{background:rgba(249,115,22,.18);color:#fdba74}
  .badge-Random{background:rgba(168,85,247,.18);color:#d8b4fe}
  .btn{padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;transition:all .2s}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;transition:all .25s}
  .card:hover{border-color:rgba(99,102,241,.5);box-shadow:0 4px 24px rgba(99,102,241,.12)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#0d1629;border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
  .tab-bar{display:flex;gap:4px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:4px}
  .tab{padding:8px 20px;border-radius:7px;font-size:14px;font-weight:600;transition:all .2s;color:rgba(224,231,255,.6)}
  .tab.active{background:var(--accent);color:#fff}
  .tab:hover:not(.active){color:var(--text)}
  .vote-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin:6px 0}
  .vote-bar-fill-for{background:var(--success);height:100%;border-radius:3px;transition:width .4s}
  .vote-bar-fill-against{background:var(--danger);height:100%;border-radius:3px;transition:width .4s}
  .arg-col{flex:1;min-width:0}
  .arg-col-header{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding:6px 12px;border-radius:6px;text-align:center}
  .arg-col-for .arg-col-header{background:rgba(34,197,94,.12);color:var(--success)}
  .arg-col-against .arg-col-header{background:rgba(239,68,68,.12);color:var(--danger)}
  .vote-btn{padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700;transition:all .15s}
  .vote-up{background:rgba(34,197,94,.12);color:var(--success)}.vote-up:hover,.vote-up.active{background:var(--success);color:#fff}
  .vote-down{background:rgba(239,68,68,.12);color:var(--danger)}.vote-down:hover,.vote-down.active{background:var(--danger);color:#fff}
  .comment-item{padding:12px 0;border-bottom:1px solid var(--border)}
  .comment-item:last-child{border-bottom:none}
  .search-bar{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 16px;width:100%;font-size:14px;color:var(--text)}
  .search-bar::placeholder{color:rgba(224,231,255,.35)}
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select option{background:#0d1629}
  .timer{font-size:12px;color:rgba(224,231,255,.5)}
  .timer.urgent{color:#f97316}
  .rules-panel{background:rgba(99,102,241,.06);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px}
  .rules-panel h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .rules-panel ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .rules-panel li{font-size:13px;color:rgba(224,231,255,.7);padding-left:16px;position:relative}
  .rules-panel li::before{content:'•';position:absolute;left:0;color:var(--accent)}
  .progress-overall{height:10px;border-radius:5px;background:rgba(239,68,68,.25);overflow:hidden;margin:8px 0}
  .progress-overall-fill{height:100%;border-radius:5px;background:var(--success);transition:width .5s}
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(8,15,26,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
  .container{max-width:1100px;margin:0 auto;padding:24px 20px}
  .debates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-top:20px}
  .leaderboard-row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px}
  .rank-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
  .rank-1{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
  .rank-2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
  .rank-3{background:linear-gradient(135deg,#cd7c3c,#a35f2b);color:#fff}
  .rank-other{background:rgba(99,102,241,.2);color:var(--accent)}
  @media(max-width:700px){.args-cols{flex-direction:column!important}}
</style>
</head>

function getDebates() {
  const stored = localStorage.getItem('debates_v3');
  if (stored) return JSON.parse(stored);
  localStorage.setItem('debates_v3', JSON.stringify(INITIAL_DEBATES));
  return INITIAL_DEBATES;
}
function saveDebates(d) { localStorage.setItem('debates_v3', JSON.stringify(d)); }
function getVotes() {
  const s = localStorage.getItem('debate_votes_v3');
  return s ? JSON.parse(s) : {};
}
function saveVotes(v) { localStorage.setItem('debate_votes_v3', JSON.stringify(v)); }
function getAlias() {
  let a = localStorage.getItem('debate_alias');
  if (!a) { a = genAlias(); localStorage.setItem('debate_alias', a); }
  return a;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}
function timeLeft(createdAt) {
  const expires = createdAt + 48*3600000;
  const remaining = expires - Date.now();
  if (remaining <= 0) return { text: 'Expired', urgent: true };
  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  if (h < 3) return { text: `${h}h ${m}m left`, urgent: true };
  return { text: `${h}h ${m}m left`, urgent: false };
}

function RulesPanel() {
  const [open, setOpen] = useState(false);
  return (
    <div className="rules-panel">
      <h3 onClick={() => setOpen(o => !o)}>
        📋 Debate Rules {open ? '▲' : '▼'}
      </h3>
      {open && (
        <ul>
          <li>Arguments must be relevant to the motion.</li>
          <li>Maximum 400 characters per argument.</li>
          <li>Be respectful — attack ideas, not people.</li>
          <li>Vote based on argument quality, not personal opinion.</li>
          <li>No spam or duplicate arguments.</li>
          <li>Debates expire after 48 hours.</li>
          <li>Your alias is randomly assigned and stored locally.</li>
        </ul>
      )}
    </div>
  );
}

function ArgumentCard({ arg, side, onVote, voteState }) {
  const net = arg.votes;
  const userVote = voteState[arg.id];
  return (
    <div className="card" style={{ marginBottom: 10 }}>
      <p style={{ fontSize: 14, lineHeight: 1.6, marginBottom: 10 }}>{arg.text}</p>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
        <span style={{ fontSize: 12, color: 'rgba(224,231,255,.45)' }}>~{arg.author} · {timeAgo(arg.createdAt)}</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <button
            className={`vote-btn vote-up${userVote === 1 ? ' active' : ''}`}
            onClick={() => onVote(arg.id, 1, side)}
          >▲</button>
          <span style={{ fontSize: 13, fontWeight: 700, minWidth: 28, textAlign: 'center', color: net >= 0 ? 'var(--success)' : 'var(--danger)' }}>
            {net >= 0 ? '+' : ''}{net}
          </span>
          <button
            className={`vote-btn vote-down${userVote === -1 ? ' active' : ''}`}
            onClick={() => onVote(arg.id, -1, side)}
          >▼</button>
        </div>
      </div>
    </div>
  );
}

function DebateDetail({ debate, onBack, debates, setDebates }) {
  const [newArgFor, setNewArgFor] = useState('');
  const [newArgAgainst, setNewArgAgainst] = useState('');
  const [newComment, setNewComment] = useState('');
  const [votes, setVotes] = useState(getVotes());
  const alias = getAlias();
  const tl = timeLeft(debate.createdAt);

  const d = useMemo(() => debates.find(x => x.id === debate.id) || debate, [debates, debate.id]);

  const totalForVotes = useMemo(() => d.args.for.reduce((s, a) => s + Math.max(0, a.votes), 0), [d]);
  const totalAgainstVotes = useMemo(() => d.args.against.reduce((s, a) => s + Math.max(0, a.votes), 0), [d]);
  const total = totalForVotes + totalAgainstVotes || 1;
  const forPct = Math.round((totalForVotes / total) * 100);

  const handleVote = useCallback((argId, dir, side) => {
    const key = argId;
    const current = votes[key];
    let delta = 0;
    let newDir = null;
    if (current === dir) { delta = -dir; newDir = null; }
    else if (current) { delta = dir * 2; newDir = dir; }
    else { delta = dir; newDir = dir; }

    const newVotes = { ...votes, [key]: newDir };
    if (newDir === null) delete newVotes[key];
    setVotes(newVotes);
    saveVotes(newVotes);

    setDebates(prev => {
      const updated = prev.map(deb => {
        if (deb.id !== d.id) return deb;
        return {
          ...deb,
          args: {
            ...deb.args,
            [side]: deb.args[side].map(a => a.id === argId ? { ...a, votes: a.votes + delta } : a)
          }
        };
      });
      saveDebates(updated);
      return updated;
    });
  }, [votes, d.id, setDebates]);

  const addArgument = useCallback((side) => {
    const text = side === 'for' ? newArgFor.trim() : newArgAgainst.trim();
    if (!text || text.length > 400) return;
    const newArg = { id: 'arg_' + Date.now(), text, author: alias, votes: 0, createdAt: Date.now() };
    setDebates(prev => {
      const updated = prev.map(deb => {
        if (deb.id !== d.id) return deb;
        return { ...deb, args: { ...deb.args, [side]: [...deb.args[side], newArg] } };
      });
      saveDebates(updated);
      return updated;
    });
    if (side === 'for') setNewArgFor(''); else setNewArgAgainst('');
  }, [newArgFor, newArgAgainst, alias, d.id, setDebates]);

  const addComment = useCallback(() => {
    const text = newComment.trim();
    if (!text) return;
    const c = { id: 'c_' + Date.now(), text, author: alias, createdAt: Date.now() };
    setDebates(prev => {
      const updated = prev.map(deb => {
        if (deb.id !== d.id) return deb;
        return { ...deb, comments: [...deb.comments, c] };
      });
      saveDebates(updated);
      return updated;
    });
    setNewComment('');
  }, [newComment, alias, d.id, setDebates]);

  const sortedFor = useMemo(() => [...d.args.for].sort((a, b) => b.votes - a.votes), [d]);
  const sortedAgainst = useMemo(() => [...d.args.against].sort((a, b) => b.votes - a.votes), [d]);

  return (
    <div className="container">
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn btn-ghost" onClick={onBack}>← Back</button>
        <span className={`badge badge-${d.category}`}>{d.category}</span>
        <span className={`timer${tl.urgent ? ' urgent' : ''}`}>{tl.text}</span>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8, lineHeight: 1.4 }}>"{d.motion}"</h2>
        <p style={{ fontSize: 12, color: 'rgba(224,231,255,.45)', marginBottom: 14 }}>
          Started by ~{d.createdBy} · {timeAgo(d.createdAt)} · {d.args.for.length + d.args.against.length} arguments · {d.comments.length} comments
        </p>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 700, marginBottom: 4 }}>
          <span style={{ color: 'var(--success)' }}>FOR {forPct}%</span>
          <span style={{ color: 'var(--danger)' }}>AGAINST {100 - forPct}%</span>
        </div>
        <div className="progress-overall">
          <div className="progress-overall-fill" style={{ width: forPct + '%' }} />
        </div>
        <p style={{ fontSize: 12, color: 'rgba(224,231,255,.4)' }}>Based on argument votes</p>
      </div>

      <div className="args-cols" style={{ display: 'flex', gap: 18, marginBottom: 28 }}>
        <div className="arg-col arg-col-for">
          <div className="arg-col-header">✅ For</div>
          {sortedFor.map(a => (
            <ArgumentCard key={a.id} arg={a} side="for" onVote={handleVote} voteState={votes} />
          ))}
          <div style={{ marginTop: 10 }}>
            <textarea
              value={newArgFor}
              onChange={e => setNewArgFor(e.target.value)}
              placeholder="Add an argument FOR… (max 400 chars)"
              rows={3}
              style={{ width: '100%', resize: 'vertical', marginBottom: 6, fontSize: 13 }}
              maxLength={400}
            />
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11, color: 'rgba(224,231,255,.4)' }}>{newArgFor.length}/400</span>
              <button className="btn btn-primary" style={{ padding: '6px 14px', fontSize: 13, background: 'var(--success)', color:'#fff' }} onClick={() => addArgument('for')}>Add</button>
            </div>
          </div>
        </div>
        <div className="arg-col arg-col-against">
          <div className="arg-col-header">❌ Against</div>
          {sortedAgainst.map(a => (
            <ArgumentCard key={a.id} arg={a} side="against" onVote={handleVote} voteState={votes} />
          ))}
          <div style={{ marginTop: 10 }}>
            <textarea
              value={newArgAgainst}
              onChange={e => setNewArgAgainst(e.target.value)}
              placeholder="Add an argument AGAINST… (max 400 chars)"
              rows={3}
              style={{ width: '100%', resize: 'vertical', marginBottom: 6, fontSize: 13 }}
              maxLength={400}
            />
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11, color: 'rgba(224,231,255,.4)' }}>{newArgAgainst.length}/400</span>
              <button className="btn btn-primary" style={{ padding: '6px 14px', fontSize: 13, background: 'var(--danger)', color:'#fff' }} onClick={() => addArgument('against')}>Add</button>
            </div>
          </div>
        </div>
      </div>

      <div className="card" style={{ marginTop: 10 }}>
        <h3 style={{ marginBottom: 14, fontSize: 16, fontWeight: 700 }}>💬 Comments ({d.comments.length})</h3>
        {d.comments.length === 0 && <p style={{ color: 'rgba(224,231,255,.4)', fontSize: 14 }}>No comments yet. Be first!</p>}
        {d.comments.map(c => (
          <div key={c.id} className="comment-item">
            <div style={{ display: 'flex', gap: 8, marginBottom: 4, alignItems: 'center' }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--accent)' }}>~{c.author}</span>
              <span style={{ fontSize: 11, color: 'rgba(224,231,255,.4)' }}>{timeAgo(c.createdAt)}</span>
            </div>
            <p style={{ fontSize: 14, lineHeight: 1.5 }}>{c.text}</p>
          </div>
        ))}
        <div style={{ marginTop: 14, display: 'flex', gap: 8 }}>
          <input
            value={newComment}
            onChange={e => setNewComment(e.target.value)}
            placeholder="Add a comment…"
            style={{ flex: 1 }}
            onKeyDown={e => e.key === 'Enter' && addComment()}
          />
          <button className="btn btn-primary" onClick={addComment}>Post</button>
        </div>
      </div>
    </div>
  );
}

function DebateCard({ debate, onClick }) {
  const tl = timeLeft(debate.createdAt);
  const totalFor = debate.args.for.reduce((s, a) => s + Math.max(0, a.votes), 0);
  const totalAgainst = debate.args.against.reduce((s, a) => s + Math.max(0, a.votes), 0);
  const total = totalFor + totalAgainst || 1;
  const forPct = Math.round((totalFor / total) * 100);
  return (
    <div className="card" onClick={onClick} style={{ cursor: 'pointer' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
        <span className={`badge badge-${debate.category}`}>{debate.category}</span>
        <span className={`timer${tl.urgent ? ' urgent' : ''}`}>{tl.text}</span>
      </div>
      <h3 style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.5, marginBottom: 10 }}>"{debate.motion}"</h3>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 4, color: 'rgba(224,231,255,.6)' }}>
        <span style={{ color: 'var(--success)', fontWeight: 600 }}>FOR {forPct}%</span>
        <span style={{ color: 'var(--danger)', fontWeight: 600 }}>AGN {100 - forPct}%</span>
      </div>
      <div className="vote-bar">
        <div className="vote-bar-fill-for" style={{ width: forPct + '%' }} />
      </div>
      <div style={{ display: 'flex', gap: 14, fontSize: 12, color: 'rgba(224,231,255,.45)', marginTop: 8 }}>
        <span>🗣 {debate.args.for.length + debate.args.against.length} args</span>
        <span>💬 {debate.comments.length}</span>
        <span>👤 ~{debate.createdBy}</span>
      </div>
    </div>
  );
}

function CreateDebateModal({ onClose, onCreate, alias }) {
  const [motion, setMotion] = useState('');
  const [category, setCategory] = useState('Society');
  const [openingArg, setOpeningArg] = useState('');
  const [openingSide, setOpeningSide] = useState('for');

  const handleSubmit = () => {
    if (!motion.trim()) return;
    const args = { for: [], against: [] };
    if (openingArg.trim()) {
      const a = { id: 'arg_' + Date.now(), text: openingArg.trim(), author: alias, votes: 0, createdAt: Date.now() };
      args[openingSide].push(a);
    }
    onCreate({ motion: motion.trim(), category, args, comments: [], createdBy: alias, createdAt: Date.now(), id: 'd_' + Date.now() });
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2 style={{ marginBottom: 18, fontSize: 20, fontWeight: 700 }}>⚡ Start a Debate</h2>
        <div style={{ marginBottom: 14 }}>
          <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 6 }}>Motion / Topic *</label>
          <textarea
            value={motion}
            onChange={e => setMotion(e.target.value)}
            placeholder="State the debate motion clearly, e.g. 'Nuclear power should be expanded globally'"
            rows={3}
            style={{ width: '100%', resize: 'vertical' }}
            maxLength={200}
          />
          <span style={{ fontSize: 11, color: 'rgba(224,231,255,.4)' }}>{motion.length}/200</span>
        </div>
        <div style={{ marginBottom: 14 }}>
          <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 6 }}>Category</label>
          <select value={category} onChange={e => setCategory(e.target.value)} style={{ width: '100%' }}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div style={{ marginBottom: 14 }}>
          <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 6 }}>Opening Argument (optional, max 400 chars)</label>
          <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <button className={`btn ${openingSide === 'for' ? 'btn-primary' : 'btn-ghost'}`} style={{ flex: 1, fontSize: 13 }} onClick={() => setOpeningSide('for')}>✅ For</button>
            <button className={`btn ${openingSide === 'against' ? 'btn-danger' : 'btn-ghost'}`} style={{ flex: 1, fontSize: 13 }} onClick={() => setOpeningSide('against')}>❌ Against</button>
          </div>
          <textarea
            value={openingArg}
            onChange={e => setOpeningArg(e.target.value)}
            placeholder={`Your opening argument ${openingSide === 'for' ? 'FOR' : 'AGAINST'} the motion…`}
            rows={3}
            style={{ width: '100%', resize: 'vertical' }}
            maxLength={400}
          />
        </div>
        <p style={{ fontSize: 12, color: 'rgba(224,231,255,.4)', marginBottom: 16 }}>Debating as: <strong style={{ color: 'var(--accent)' }}>~{alias}</strong></p>
        <div style={{ display: 'flex', gap: 10 }}>
          <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={handleSubmit} disabled={!motion.trim()}>Launch Debate</button>
        </div>
      </div>
    </div>
  );
}

function DebateFeed({ debates, onSelectDebate, onCreateDebate, alias }) {
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('All');
  const [sortBy, setSortBy] = useState('newest');
  const [showCreate, setShowCreate] = useState(false);

  const filtered = useMemo(() => {
    let list = [...debates];
    if (filterCat !== 'All') list = list.filter(d => d.category === filterCat);
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter(d => d.motion.toLowerCase().includes(q) || d.category.toLowerCase().includes(q));
    }
    if (sortBy === 'newest') list.sort((a, b) => b.createdAt - a.createdAt);
    else if (sortBy === 'most_votes') {
      list.sort((a, b) => {
        const votesA = [...a.args.for, ...a.args.against].reduce((s, x) => s + x.votes, 0);
        const votesB = [...b.args.for, ...b.args.against].reduce((s, x) => s + x.votes, 0);
        return votesB - votesA;
      });
    } else if (sortBy === 'ending_soon') {
      list.sort((a, b) => {
        const remA = (a.createdAt + 48*3600000) - Date.now();
        const remB = (b.createdAt + 48*3600000) - Date.now();
        return remA - remB;
      });
    }
    return list;
  }, [debates, filterCat, search, sortBy]);

  return (
    <div>
      <RulesPanel />
      <div className="filter-row" style={{ marginBottom: 16 }}>
        <input
          className="search-bar"
          style={{ flex: 1, minWidth: 180 }}
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="🔍 Search debates…"
        />
        <select value={filterCat} onChange={e => setFilterCat(e.target.value)} style={{ minWidth: 120 }}>
          <option value="All">All Categories</option>
          {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ minWidth: 140 }}>
          <option value="newest">Newest</option>
          <option value="most_votes">Most Votes</option>
          <option value="ending_soon">Ending Soon</option>
        </select>
        <button className="btn btn-primary" onClick={() => setShowCreate(true)}>+ New Debate</button>
      </div>
      {filtered.length === 0 && (
        <div style={{ textAlign: 'center', padding: 48, color: 'rgba(224,231,255,.4)' }}>
          No debates found. Start one!
        </div>
      )}
      <div className="debates-grid">
        {filtered.map(d => (
          <DebateCard key={d.id} debate={d} onClick={() => onSelectDebate(d)} />
        ))}
      </div>
      {showCreate && (
        <CreateDebateModal
          alias={alias}
          onClose={() => setShowCreate(false)}
          onCreate={d => { onCreateDebate(d); setShowCreate(false); }}
        />
      )}
    </div>
  );
}

function Leaderboard({ debates }) {
  const leaders = useMemo(() => {
    const scores = {};
    debates.forEach(d => {
      [...d.args.for, ...d.args.against].forEach(a => {
        if (!scores[a.author]) scores[a.author] = { alias: a.author, totalVotes: 0, argCount: 0 };
        scores[a.author].totalVotes += a.votes;
        scores[a.author].argCount += 1;
      });
    });
    return Object.values(scores).sort((a, b) => b.totalVotes - a.totalVotes).slice(0, 10);
  }, [debates]);

  return (
    <div>
      <h2 style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>🏆 Leaderboard</h2>
      <p style={{ color: 'rgba(224,231,255,.5)', fontSize: 14, marginBottom: 20 }}>Top debaters by total argument votes received</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {leaders.map((l, i) => (
          <div key={l.alias} className="leaderboard-row">
            <div className={`rank-badge rank-${i < 3 ? i + 1 : 'other'}`}>{i + 1}</div>
            <div style={{ flex: 1 }}>
              <span style={{ fontWeight: 700, fontSize: 15 }}>~{l.alias}</span>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div style={{ fontWeight: 800, fontSize: 16, color: 'var(--accent)' }}>+{l.totalVotes}</div>
              <div style={{ fontSize: 11, color: 'rgba(224,231,255,.4)' }}>{l.argCount} args</div>
            </div>
          </div>
        ))}
        {leaders.length === 0 && <p style={{ color: 'rgba(224,231,255,.4)' }}>No debaters yet.</p>}
      </div>
    </div>
  );
}

function App() {
  const [debates, setDebates] = useState(getDebates);
  const [activeTab, setActiveTab] = useState('feed');
  const [selectedDebate, setSelectedDebate] = useState(null);
  const alias = useMemo(() => getAlias(), []);

  const handleCreateDebate = useCallback((d) => {
    setDebates(prev => {
      const updated = [d, ...prev];
      saveDebates(updated);
      return updated;
    });
  }, []);

  const handleSelectDebate = useCallback((d) => {
    setSelectedDebate(d);
  }, []);

  return (
    <div>
      <div className="header">
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <a href="../../index.html" style={{ fontSize: 13, color: 'rgba(224,231,255,.5)' }}>← Home</a>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 22 }}>⚔️</span>
            <span style={{ fontWeight: 800, fontSize: 18, background: 'linear-gradient(135deg, var(--accent), #818cf8)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
              DebateArena
            </span>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          {selectedDebate ? null : (
            <div className="tab-bar">
              <button className={`tab${activeTab === 'feed' ? ' active' : ''}`} onClick={() => setActiveTab('feed')}>🗣 Feed</button>
              <button className={`tab${activeTab === 'leaderboard' ? ' active' : ''}`} onClick={() => setActiveTab('leaderboard')}>🏆 Leaderboard</button>
            </div>
          )}
          <span style={{ fontSize: 12, color: 'rgba(224,231,255,.5)', borderLeft: '1px solid var(--border)', paddingLeft: 12 }}>
            ~{alias}
          </span>
        </div>
      </div>

      <div className="container">
        {selectedDebate ? (
          <DebateDetail
            debate={selectedDebate}
            debates={debates}
            setDebates={setDebates}
            onBack={() => setSelectedDebate(null)}
          />
        ) : activeTab === 'feed' ? (
          <DebateFeed
            debates={debates}
            onSelectDebate={handleSelectDebate}
            onCreateDebate={handleCreateDebate}
            alias={alias}
          />
        ) : (
          <Leaderboard debates={debates} />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
