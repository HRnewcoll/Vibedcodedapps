<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalBuy – Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060f;--accent:#7c3aed;--accent2:#6d28d9;--accent3:#a78bfa;
  --border:rgba(124,58,237,0.2);--glass:rgba(124,58,237,0.07);
  --text:#f5f3ff;--text2:#c4b5fd;--text3:rgba(245,243,255,0.55);
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--card:#0f0d1a;
}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.2)}
::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:3px}

/* Header */
.header{position:sticky;top:0;z-index:200;background:rgba(6,6,15,0.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo{font-size:20px;font-weight:800;color:var(--accent3);white-space:nowrap;display:flex;align-items:center;gap:6px;text-decoration:none}
.logo span{color:#fff}
.search-bar{flex:1;max-width:520px;position:relative}
.search-bar input{width:100%;background:rgba(124,58,237,0.1);border:1px solid var(--border);
  border-radius:10px;color:var(--text);padding:9px 14px 9px 38px;font-size:14px;font-family:inherit;transition:all 0.2s}
.search-bar input:focus{outline:none;border-color:var(--accent);background:rgba(124,58,237,0.15)}
.search-bar input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{padding:8px 16px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-ghost{background:var(--glass);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(124,58,237,0.18);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.25)}
.btn-danger:hover{background:rgba(239,68,68,0.22)}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--glass);
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all 0.2s;position:relative}
.icon-btn:hover{background:rgba(124,58,237,0.18);color:var(--text)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;
  font-size:9px;font-weight:800;border-radius:10px;padding:1px 5px;line-height:14px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--glass);
  border:1px solid var(--border);border-radius:8px;color:var(--text2);text-decoration:none;
  font-size:13px;transition:all 0.2s;white-space:nowrap}
.back-btn:hover{background:rgba(124,58,237,0.18);color:var(--text)}

/* Layout */
.main-layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 14px;
  background:rgba(6,6,15,0.7);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.content{flex:1;padding:18px;min-width:0}

/* Categories */
.section-title{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:0.1em;
  text-transform:uppercase;margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;color:var(--text3);transition:all 0.18s;border:1px solid transparent}
.cat-item:hover{background:var(--glass);color:var(--text);border-color:var(--border)}
.cat-item.active{background:rgba(124,58,237,0.18);color:var(--accent3);border-color:var(--border);font-weight:600}
.cat-emoji{font-size:16px;width:22px;text-align:center}

/* Filters */
.filter-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.filter-row{margin-bottom:14px}
.filter-label{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:6px;display:block}
.price-row{display:flex;align-items:center;gap:6px}
.price-row input[type=number]{width:70px;background:rgba(0,0,0,0.35);border:1px solid var(--border);
  border-radius:7px;color:var(--text);padding:6px 9px;font-size:12px;font-family:inherit}
.price-row input:focus{outline:none;border-color:var(--accent)}
.price-sep{color:var(--text3);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.cond-list{display:flex;flex-direction:column;gap:5px}
.cond-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3);cursor:pointer}
.cond-item input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
.cond-item:hover{color:var(--text)}
select.filter-select{width:100%;background:rgba(0,0,0,0.35);border:1px solid var(--border);
  border-radius:7px;color:var(--text);padding:7px 10px;font-size:12px;font-family:inherit;cursor:pointer}
select.filter-select:focus{outline:none;border-color:var(--accent)}
select.filter-select option{background:#0f0d1a}

/* Category chips (mobile / top) */
.cat-chips-wrap{display:none;padding:10px 18px 0}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:768px){
  .sidebar{display:none}.cat-chips-wrap{display:block}.main-layout{flex-direction:column}
}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--glass);
  color:var(--text3);font-size:12px;cursor:pointer;transition:all 0.18s;font-family:inherit}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:rgba(124,58,237,0.25);border-color:var(--accent);color:var(--accent3);font-weight:600}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.results-count{font-size:13px;color:var(--text3)}
.sort-row{display:flex;align-items:center;gap:8px}
.sort-label{font-size:12px;color:var(--text3)}

/* Listing grid */
.listing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.listing-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:all 0.22s;display:flex;flex-direction:column}
.listing-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(124,58,237,0.25);border-color:rgba(124,58,237,0.45)}
.card-img{height:160px;background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(109,40,217,0.08));
  display:flex;align-items:center;justify-content:center;font-size:62px;position:relative;flex-shrink:0}
.card-fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(6,6,15,0.7);border:1px solid var(--border);display:flex;align-items:center;
  justify-content:center;font-size:14px;cursor:pointer;transition:all 0.18s;z-index:2}
.card-fav:hover{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.4)}
.card-fav.faved{background:rgba(239,68,68,0.18);border-color:rgba(239,68,68,0.4)}
.card-body{padding:11px 12px;flex:1;display:flex;flex-direction:column;gap:5px}
.card-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:16px;font-weight:800;color:var(--accent3)}
.card-price.free{color:var(--green)}
.card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-loc{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:3px}
.card-time{font-size:11px;color:var(--text3)}
.card-footer{display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px;border-top:1px solid var(--border);background:rgba(0,0,0,0.15)}
.card-seller{font-size:11px;color:var(--text3)}
.card-views{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:3px}
.cond-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700}
.cond-New{background:rgba(34,197,94,0.15);color:#86efac}
.cond-Like-New{background:rgba(59,130,246,0.15);color:#93c5fd}
.cond-Good{background:rgba(234,179,8,0.15);color:#fde68a}
.cond-Fair{background:rgba(239,68,68,0.15);color:#fca5a5}

/* Load More */
.load-more-wrap{display:flex;justify-content:center;margin-top:24px}

/* Modal backdrop */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(6px);
  z-index:500;display:flex;align-items:flex-end;justify-content:center;padding:20px}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;
  width:100%;max-width:860px;max-height:92vh;overflow-y:auto;animation:slideUp 0.28s ease;
  display:flex;flex-direction:column}
.modal-sm{border-radius:16px;max-width:520px;max-height:90vh}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;
  background:var(--card);z-index:10;border-radius:20px 20px 0 0}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--glass);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.modal-close:hover{background:rgba(239,68,68,0.15);color:var(--red)}
.modal-body{padding:20px 22px;flex:1}

/* Detail modal */
.detail-layout{display:grid;grid-template-columns:1fr 340px;gap:22px}
@media(max-width:640px){.detail-layout{grid-template-columns:1fr}}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.img-placeholder{background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(109,40,217,0.08));
  border-radius:10px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:42px;border:1px solid var(--border)}
.img-placeholder.main{font-size:80px;aspect-ratio:4/3;grid-column:span 3}
.detail-title{font-size:20px;font-weight:700;margin-bottom:8px}
.detail-price{font-size:26px;font-weight:800;color:var(--accent3);margin-bottom:10px}
.detail-price.free{color:var(--green)}
.detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.detail-desc{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:16px}
.detail-info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.info-cell{background:rgba(124,58,237,0.08);border:1px solid var(--border);border-radius:9px;
  padding:10px 12px}
.info-cell-label{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px}
.info-cell-val{font-size:13px;color:var(--text);font-weight:500}

/* Seller panel */
.seller-panel{background:rgba(124,58,237,0.08);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.seller-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.seller-name{font-size:15px;font-weight:700}
.seller-meta{font-size:12px;color:var(--text3)}
.stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
.seller-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-mini{text-align:center;padding:8px;background:rgba(0,0,0,0.2);border-radius:8px}
.stat-mini-val{font-size:16px;font-weight:700;color:var(--accent3)}
.stat-mini-label{font-size:10px;color:var(--text3)}

/* Forms */
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-group label{font-size:12px;color:var(--text3);font-weight:600}
.form-group input,.form-group textarea,.form-group select{background:rgba(0,0,0,0.35);
  border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 12px;
  font-size:13px;font-family:inherit;resize:vertical;transition:border-color 0.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.form-group select option{background:#0f0d1a}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Action buttons */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.offer-input-row{display:flex;gap:8px;margin-top:8px}
.offer-input-row input{flex:1}

/* Account page */
.account-wrap{padding:20px}
.account-header{display:flex;align-items:center;gap:16px;margin-bottom:22px;
  background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:18px}
.account-avatar{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.account-name{font-size:18px;font-weight:700}
.account-sub{font-size:13px;color:var(--text3)}
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:4px}
.tab{padding:8px 16px;border-radius:7px;border:none;background:transparent;color:var(--text3);
  font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit}
.tab.active{background:var(--accent2);color:#fff}
.tab:hover:not(.active){background:rgba(124,58,237,0.12);color:var(--text)}
.my-listings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.empty-state{text-align:center;padding:44px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-msg{font-size:14px}

/* Messages */
.messages-layout{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:400px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.thread-list{border-right:1px solid var(--border);overflow-y:auto;background:rgba(0,0,0,0.2)}
.thread-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.thread-item:hover{background:var(--glass)}
.thread-item.active{background:rgba(124,58,237,0.14)}
.thread-name{font-size:13px;font-weight:600;color:var(--text)}
.thread-preview{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-time{font-size:11px;color:var(--text3);margin-top:2px}
.chat-panel{display:flex;flex-direction:column}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.15)}
.chat-title{font-size:14px;font-weight:600}
.chat-sub{font-size:11px;color:var(--text3);margin-top:1px}
.chat-messages{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:260px;max-height:320px}
.msg-bubble{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45}
.msg-me{background:rgba(124,58,237,0.25);border:1px solid rgba(124,58,237,0.35);color:var(--text);align-self:flex-end;border-bottom-right-radius:4px}
.msg-them{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:var(--text3);margin-top:3px}
.chat-input-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border)}
.chat-input-row input{flex:1;background:rgba(0,0,0,0.35);border:1px solid var(--border);
  border-radius:9px;color:var(--text);padding:8px 12px;font-size:13px;font-family:inherit}
.chat-input-row input:focus{outline:none;border-color:var(--accent)}
.no-thread{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:14px}

/* Toast */
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--accent2);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  animation:toastIn 0.3s ease;display:flex;align-items:center;gap:8px;min-width:220px}
.toast.out{animation:toastOut 0.3s ease forwards}
.toast.success{background:#15803d}
.toast.error{background:#b91c1c}
.toast.info{background:var(--accent2)}

/* Misc */
.divider{height:1px;background:var(--border);margin:14px 0}
.report-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
</style>
</head>

function escHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function sanitise(s){return String(s||'').trim().slice(0,2000)}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function timeAgo(iso){
  const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000),h=Math.floor(m/60),dy=Math.floor(h/24);
  if(dy>0)return dy+'d ago';if(h>0)return h+'h ago';if(m>0)return m+'m ago';return 'just now';
}
function fmt(p){return p===0||p==='0'?'Free':'£'+Number(p).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2})}
function stars(n){return'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n))}

/* ── localStorage helpers ── */
function lsGet(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch{return def}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}

/* ── Toast ── */
function ToastContainer({toasts}){
  return <div className="toast-container">{toasts.map(t=><div key={t.id} className={`toast ${t.type||''} ${t.out?'out':''}`}><span>{t.icon||'✓'}</span>{t.msg}</div>)}</div>;
}
function useToasts(){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((msg,type='info',icon)=>{
    const id=uid();
    setToasts(p=>[...p,{id,msg,type,icon}]);
    setTimeout(()=>setToasts(p=>p.map(t=>t.id===id?{...t,out:true}:t)),2700);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3100);
  },[]);
  return [toasts,add];
}

/* ── Listing Card ── */
function ListingCard({listing,favs,onToggleFav,onClick}){
  const cKey=listing.condition.replace(/\s+/g,'-');
  const isFaved=favs.includes(listing.id);
  return(
    <div className="listing-card" onClick={()=>onClick(listing)}>
      <div className="card-img">
        <span>{listing.emoji}</span>
        <button className={`card-fav${isFaved?' faved':''}`} onClick={e=>{e.stopPropagation();onToggleFav(listing.id)}} title={isFaved?'Remove from favourites':'Add to favourites'} aria-label={isFaved?'Remove from favourites':'Add to favourites'}>
          {isFaved?'❤️':'🤍'}
        </button>
      </div>
      <div className="card-body">
        <div className="card-title">{listing.title}</div>
        <div className={`card-price${listing.price===0||listing.price==='0'?' free':''}`}>{fmt(listing.price)}</div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span className={`cond-badge cond-${cKey}`}>{listing.condition}</span>
        </div>
        <div className="card-meta">
          <span className="card-loc">📍{listing.location}</span>
          <span className="card-time">{timeAgo(listing.postedAt)}</span>
        </div>
      </div>
      <div className="card-footer">
        <span className="card-seller">@{listing.seller}</span>
        <span className="card-views">👁 {listing.views}</span>
      </div>
    </div>
  );
}

/* ── Listing Modal ── */
function ListingModal({listing,onClose,favs,onToggleFav,onMessage,toastAdd}){
  const [offerVal,setOfferVal]=useState('');
  const [msgVal,setMsgVal]=useState(`Hi, I'm interested in "${listing.title}". Is it still available?`);
  const cKey=listing.condition.replace(/\s+/g,'-');
  const isFaved=favs.includes(listing.id);

  function handleMessage(){
    if(!msgVal.trim()){toastAdd('Please enter a message','error','✕');return;}
    onMessage(listing,sanitise(msgVal));
    toastAdd('Message sent to seller!','success','✓');
    onClose();
  }
  function handleOffer(){
    const n=parseFloat(offerVal);
    if(isNaN(n)||n<=0){toastAdd('Enter a valid offer amount','error','✕');return;}
    onMessage(listing,`💰 Offer: £${n.toFixed(2)} – is this acceptable?`);
    toastAdd(`Offer of £${n.toFixed(2)} sent!`,'success','💰');
    setOfferVal('');
    onClose();
  }
  function handleShare(){
    navigator.clipboard?.writeText(window.location.href).then(()=>toastAdd('Link copied!','info','🔗')).catch(()=>toastAdd('Share: '+listing.title,'info','🔗'));
  }

  return(
    <div className="modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">Listing Detail</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="detail-layout">
            <div>
              <div className="img-grid">
                <div className="img-placeholder main">{listing.emoji}</div>
                {[1,2,3].map(i=><div key={i} className="img-placeholder" style={{fontSize:28,opacity:0.5}}>🖼️</div>)}
              </div>
              <div className="detail-title">{listing.title}</div>
              <div className={`detail-price${listing.price===0||listing.price==='0'?' free':''}`}>{fmt(listing.price)}</div>
              <div className="detail-badges">
                <span className={`cond-badge cond-${cKey}`}>{listing.condition}</span>
                <span className="cond-badge" style={{background:'rgba(167,139,250,0.12)',color:'var(--accent3)'}}>{listing.category}</span>
              </div>
              <div className="detail-desc">{listing.desc}</div>
              <div className="detail-info-row">
                <div className="info-cell"><div className="info-cell-label">Location</div><div className="info-cell-val">📍 {listing.location}</div></div>
                <div className="info-cell"><div className="info-cell-label">Posted</div><div className="info-cell-val">🕐 {timeAgo(listing.postedAt)}</div></div>
                <div className="info-cell"><div className="info-cell-label">Views</div><div className="info-cell-val">👁 {listing.views}</div></div>
                <div className="info-cell"><div className="info-cell-label">Condition</div><div className="info-cell-val">{listing.condition}</div></div>
              </div>
              <div className="action-row">
                <button className={`btn ${isFaved?'btn-danger':'btn-ghost'}`} onClick={()=>{onToggleFav(listing.id);toastAdd(isFaved?'Removed from favourites':'Added to favourites','info',isFaved?'🤍':'❤️')}}>
                  {isFaved?'❤️ Unfavourite':'🤍 Favourite'}
                </button>
                <button className="btn btn-ghost" onClick={handleShare}>🔗 Share</button>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--red)',borderColor:'rgba(239,68,68,0.3)'}} onClick={()=>toastAdd('Listing reported. We will review it.','error','🚩')}>🚩 Report</button>
              </div>
            </div>
            <div>
              <div className="seller-panel">
                <div className="seller-row">
                  <div className="avatar">{listing.seller.slice(0,1).toUpperCase()}</div>
                  <div>
                    <div className="seller-name">@{listing.seller}</div>
                    <div className="stars">{stars(listing.sellerRating)}</div>
                    <div className="seller-meta">{listing.sellerRating}/5 · Member since {listing.sellerSince}</div>
                  </div>
                </div>
                <div className="seller-stats">
                  <div className="stat-mini"><div className="stat-mini-val">{listing.sellerListings}</div><div className="stat-mini-label">Listings</div></div>
                  <div className="stat-mini"><div className="stat-mini-val">{listing.sellerRating}</div><div className="stat-mini-label">Rating</div></div>
                </div>
                <button className="btn btn-ghost" style={{width:'100%',marginBottom:8}} onClick={()=>toastAdd('Viewing seller profile','info','👤')}>View Profile</button>
              </div>
              <div className="seller-panel">
                <div className="section-title">💬 Message Seller</div>
                <div className="form-group">
                  <textarea rows={3} value={msgVal} onChange={e=>setMsgVal(e.target.value)} placeholder="Write your message…" style={{resize:'vertical'}}/>
                </div>
                <button className="btn btn-primary" style={{width:'100%'}} onClick={handleMessage}>Send Message</button>
              </div>
              {(listing.price!==0&&listing.price!=='0')&&<div className="seller-panel">
                <div className="section-title">💰 Make an Offer</div>
                <div className="offer-input-row">
                  <input type="number" min="0" step="0.01" value={offerVal} onChange={e=>setOfferVal(e.target.value)} placeholder="Your offer (£)"/>

/* ── Post Modal ── */
function PostModal({onClose,onPost,toastAdd,currentUser}){
  const [form,setForm]=useState({title:'',desc:'',category:'Electronics',price:'',condition:'Good',location:'',contact:'Message'});
  const [errors,setErrors]=useState({});
  function set(k,v){setForm(p=>({...p,[k]:v}));setErrors(p=>({...p,[k]:''}))}
  function validate(){
    const e={};
    if(!form.title.trim())e.title='Title is required';
    if(!form.desc.trim())e.desc='Description is required';
    if(!form.location.trim())e.location='Location is required';
    if(form.price===''||isNaN(Number(form.price))||Number(form.price)<0)e.price='Enter a valid price (0 for free)';
    return e;
  }
  function handleSubmit(){
    const e=validate();
    if(Object.keys(e).length){setErrors(e);toastAdd('Please fix the errors below','error','✕');return;}
    const listing={
      id:uid(),title:sanitise(form.title),desc:sanitise(form.desc),
      category:form.category,price:Number(form.price),
      condition:form.condition,location:sanitise(form.location),
      contact:form.contact,seller:currentUser,
      sellerRating:4.5,sellerSince:'2025',sellerListings:1,
      views:0,emoji:CATEGORIES.find(c=>c.id===form.category)?.emoji||'📦',
      postedAt:new Date().toISOString()
    };
    onPost(listing);
    toastAdd('Listing posted!','success','🎉');
    onClose();
  }
  return(
    <div className="modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal modal-sm" style={{borderRadius:16,alignSelf:'center'}}>
        <div className="modal-header" style={{borderRadius:'16px 16px 0 0'}}>
          <span className="modal-title">📝 Post a Listing</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-group">
            <label>Title *</label>
            <input maxLength={100} value={form.title} onChange={e=>set('title',e.target.value)} placeholder="What are you selling?"/>
            {errors.title&&<span style={{color:'var(--red)',fontSize:11}}>{errors.title}</span>}
          </div>
          <div className="form-group">
            <label>Description *</label>
            <textarea rows={3} maxLength={1000} value={form.desc} onChange={e=>set('desc',e.target.value)} placeholder="Describe your item, condition, any defects…"/>
            {errors.desc&&<span style={{color:'var(--red)',fontSize:11}}>{errors.desc}</span>}
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label>Category</label>
              <select value={form.category} onChange={e=>set('category',e.target.value)}>
                {CATEGORIES.filter(c=>c.id!=='All').map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Condition</label>
              <select value={form.condition} onChange={e=>set('condition',e.target.value)}>
                {CONDITIONS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label>Price (£) – enter 0 for Free *</label>
              <input type="number" min="0" step="0.01" value={form.price} onChange={e=>set('price',e.target.value)} placeholder="0.00"/>
              {errors.price&&<span style={{color:'var(--red)',fontSize:11}}>{errors.price}</span>}
            </div>
            <div className="form-group">
              <label>Location *</label>
              <input maxLength={80} value={form.location} onChange={e=>set('location',e.target.value)} placeholder="e.g. London, Remote"/>
              {errors.location&&<span style={{color:'var(--red)',fontSize:11}}>{errors.location}</span>}
            </div>
          </div>
          <div className="form-group">
            <label>Preferred Contact</label>
            <select value={form.contact} onChange={e=>set('contact',e.target.value)}>
              {['Message','Phone','Email','WhatsApp'].map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <button className="btn btn-primary" style={{width:'100%',marginTop:6,padding:'11px 0',fontSize:14}} onClick={handleSubmit}>🚀 Post Listing</button>
        </div>
      </div>
    </div>
  );
}

/* ── Filters Panel ── */
function FiltersPanel({filters,setFilters}){
  function setF(k,v){setFilters(p=>({...p,[k]:v}))}
  function toggleCond(c){
    setFilters(p=>({...p,conditions:p.conditions.includes(c)?p.conditions.filter(x=>x!==c):[...p.conditions,c]}));
  }
  return(
    <>
      <div className="filter-section">
        <div className="section-title">Filters</div>
        <div className="filter-row">
          <label className="filter-label">Price Range (£)</label>
          <div className="price-row">
            <input type="number" min="0" value={filters.minPrice} onChange={e=>setF('minPrice',e.target.value)} placeholder="Min"/>
            <span className="price-sep">–</span>
            <input type="number" min="0" value={filters.maxPrice} onChange={e=>setF('maxPrice',e.target.value)} placeholder="Max"/>
          </div>
        </div>
        <div className="filter-row">
          <label className="filter-label">Condition</label>
          <div className="cond-list">
            {CONDITIONS.map(c=>(
              <label key={c} className="cond-item">
                <input type="checkbox" checked={filters.conditions.includes(c)} onChange={()=>toggleCond(c)}/>
                {c}
              </label>
            ))}
          </div>
        </div>
        <div className="filter-row">
          <label className="filter-label">Distance</label>
          <select className="filter-select" value={filters.distance} onChange={e=>setF('distance',e.target.value)}>
            {DISTANCES.map(d=><option key={d}>{d}</option>)}
          </select>
        </div>
        <div className="filter-row">
          <label className="filter-label">Sort By</label>
          <select className="filter-select" value={filters.sort} onChange={e=>setF('sort',e.target.value)}>
            <option value="newest">Newest First</option>
            <option value="cheapest">Cheapest First</option>
            <option value="expensive">Most Expensive</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
        <button className="btn btn-ghost btn-sm" style={{width:'100%',marginTop:4}} onClick={()=>setFilters({minPrice:'',maxPrice:'',conditions:[],distance:'Any',sort:'newest'})}>Reset Filters</button>
      </div>
    </>
  );
}

/* ── Messages Panel ── */
function MessagesPanel({threads,setThreads,toastAdd}){
  const [active,setActive]=useState(Object.keys(threads||{})[0]||null);
  const [input,setInput]=useState('');
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'})},[active,threads]);

  const threadKeys=Object.keys(threads||{});
  if(!threadKeys.length)return<div className="empty-state"><div className="empty-icon">💬</div><div className="empty-msg">No messages yet. Message a seller to start chatting!</div></div>;

  function sendMsg(){
    if(!input.trim()||!active)return;
    const msg={id:uid(),text:sanitise(input),from:'me',time:new Date().toISOString()};
    setThreads(p=>({...p,[active]:{...p[active],msgs:[...(p[active].msgs||[]),msg]}}));
    setInput('');
  }
  const thread=threads[active];
  return(
    <div className="messages-layout">
      <div className="thread-list">
        {threadKeys.map(k=>{
          const t=threads[k];
          const last=t.msgs?.[t.msgs.length-1];
          return(
            <div key={k} className={`thread-item${active===k?' active':''}`} onClick={()=>setActive(k)}>
              <div className="thread-name">{t.listing?.title?.slice(0,28)||k}</div>
              <div className="thread-preview">{last?.text||'No messages'}</div>
              <div className="thread-time">{last?timeAgo(last.time):''}</div>
            </div>
          );
        })}
      </div>
      {active&&thread?(
        <div className="chat-panel">
          <div className="chat-header">
            <div className="chat-title">{thread.listing?.title||'Conversation'}</div>
            <div className="chat-sub">Seller: @{thread.listing?.seller||'unknown'}</div>
          </div>
          <div className="chat-messages">
            {(thread.msgs||[]).map(m=>(
              <div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.from==='me'?'flex-end':'flex-start'}}>
                <div className={`msg-bubble ${m.from==='me'?'msg-me':'msg-them'}`}>{m.text}</div>
                <div className="msg-time">{timeAgo(m.time)}</div>
              </div>
            ))}
            <div ref={bottomRef}/>
          </div>
          <div className="chat-input-row">
            <input value={input} onChange={e=>setInput(e.target.value)} placeholder="Type a message…"
              onKeyDown={e=>{if(e.key==='Enter')sendMsg()}}/>
            <button className="btn btn-primary btn-sm" onClick={sendMsg}>Send</button>
          </div>
        </div>
      ):<div className="no-thread">Select a conversation</div>}
    </div>
  );
}

/* ── Account Page ── */
function AccountPage({myListings,onDeleteListing,favListings,threads,setThreads,toastAdd,onCardClick,favs,onToggleFav}){
  const [tab,setTab]=useState('listings');
  return(
    <div className="account-wrap">
      <div className="account-header">
        <div className="account-avatar">U</div>
        <div>
          <div className="account-name">my_account</div>
          <div className="account-sub">Member since January 2025 · {myListings.length} active listing{myListings.length!==1?'s':''}</div>
          <div className="stars" style={{marginTop:4}}>★★★★★ <span style={{color:'var(--text3)',fontSize:12}}>5.0</span></div>
        </div>
      </div>
      <div className="tabs">
        <button className={`tab${tab==='listings'?' active':''}`} onClick={()=>setTab('listings')}>My Listings ({myListings.length})</button>
        <button className={`tab${tab==='favs'?' active':''}`} onClick={()=>setTab('favs')}>Favourites ({favListings.length})</button>
        <button className={`tab${tab==='messages'?' active':''}`} onClick={()=>setTab('messages')}>Messages ({Object.keys(threads||{}).length})</button>
      </div>
      {tab==='listings'&&(
        myListings.length===0
          ?<div className="empty-state"><div className="empty-icon">📦</div><div className="empty-msg">You haven't posted any listings yet.</div></div>
          :<div className="my-listings-grid">
            {myListings.map(l=>(
              <div key={l.id} style={{position:'relative'}}>
                <ListingCard listing={l} favs={favs} onToggleFav={onToggleFav} onClick={onCardClick}/>
                <button className="btn btn-danger btn-sm" style={{width:'100%',marginTop:6,borderRadius:8}}
                  onClick={()=>{onDeleteListing(l.id);toastAdd('Listing deleted','error','🗑️')}}>🗑️ Delete</button>
              </div>
            ))}
          </div>
      )}
      {tab==='favs'&&(
        favListings.length===0
          ?<div className="empty-state"><div className="empty-icon">🤍</div><div className="empty-msg">No favourites yet. Heart a listing to save it here.</div></div>
          :<div className="my-listings-grid">
            {favListings.map(l=><ListingCard key={l.id} listing={l} favs={favs} onToggleFav={onToggleFav} onClick={onCardClick}/>)}
          </div>
      )}
      {tab==='messages'&&<MessagesPanel threads={threads} setThreads={setThreads} toastAdd={toastAdd}/>}
    </div>
  );
}

/* ── App ── */
function App(){
  const [toasts,toastAdd]=useToasts();
  const [page,setPage]=useState('feed'); // feed | account
  const [allListings,setAllListings]=useState(()=>lsGet('lb_listings',SEED));
  const [favs,setFavs]=useState(()=>lsGet('lb_favs',[]));
  const [threads,setThreadsRaw]=useState(()=>lsGet('lb_threads',{}));
  const [notifications,setNotifications]=useState(3);
  const [search,setSearch]=useState('');
  const [activeCategory,setActiveCategory]=useState('All');
  const [filters,setFilters]=useState({minPrice:'',maxPrice:'',conditions:[],distance:'Any',sort:'newest'});
  const [selectedListing,setSelectedListing]=useState(null);
  const [showPost,setShowPost]=useState(false);
  const [page_num,setPageNum]=useState(1);
  const PAGE_SIZE=12;

  function setThreads(updater){
    setThreadsRaw(prev=>{
      const next=typeof updater==='function'?updater(prev):updater;
      lsSet('lb_threads',next);
      return next;
    });
  }
  useEffect(()=>lsSet('lb_listings',allListings),[allListings]);
  useEffect(()=>lsSet('lb_favs',favs),[favs]);

  function toggleFav(id){
    setFavs(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  }
  function handlePost(listing){
    setAllListings(p=>[listing,...p]);
    setPageNum(1);
  }
  function handleDelete(id){
    setAllListings(p=>p.filter(l=>l.id!==id));
    setFavs(p=>p.filter(f=>f!==id));
  }
  function handleMessage(listing,text){
    const threadKey=listing.id;
    const msg={id:uid(),text,from:'me',time:new Date().toISOString()};
    setThreads(p=>({
      ...p,
      [threadKey]:{
        listing,
        msgs:[...(p[threadKey]?.msgs||[]),msg]
      }
    }));
    setNotifications(n=>n+1);
  }

  /* Filtered & sorted listings */
  const filtered=useMemo(()=>{
    let list=[...allListings];
    if(activeCategory!=='All')list=list.filter(l=>l.category===activeCategory);
    if(search.trim()){
      const q=search.toLowerCase();
      list=list.filter(l=>l.title.toLowerCase().includes(q)||l.desc.toLowerCase().includes(q)||l.location.toLowerCase().includes(q));
    }
    if(filters.minPrice!=='')list=list.filter(l=>Number(l.price)>=Number(filters.minPrice));
    if(filters.maxPrice!=='')list=list.filter(l=>Number(l.price)<=Number(filters.maxPrice));
    if(filters.conditions.length)list=list.filter(l=>filters.conditions.includes(l.condition));
    switch(filters.sort){
      case'cheapest':list.sort((a,b)=>Number(a.price)-Number(b.price));break;
      case'expensive':list.sort((a,b)=>Number(b.price)-Number(a.price));break;
      case'popular':list.sort((a,b)=>b.views-a.views);break;
      default:list.sort((a,b)=>new Date(b.postedAt)-new Date(a.postedAt));
    }
    return list;
  },[allListings,activeCategory,search,filters]);

  const displayed=filtered.slice(0,page_num*PAGE_SIZE);
  const myListings=allListings.filter(l=>l.seller==='my_account');
  const favListings=allListings.filter(l=>favs.includes(l.id));

  function handleCatChange(id){setActiveCategory(id);setPageNum(1);}
  function handleSearch(v){setSearch(v);setPageNum(1);}

  return(
    <>
      <ToastContainer toasts={toasts}/>

      {/* Header */}
      <header className="header">
        <a href="../../index.html" className="back-btn">← Back</a>
        <a className="logo" href="#" onClick={e=>{e.preventDefault();setPage('feed');}} style={{cursor:'pointer',textDecoration:'none'}}>
          🛍️ <span>Local</span>Buy
        </a>
        <div className="search-bar">
          <span className="search-icon">🔍</span>
          <input value={search} onChange={e=>handleSearch(e.target.value)} placeholder="Search listings…" aria-label="Search listings"/>
        </div>
        <div className="header-actions">
          <button className="btn btn-primary" onClick={()=>setShowPost(true)}>+ Post Ad</button>
          <button className="icon-btn" title="Notifications" onClick={()=>{setNotifications(0);toastAdd('All caught up!','info','🔔')}}>
            🔔{notifications>0&&<span className="badge">{notifications}</span>}
          </button>
          <button className="icon-btn" title="My Account" onClick={()=>setPage(p=>p==='account'?'feed':'account')}>
            👤
          </button>
        </div>
      </header>

      {/* Category chips (mobile) */}
      <div className="cat-chips-wrap">
        <div className="cat-chips">
          {CATEGORIES.map(c=>(
            <button key={c.id} className={`chip${activeCategory===c.id?' active':''}`} onClick={()=>handleCatChange(c.id)}>
              {c.emoji} {c.label}
            </button>
          ))}
        </div>
      </div>

      {page==='account'?(
        <AccountPage
          myListings={myListings} onDeleteListing={handleDelete}
          favListings={favListings} threads={threads} setThreads={setThreads}
          toastAdd={toastAdd} onCardClick={setSelectedListing}
          favs={favs} onToggleFav={toggleFav}
        />
      ):(
        <div className="main-layout">
          {/* Sidebar */}
          <aside className="sidebar">
            <div className="section-title">Categories</div>
            <div className="cat-list">
              {CATEGORIES.map(c=>(
                <div key={c.id} className={`cat-item${activeCategory===c.id?' active':''}`} onClick={()=>handleCatChange(c.id)}>
                  <span className="cat-emoji">{c.emoji}</span>{c.label}
                </div>
              ))}
            </div>
            <FiltersPanel filters={filters} setFilters={v=>{setFilters(v);setPageNum(1);}}/>
          </aside>

          {/* Main content */}
          <main className="content">
            {/* Mobile chips */}
            <div className="cat-chips">
              {CATEGORIES.map(c=>(
                <button key={c.id} className={`chip${activeCategory===c.id?' active':''}`} onClick={()=>handleCatChange(c.id)}>
                  {c.emoji} {c.label}
                </button>
              ))}
            </div>

            {/* Top bar */}
            <div className="top-bar">
              <span className="results-count">
                {filtered.length} listing{filtered.length!==1?'s':''}{activeCategory!=='All'?` in ${activeCategory}`:''}
                {search.trim()?` for "${search}"`:''}
              </span>
              <div className="sort-row">
                <span className="sort-label">Sort:</span>
                <select className="filter-select" value={filters.sort} onChange={e=>setFilters(p=>({...p,sort:e.target.value}))} style={{width:'auto'}}>
                  <option value="newest">Newest</option>
                  <option value="cheapest">Cheapest</option>
                  <option value="expensive">Most Expensive</option>
                  <option value="popular">Most Popular</option>
                </select>
              </div>
            </div>

            {/* Grid */}
            {displayed.length===0?(
              <div className="empty-state">
                <div className="empty-icon">🔍</div>
                <div className="empty-msg">No listings found. Try adjusting your filters or search.</div>
              </div>
            ):(
              <div className="listing-grid">
                {displayed.map(l=>(
                  <ListingCard key={l.id} listing={l} favs={favs} onToggleFav={toggleFav} onClick={setSelectedListing}/>
                ))}
              </div>
            )}

            {/* Load more */}
            {displayed.length<filtered.length&&(
              <div className="load-more-wrap">
                <button className="btn btn-ghost" style={{padding:'11px 32px',fontSize:14}} onClick={()=>setPageNum(p=>p+1)}>
                  Load More ({filtered.length-displayed.length} remaining)
                </button>
              </div>
            )}
          </main>
        </div>
      )}

      {/* Modals */}
      {selectedListing&&(
        <ListingModal
          listing={selectedListing} onClose={()=>setSelectedListing(null)}
          favs={favs} onToggleFav={toggleFav}
          onMessage={handleMessage} toastAdd={toastAdd}
        />
      )}
      {showPost&&(
        <PostModal onClose={()=>setShowPost(false)} onPost={handlePost} toastAdd={toastAdd} currentUser="my_account"/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
