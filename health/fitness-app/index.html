<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fitness Tracker — VibedApps</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#051a0f; --accent:#10b981; --accent2:#059669; --accent3:#34d399;
      --border:rgba(16,185,129,0.2); --glass:rgba(16,185,129,0.08);
      --text:#e2fdf3; --text2:#6ee7b7; --text3:rgba(226,253,243,0.6);
      --red:#ef4444; --yellow:#f59e0b; --blue:#3b82f6;
    }
    body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#051a0f,#0a2818,#071a10); min-height:100vh; color:var(--text); }
    nav { position:sticky; top:0; z-index:100; background:rgba(5,26,15,0.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:60px; }
    nav h1 { font-size:1.15rem; font-weight:700; color:var(--accent); }
    .container { max-width:1200px; margin:0 auto; padding:28px 20px; }
    .layout { display:grid; grid-template-columns:340px 1fr; gap:24px; }
    @media(max-width:860px){ .layout{grid-template-columns:1fr;} }
    .card { background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:22px; }
    .card h2 { font-size:.95rem; font-weight:700; color:var(--accent); margin-bottom:16px; letter-spacing:.05em; text-transform:uppercase; }
    label { display:block; font-size:.8rem; color:var(--text2); margin-bottom:4px; font-weight:500; }
    input, select, textarea { width:100%; background:rgba(16,185,129,0.08); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-size:.9rem; font-family:'Inter',sans-serif; outline:none; transition:border .2s; }
    input:focus, select:focus, textarea:focus { border-color:var(--accent); }
    select option { background:#0a2818; }
    textarea { resize:vertical; min-height:70px; }
    .form-group { margin-bottom:14px; }
    .btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; border-radius:10px; padding:11px 20px; font-size:.9rem; font-weight:600; cursor:pointer; width:100%; transition:opacity .2s,transform .1s; }
    .btn:hover { opacity:.88; transform:translateY(-1px); }
    .btn-sm { padding:5px 11px; font-size:.78rem; width:auto; border-radius:7px; }
    .btn-danger { background:linear-gradient(135deg,#ef4444,#b91c1c); }
    .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:24px; }
    .stat-card { background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:18px; text-align:center; }
    .stat-val { font-size:2rem; font-weight:800; color:var(--accent); line-height:1; }
    .stat-label { font-size:.78rem; color:var(--text3); margin-top:4px; font-weight:500; }
    .chart-wrap { background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:24px; }
    .chart-wrap h2 { font-size:.95rem; font-weight:700; color:var(--accent); margin-bottom:16px; letter-spacing:.05em; text-transform:uppercase; }
    .bar-chart { display:flex; align-items:flex-end; gap:8px; height:220px; }
    .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; justify-content:flex-end; }
    .bar { width:100%; background:linear-gradient(180deg,var(--accent3),var(--accent2)); border-radius:5px 5px 0 0; transition:height .4s; min-height:2px; }
    .bar-day { font-size:.72rem; color:var(--text3); font-weight:500; }
    .bar-val { font-size:.7rem; color:var(--accent3); font-weight:600; }
    .goal-wrap { background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:24px; }
    .goal-wrap h2 { font-size:.95rem; font-weight:700; color:var(--accent); margin-bottom:12px; letter-spacing:.05em; text-transform:uppercase; }
    .progress-bar-bg { background:rgba(16,185,129,0.15); border-radius:99px; height:14px; overflow:hidden; margin:10px 0; }
    .progress-bar-fg { background:linear-gradient(90deg,var(--accent3),var(--accent2)); height:100%; border-radius:99px; transition:width .5s; }
    .workout-list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .workout-list-item:last-child { border-bottom:none; }
    .w-emoji { font-size:1.5rem; width:36px; text-align:center; }
    .w-info { flex:1; }
    .w-type { font-weight:600; font-size:.92rem; }
    .w-meta { font-size:.78rem; color:var(--text3); margin-top:2px; }
    .w-dur { font-size:.9rem; font-weight:700; color:var(--accent); margin-right:10px; }
    .empty { text-align:center; color:var(--text3); padding:32px; font-size:.9rem; }
    .goal-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .goal-row label { margin:0; white-space:nowrap; font-size:.85rem; }
    .goal-row input { width:80px; }
    .goal-pct { font-weight:700; color:var(--accent); font-size:1rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    const WORKOUT_TYPES = [
      { label:'Running',  emoji:'🏃' },
      { label:'Cycling',  emoji:'🚴' },
      { label:'Swimming', emoji:'🏊' },
      { label:'Weights',  emoji:'🏋️' },
      { label:'Yoga',     emoji:'🧘' },
      { label:'HIIT',     emoji:'💪' },
      { label:'Other',    emoji:'🏅' },
    ];

    const emojiFor = (type) => (WORKOUT_TYPES.find(t => t.label === type) || { emoji:'🏅' }).emoji;

    function toDateStr(d) { return d.toISOString().split('T')[0]; }
    function today() { return toDateStr(new Date()); }

    function Navbar() {
      return (
        <nav>
          <a href="../../index.html" style={{color:'var(--accent)',textDecoration:'none',fontWeight:600}}>← Back</a>
          <h1>💪 Fitness Tracker</h1>
          <div style={{width:60}}/>
        </nav>
      );
    }

    function AddWorkoutForm({ onAdd }) {
      const [type, setType]     = useState('Running');
      const [dur,  setDur]      = useState('');
      const [date, setDate]     = useState(today());
      const [notes,setNotes]    = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!dur || isNaN(dur) || Number(dur) <= 0) return;
        onAdd({ id: Date.now(), type, duration: Number(dur), date, notes });
        setDur(''); setNotes('');
      };

      return (
        <div className="card">
          <h2>Log Workout</h2>
          <form onSubmit={submit}>
            <div className="form-group">
              <label>Type</label>
              <select value={type} onChange={e=>setType(e.target.value)}>
                {WORKOUT_TYPES.map(t=>(
                  <option key={t.label} value={t.label}>{t.emoji} {t.label}</option>
                ))}
              </select>
            </div>
            <div className="form-group">
              <label>Duration (minutes)</label>
              <input type="number" min="1" max="600" value={dur} onChange={e=>setDur(e.target.value)} placeholder="e.g. 30" required/>
            </div>
            <div className="form-group">
              <label>Date</label>
              <input type="date" value={date} onChange={e=>setDate(e.target.value)} required/>
            </div>
            <div className="form-group">
              <label>Notes (optional)</label>
              <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="How did it feel?"/>
            </div>
            <button className="btn" type="submit">Log Workout</button>
          </form>
        </div>
      );
    }

    function StatsGrid({ workouts }) {
      const stats = useMemo(() => {
        const now = new Date();
        const weekStart = new Date(now);
        weekStart.setDate(now.getDate() - now.getDay());
        weekStart.setHours(0,0,0,0);

        const thisWeek = workouts.filter(w => new Date(w.date) >= weekStart);
        const weekCount = thisWeek.length;
        const weekMins  = thisWeek.reduce((s,w) => s + w.duration, 0);

        // streak: consecutive days ending today or yesterday with at least one workout
        const daySet = new Set(workouts.map(w => w.date));
        let streak = 0;
        let cur = new Date();
        // if no workout today, start from yesterday for streak
        if (!daySet.has(toDateStr(cur))) cur.setDate(cur.getDate()-1);
        while (daySet.has(toDateStr(cur))) {
          streak++;
          cur.setDate(cur.getDate()-1);
        }

        // favourite
        const freq = {};
        workouts.forEach(w => { freq[w.type] = (freq[w.type]||0) + 1; });
        const fav = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
        const favLabel = fav ? `${emojiFor(fav[0])} ${fav[0]}` : '—';

        return { weekCount, weekMins, streak, favLabel };
      }, [workouts]);

      return (
        <div className="stats-grid">
          <div className="stat-card"><div className="stat-val">{stats.weekCount}</div><div className="stat-label">This Week Workouts</div></div>
          <div className="stat-card"><div className="stat-val">{stats.weekMins}</div><div className="stat-label">This Week Minutes</div></div>
          <div className="stat-card"><div className="stat-val">{stats.streak}🔥</div><div className="stat-label">Current Streak</div></div>
          <div className="stat-card"><div className="stat-val" style={{fontSize:'1.1rem',paddingTop:4}}>{stats.favLabel}</div><div className="stat-label">Favourite Activity</div></div>
        </div>
      );
    }

    function WeeklyChart({ workouts }) {
      const days = useMemo(() => {
        const labels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const now = new Date();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay());
        startOfWeek.setHours(0,0,0,0);

        return Array.from({ length:7 }, (_, i) => {
          const d = new Date(startOfWeek);
          d.setDate(startOfWeek.getDate() + i);
          const ds = toDateStr(d);
          const mins = workouts.filter(w => w.date === ds).reduce((s,w) => s + w.duration, 0);
          return { label: labels[i], mins, isToday: ds === today() };
        });
      }, [workouts]);

      const maxMins = Math.max(...days.map(d => d.mins), 1);

      return (
        <div className="chart-wrap">
          <h2>This Week</h2>
          <div className="bar-chart">
            {days.map(d => (
              <div key={d.label} className="bar-col">
                <span className="bar-val">{d.mins > 0 ? d.mins : ''}</span>
                <div
                  className="bar"
                  style={{
                    height: `${(d.mins / maxMins) * 160}px`,
                    opacity: d.isToday ? 1 : 0.7,
                    background: d.isToday ? 'linear-gradient(180deg,#34d399,#10b981)' : 'linear-gradient(180deg,#059669,#065f46)'
                  }}
                />
                <span className="bar-day" style={{color: d.isToday ? 'var(--accent)':'var(--text3)'}}>{d.label}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function GoalTracker({ workouts, goal, onGoalChange }) {
      const now = new Date();
      const weekStart = new Date(now);
      weekStart.setDate(now.getDate() - now.getDay());
      weekStart.setHours(0,0,0,0);
      const thisWeekCount = workouts.filter(w => new Date(w.date) >= weekStart).length;
      const pct = Math.min(100, Math.round((thisWeekCount / Math.max(goal,1)) * 100));

      return (
        <div className="goal-wrap">
          <h2>Weekly Goal</h2>
          <div className="goal-row">
            <label>Target workouts / week:</label>
            <input type="number" min="1" max="30" value={goal} onChange={e=>onGoalChange(Number(e.target.value))} style={{width:70}}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:'.82rem',color:'var(--text3)'}}>
            <span>{thisWeekCount} of {goal} workouts</span>
            <span className="goal-pct">{pct}%</span>
          </div>
          <div className="progress-bar-bg">
            <div className="progress-bar-fg" style={{width:`${pct}%`}}/>
          </div>
          {pct >= 100 && <div style={{color:'var(--accent)',fontWeight:700,textAlign:'center',marginTop:8}}>🎉 Goal reached this week!</div>}
        </div>
      );
    }

    function WorkoutList({ workouts, onDelete }) {
      const sorted = [...workouts].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0,20);
      if (sorted.length === 0) return <div className="card"><h2>Recent Workouts</h2><div className="empty">No workouts logged yet.<br/>Add your first one!</div></div>;

      return (
        <div className="card">
          <h2>Recent Workouts</h2>
          {sorted.map(w => (
            <div key={w.id} className="workout-list-item">
              <span className="w-emoji">{emojiFor(w.type)}</span>
              <div className="w-info">
                <div className="w-type">{w.type}</div>
                <div className="w-meta">{w.date}{w.notes ? ` · ${w.notes}` : ''}</div>
              </div>
              <span className="w-dur">{w.duration}m</span>
              <button className="btn btn-sm btn-danger" onClick={() => onDelete(w.id)}>✕</button>
            </div>
          ))}
        </div>
      );
    }

    function App() {
      const [workouts, setWorkouts] = useState(() => {
        try { return JSON.parse(localStorage.getItem('fitnessWorkouts') || '[]'); } catch { return []; }
      });
      const [goal, setGoal] = useState(() => {
        const g = parseInt(localStorage.getItem('fitnessGoal') || '5', 10);
        return isNaN(g) ? 5 : g;
      });

      useEffect(() => {
        localStorage.setItem('fitnessWorkouts', JSON.stringify(workouts));
      }, [workouts]);

      useEffect(() => {
        localStorage.setItem('fitnessGoal', String(goal));
      }, [goal]);

      const addWorkout = useCallback((w) => {
        setWorkouts(prev => [w, ...prev]);
      }, []);

      const deleteWorkout = useCallback((id) => {
        setWorkouts(prev => prev.filter(w => w.id !== id));
      }, []);

      return (
        <>
          <Navbar/>
          <div className="container">
            <StatsGrid workouts={workouts}/>
            <div className="layout">
              <div>
                <AddWorkoutForm onAdd={addWorkout}/>
              </div>
              <div>
                <WeeklyChart workouts={workouts}/>
                <GoalTracker workouts={workouts} goal={goal} onGoalChange={setGoal}/>
                <WorkoutList workouts={workouts} onDelete={deleteWorkout}/>
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
